<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極沙漏計時器</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 預設主題：靜謐木質 */
            --bg-color: #e8e4dc;
            --card-bg: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.8);
            --text-color: #4a3f35;
            --frame-color: #8b5a2b;
            --glass-bg: linear-gradient(90deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.6) 20%, rgba(255,255,255,0.1) 100%);
            --sand-color: #e5a95b; 
            --shadow: 0 15px 35px rgba(139, 90, 43, 0.12);
            --glow: none;
            --btn-hover: rgba(0,0,0,0.05);
        }

        body.theme-neon {
            --bg-color: #0b0b1a;
            --card-bg: rgba(20, 20, 40, 0.6);
            --border-color: rgba(0, 255, 255, 0.25);
            --text-color: #e0e0ff;
            --frame-color: #0ff;
            --glass-bg: linear-gradient(90deg, rgba(0,255,255,0.05) 0%, rgba(0,255,255,0.2) 20%, rgba(0,255,255,0.02) 100%);
            --sand-color: #0ff;
            --shadow: 0 15px 40px rgba(0, 255, 255, 0.15);
            --glow: 0 0 12px var(--frame-color);
            --btn-hover: rgba(0, 255, 255, 0.15);
        }

        body.theme-minimal {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --text-color: #1d1d1f;
            --frame-color: #1d1d1f;
            --glass-bg: rgba(0, 0, 0, 0.03);
            --sand-color: #1d1d1f;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
            --glow: none;
            --btn-hover: #f0f0f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.6s ease, color 0.6s ease;
            overflow: hidden; /* 防止整個視窗產生捲軸 */
            padding: 10px;
        }

        /* 縮減 App 卡片尺寸與內邊距，提供最緊湊優雅的黃金比例 */
        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 520px; /* 放寬卡片以容納左右側邊欄 */
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.6s ease;
        }

        /* 縮小主題切換列，節省垂直空間 */
        .theme-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.04);
            padding: 6px 12px;
            border-radius: 30px;
        }

        .theme-dot {
            width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.2s, border-color 0.3s;
        }
        .theme-dot:hover { transform: scale(1.20); }
        .theme-dot.active { border-color: var(--text-color); transform: scale(1.1); }
        .dot-classic { background: #e5a95b; }
        .dot-neon { background: #0ff; box-shadow: 0 0 8px #0ff; }
        .dot-minimal { background: #1d1d1f; }

        /* 縮短沙漏舞台，確保即使放大時也不會溢出或破壞排版 */
        .hourglass-stage {
            width: 100%;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px 0;
            position: relative;
        }

        /* 透過縮放比例與旋轉度控制沙漏外觀 */
        .hourglass-wrapper {
            position: relative;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.08));
            cursor: pointer; 
            transform: scale(var(--hg-scale, 1)) rotate(var(--hg-rot, 0deg));
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* 縮小沙漏尺寸至高度 220px，寬度 110px */
        .hourglass {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 110px;
            height: 220px;
        }

        .cap {
            width: 100%; height: 10px; background-color: var(--frame-color);
            border-radius: 5px; box-shadow: var(--glow); z-index: 2; transition: all 0.6s ease;
        }

        .glass {
            width: 92px; height: 100px; background: var(--glass-bg);
            position: relative; overflow: hidden; border: 3px solid var(--frame-color);
            transition: all 0.6s ease; box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }
        .glass::after {
            content: ''; position: absolute; top: 0; left: 10%; width: 20%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-15deg); pointer-events: none; z-index: 3;
        }

        .top-glass {
            clip-path: polygon(0 0, 100% 0, 60% 100%, 40% 100%);
            border-bottom: none; border-radius: 6px 6px 0 0; margin-bottom: -2px;
        }

        .bottom-glass {
            clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
            border-top: none; border-radius: 0 0 6px 6px; margin-top: -2px;
        }

        .sand {
            background-color: var(--sand-color);
            width: 100%; 
            position: absolute; 
            left: 0;
            box-shadow: var(--glow);
        }

        /* 流體式沙漏動畫落點優化 */
        .stream {
            position: absolute;
            top: 50%; left: 50%;
            width: 2.5px;
            height: 98px; /* 自動適應縮小後的玻璃杯高度 */
            background: var(--sand-color);
            box-shadow: 0 0 5px var(--sand-color), 0 0 10px var(--sand-color);
            transform-origin: top center;
            opacity: 0; z-index: 5;
            transition: opacity 0.3s ease;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, black 10%, black 90%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, black 10%, black 90%, rgba(0,0,0,0) 100%);
        }

        .stream::after {
            content: '';
            position: absolute;
            top: 0; left: -1px; width: 4.5px; height: 12px;
            background: var(--sand-color);
            border-radius: 3px;
            filter: blur(0.5px);
            opacity: 0;
        }

        .stream.active { opacity: 0.9; }
        
        .stream.active::after {
            animation: dropDown 0.45s cubic-bezier(0.5, 0, 1, 0.5) infinite;
        }

        @keyframes dropDown {
            0% { top: 0; opacity: 1; transform: scaleY(1); }
            80% { top: 80px; opacity: 1; transform: scaleY(1.6); }
            100% { top: 98px; opacity: 0; transform: scaleY(0.5); }
        }

        /* 縮小時間數字的字型與上下間距 */
        .time-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.8rem; font-weight: 700;
            margin: 0; letter-spacing: -1.5px;
            text-shadow: var(--glow); transition: all 0.3s;
            line-height: 1;
        }

        /* 全新三欄式佈局 (左按鈕、中沙漏、右控制) */
        .main-layout {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 15px;
            margin-top: 5px;
        }

        .center-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }

        .presets-column {
            gap: 8px;
            width: 60px; /* 固定寬度讓按鈕對齊 */
        }

        .preset-btn {
            background: transparent;
            border: 1.5px solid var(--btn-color);
            color: var(--text-color);
            padding: 5px 0;
            width: 100%; /* 填滿欄位寬度 */
            text-align: center;
            border-radius: 12px;
            font-size: 0.8rem; font-weight: 700;
            cursor: pointer; transition: all 0.25s;
        }

        .preset-btn:hover {
            background: var(--btn-color); color: #fff;
            transform: translateX(-3px); box-shadow: 3px 3px 8px rgba(0,0,0,0.1);
        }

        .preset-btn.active {
            background: var(--btn-color); color: #fff;
            transform: scale(1.08); box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            border-color: var(--text-color);
        }

        .time-input {
            width: 100%; background: transparent; border: none;
            border-bottom: 2px solid var(--frame-color); color: var(--text-color);
            font-size: 0.85rem; font-weight: 600; text-align: center; padding: 4px 0; outline: none;
        }

        /* 控制按鈕小型化 (放在右側欄) */
        .controls-column { 
            gap: 16px; 
            width: 60px;
        }

        .icon-btn {
            background: var(--frame-color); color: var(--bg-color); border: none;
            width: 46px; height: 46px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .icon-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
        .icon-btn:active { transform: translateY(0) scale(1); }

        .icon-btn.secondary {
            background: transparent; border: 2.0px solid var(--frame-color);
            color: var(--text-color); width: 40px; height: 40px; box-shadow: none;
        }
        .icon-btn.secondary:hover { background: var(--btn-hover); }

        svg { width: 18px; height: 18px; fill: currentColor; }

        /* 行動裝置響應式：螢幕過窄時折疊回垂直佈局 */
        @media (max-width: 520px) {
            .app-card { max-width: 370px; }
            .main-layout { flex-direction: column; gap: 20px; }
            .side-column { flex-direction: row; width: 100%; flex-wrap: wrap; }
            .presets-column { gap: 6px; }
            .preset-btn { width: auto; padding: 5px 12px; border-radius: 16px; transform: none !important; }
            .preset-btn:hover { transform: translateY(-2px) !important; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
            .time-input { width: 54px; }
            .controls-column { gap: 12px; }
            .time-display { margin-top: 10px; }
        }

        .toast {
            position: fixed; top: -60px; left: 50%; transform: translateX(-50%);
            background: var(--text-color); color: var(--bg-color);
            padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); transition: top 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 100;
        }
        .toast.show { top: 20px; }

    </style>
</head>
<body class="theme-classic">

    <div class="toast" id="toast">時間到！</div>

    <div class="app-card">
        
        <!-- 主題切換 -->
        <div class="theme-switcher">
            <div class="theme-dot dot-classic active" onclick="setTheme('theme-classic', this)" title="靜謐木質"></div>
            <div class="theme-dot dot-neon" onclick="setTheme('theme-neon', this)" title="霓虹賽博"></div>
            <div class="theme-dot dot-minimal" onclick="setTheme('theme-minimal', this)" title="極簡純粹"></div>
        </div>

        <div class="main-layout">
            <!-- 左側：多彩色時間預設按鈕 -->
            <div class="side-column presets-column">
                <button class="preset-btn" style="--btn-color: #FF5252" onclick="applyPreset(10, '#FF5252', this)">10秒</button>
                <button class="preset-btn" style="--btn-color: #FF9800" onclick="applyPreset(30, '#FF9800', this)">30秒</button>
                <button class="preset-btn active" style="--btn-color: #4CAF50" onclick="applyPreset(60, '#4CAF50', this)">1分</button>
                <button class="preset-btn" style="--btn-color: #2196F3" onclick="applyPreset(180, '#2196F3', this)">3分</button>
                <button class="preset-btn" style="--btn-color: #9C27B0" onclick="applyPreset(300, '#9C27B0', this)">5分</button>
                <input type="number" id="time-input" class="time-input" value="60" min="1" placeholder="自訂">
            </div>

            <!-- 中間：舞台容器與時間顯示 -->
            <div class="center-section">
                <div class="hourglass-stage">
                    <div class="hourglass-wrapper" id="hg-wrapper" onclick="flipHourglass()" title="點擊翻轉">
                        <div class="hourglass">
                            <div class="cap"></div>
                            <div class="glass top-glass">
                                <div class="sand" id="sand-a"></div>
                            </div>
                            <div class="glass bottom-glass">
                                <div class="sand" id="sand-b"></div>
                            </div>
                            <div class="cap"></div>
                        </div>
                        <div class="stream" id="stream"></div>
                    </div>
                </div>
                <div class="time-display" id="time-display">01:00</div>
            </div>

            <!-- 右側：控制按鈕 -->
            <div class="side-column controls-column">
                <button class="icon-btn secondary" onclick="resetTimer()" title="重設">
                    <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                </button>

                <!-- 中途翻轉按鈕 -->
                <button class="icon-btn secondary" onclick="flipHourglass()" title="中途翻轉沙漏">
                    <svg viewBox="0 0 24 24"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/></svg>
                </button>
                
                <button class="icon-btn" id="play-btn" onclick="toggleTimer()" title="播放/暫停">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let timerInterval;
        let totalSeconds = 60;
        let volumeA = 0; // 初始狀態沙子全部在底部 (0代表上方無沙)
        let flipCount = 0; // 記錄翻轉次數
        
        let isRunning = false;
        let isFlipping = false;
        let audioCtx;

        // 微型化動態縮放：讓大小差異符合黃金比例比例，不破壞排版
        function updateHourglassScale(seconds) {
            // 縮放界限從原本的 0.75x~1.45x 精簡為 0.82x~1.25x 
            const scale = Math.max(0.82, Math.min(1.25, 0.72 + Math.sqrt(seconds) / 28));
            hgWrapper.style.setProperty('--hg-scale', scale);
        }

        const sandA = document.getElementById('sand-a');
        const sandB = document.getElementById('sand-b');
        const stream = document.getElementById('stream');
        const display = document.getElementById('time-display');
        const timeInput = document.getElementById('time-input');
        const toast = document.getElementById('toast');
        const hgWrapper = document.getElementById('hg-wrapper');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');

        // === 音效引擎 ===
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playAlarmSound() {
            if (!audioCtx) initAudio();
            try {
                const now = audioCtx.currentTime;
                function createChime(freq, startTime, duration) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.8, startTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                    osc.start(startTime);
                    osc.stop(startTime + duration);
                }
                createChime(880.00, now, 1.5);       
                createChime(1108.73, now + 0.1, 2.0); 
                createChime(1318.51, now + 0.2, 2.5); 
            } catch(e) {}
        }

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // === UI 與 視覺控制核心 ===

        function updatePlayButton() {
            playIcon.style.display = isRunning ? 'none' : 'block';
            pauseIcon.style.display = isRunning ? 'block' : 'none';
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        /**
         * 終極物理更新引擎：
         * 直接控制 height 與 top 對齊點，沙量 100% 物理恆定。
         */
        function updateVisuals(transitionType = 'linear') {
            let amountA = totalSeconds > 0 ? volumeA / totalSeconds : 0;
            let amountB = 1 - amountA;

            let transitionStyle = 'none';
            if (transitionType === 'smooth') {
                transitionStyle = 'top 0.6s cubic-bezier(0.4, 0, 0.2, 1), height 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            } else if (transitionType === 'linear') {
                transitionStyle = 'top 1s linear, height 1s linear';
            }

            sandA.style.transition = transitionStyle;
            sandB.style.transition = transitionStyle;

            sandA.style.height = `${amountA * 100}%`;
            sandB.style.height = `${amountB * 100}%`;

            if (flipCount % 2 === 0) {
                sandA.style.top = `${(1 - amountA) * 100}%`;
                sandB.style.top = `${(1 - amountB) * 100}%`;
            } else {
                sandA.style.top = `0%`;
                sandB.style.top = `0%`;
            }
            
            sandA.style.transform = 'none';
            sandB.style.transform = 'none';

            let displaySecs = (flipCount % 2 === 0) ? volumeA : totalSeconds - volumeA;
            
            if (displaySecs === 0 && !isRunning) {
                display.innerText = formatTime(totalSeconds);
            } else {
                display.innerText = formatTime(displaySecs);
            }
        }

        function applyPreset(sec, color, btn) {
            initAudio();
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            document.body.style.setProperty('--sand-color', color);
            timeInput.value = sec;
            
            clearInterval(timerInterval);
            isRunning = false;
            updatePlayButton();
            stream.classList.remove('active');

            totalSeconds = sec;
            volumeA = 0; 
            
            flipCount = 0; 
            hgWrapper.style.setProperty('--hg-rot', `0deg`);
            stream.style.transform = `translate(-50%, 0) rotate(0deg)`;
            
            updateVisuals('none');
            updateHourglassScale(sec);
        }

        function setTheme(themeName, element) {
            document.body.className = themeName;
            document.querySelectorAll('.theme-dot').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.body.style.removeProperty('--sand-color');
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        }

        timeInput.addEventListener('input', () => {
            if (isRunning) return;
            const val = parseInt(timeInput.value);
            if (val > 0) {
                totalSeconds = val;
                volumeA = (flipCount % 2 === 0) ? 0 : val; 
                updateVisuals('none');
                updateHourglassScale(val); 
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            }
        });

        function toggleTimer() {
            initAudio();
            if (isRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            let displaySecs = (flipCount % 2 === 0) ? volumeA : totalSeconds - volumeA;
            if (displaySecs <= 0) {
                flipHourglass();
                return;
            }

            isRunning = true;
            updatePlayButton();
            stream.classList.add('active');

            timerInterval = setInterval(() => {
                if (flipCount % 2 === 0) {
                    if (volumeA > 0) volumeA--;
                } else {
                    if (volumeA < totalSeconds) volumeA++;
                }

                updateVisuals('linear');

                let currentSecs = (flipCount % 2 === 0) ? volumeA : totalSeconds - volumeA;
                if (currentSecs <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    updatePlayButton();
                    stream.classList.remove('active');
                    display.innerText = "00:00"; 
                    showToast("⏳ 時間到！");
                    playAlarmSound();
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            updatePlayButton();
            stream.classList.remove('active');
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            updatePlayButton();
            stream.classList.remove('active');
            
            const inputVal = parseInt(timeInput.value);
            totalSeconds = isNaN(inputVal) || inputVal <= 0 ? 60 : inputVal;
            volumeA = 0; 
            
            flipCount = 0;
            hgWrapper.style.setProperty('--hg-rot', `0deg`);
            stream.style.transform = `translate(-50%, 0) rotate(0deg)`;
            
            updateVisuals('none');
            updateHourglassScale(totalSeconds);
        }

        function flipHourglass() {
            if (isFlipping || totalSeconds <= 0) return;
            initAudio();
            isFlipping = true;

            let displaySecsBefore = (flipCount % 2 === 0) ? volumeA : totalSeconds - volumeA;

            flipCount++;
            let newRot = flipCount * 180;

            hgWrapper.style.setProperty('--hg-rot', `${newRot}deg`);

            stream.style.transition = 'transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
            stream.style.transform = `translate(-50%, 0) rotate(${-newRot}deg)`;

            updateVisuals('smooth');

            setTimeout(() => {
                isFlipping = false;
            }, 600);

            if (displaySecsBefore === 0 && !isRunning) {
                startTimer();
            }
        }

        // 初始化：套用預設時間的沙漏大小
        updateHourglassScale(totalSeconds);

        // 預設點選 1 分鐘
        document.querySelector('.preset-btn.active').click();

    </script>
</body>
</html>
