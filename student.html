<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>🛡️ 冒險者公會 - 狀態確認卡</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primary: #8B4513; --accent: #CD853F;
      --bg: #F4E4BC; --card: #FDF5E6; 
      --text-main: #3E2723; --text-light: #5D4037; --muted: #8D6E63;
      --success: #166534; --danger: #b91c1c; --danger-bg: #fee2e2;
    }
    
    * { box-sizing: border-box; }
    body { 
      font-family: "Microsoft JhengHei", sans-serif; 
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%238b4513' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
      background-color: var(--bg);
      color: var(--text-main); 
      margin: 0; 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      align-items: center;
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 500px; /* 平板與手機上的最佳寬度 */
      margin-top: 20px;
    }

    .card { 
      background: var(--card); 
      border: 3px solid var(--primary); 
      border-radius: 16px; 
      padding: 24px; 
      box-shadow: 4px 4px 15px rgba(139, 69, 19, 0.15); 
      position: relative;
    }

    .header-section { text-align: center; margin-bottom: 20px; border-bottom: 2px dashed var(--primary); padding-bottom: 15px; }
    
    .avatar-circle {
      width: 70px; height: 70px; 
      background: var(--primary); color: #fff; 
      border-radius: 50%; display: grid; place-items: center; 
      font-size: 32px; font-weight: 900; 
      margin: 0 auto 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    h2 { margin: 0 0 5px; font-size: 24px; color: var(--primary); font-weight: 900; }
    
    .stats-container {
      display: flex; gap: 10px; justify-content: center; margin-top: 15px;
    }
    .stat-box {
      background: #fff; border: 2px solid #D2B48C; border-radius: 12px;
      padding: 10px; flex: 1; text-align: center;
    }
    .stat-box .title { font-size: 13px; color: var(--muted); font-weight: bold; margin-bottom: 4px; }
    .stat-box .value { font-size: 20px; font-weight: 900; }
    .val-exp { color: var(--primary); }
    .val-coin { color: #b45309; }

    .debt-title { font-size: 18px; font-weight: 900; color: var(--danger); margin: 25px 0 10px; display: flex; align-items: center; gap: 8px; }
    
    .task-item { 
      background: #fff; padding: 14px; margin-bottom: 12px; 
      border: 2px solid rgba(0,0,0,0.1); border-radius: 10px; 
      display: flex; flex-direction: column; gap: 8px;
      transition: transform 0.2s;
    }
    .task-item:active { transform: scale(0.98); }
    .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .task-name { font-weight: bold; font-size: 16px; line-height: 1.4; color: var(--text-main); }
    
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 900; white-space: nowrap; flex-shrink: 0; }
    .badge.miss { background: var(--danger-bg); color: var(--danger); border: 1px solid #fca5a5; }
    .badge.redo { background: #ffedd5; color: #ea580c; border: 1px solid #fdba74; }
    .badge.subj { background: #E6D2B5; color: var(--primary); padding: 2px 6px; font-size: 11px; margin-right: 6px; }

    .success-msg { 
      text-align: center; padding: 30px 10px; background: #f0fdf4; 
      border: 2px dashed var(--success); border-radius: 12px; 
      color: var(--success); font-weight: bold; font-size: 18px; line-height: 1.6;
    }

    #loading { text-align: center; padding: 40px; color: var(--primary); font-size: 18px; font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card" id="mainCard">
        
      <div id="loading"><i class="bi bi-hourglass-split" style="font-size: 32px; display:block; margin-bottom: 10px;"></i>正在聯絡公會...</div>

      <div id="contentArea" class="hidden">
          <div class="header-section">
              <div class="avatar-circle" id="stNo"></div>
              <h2 id="stName">載入中</h2>
              <div id="stRank" style="font-size:15px; font-weight:bold; margin-top:5px;"></div>
              
              <div class="stats-container">
                  <div class="stat-box">
                      <div class="title">⭐ 經驗值 (EXP)</div>
                      <div class="value val-exp" id="stExp">0</div>
                  </div>
                  <div class="stat-box">
                      <div class="title">💰 金幣</div>
                      <div class="value val-coin" id="stCoin">0</div>
                  </div>
              </div>
          </div>

          <div id="taskListArea"></div>
          
          <div id="updateTime" style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--muted); font-weight: bold;"></div>
      </div>
      
    </div>
  </div>

  <script type="module">
    // ⚠️ 這裡請貼上跟老師端完全一樣的 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA0UhDKqcsChUa8OZWxZUmuFdKATfgiL8E",
      authDomain: "homework-hc906.firebaseapp.com",
      projectId: "homework-hc906",
      storageBucket: "homework-hc906.firebasestorage.app",
      messagingSenderId: "1051903125085",
      appId: "1:1051903125085:web:b205f868669ea7d5c34fb4",
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"; 

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get('uid');
    const no = parseInt(urlParams.get('no'));

const levelConfig = [
    { lv: 1, exp: 0, coins: 0, rank: "🌱 迷路的小村民", color: "#9ca3af" },
    { lv: 2, exp: 10, coins: 5, rank: "🪵 木劍小勇者", color: "#86efac" },
    { lv: 3, exp: 30, coins: 10, rank: "🛡️ 銅牌小護衛", color: "#22c55e" },
    { lv: 4, exp: 60, coins: 10, rank: "🐾 森林小遊俠", color: "#0ea5e9" },
    { lv: 5, exp: 100, coins: 15, rank: "🗡️ 鐵甲小騎士", color: "#3b82f6" },
    { lv: 6, exp: 140, coins: 15, rank: "🦅 飛鷹小偵探", color: "#6366f1" },
    { lv: 7, exp: 180, coins: 20, rank: "🐺 灰狼小戰士", color: "#8b5cf6" },
    { lv: 8, exp: 220, coins: 20, rank: "🧙🏻‍♀️ 見習魔法師", color: "#a855f7" },
    { lv: 9, exp: 260, coins: 20, rank: "🦄 獨角獸騎士", color: "#d946ef" },
    { lv: 10, exp: 300, coins: 30, rank: "🌟 星星守護者", color: "#ec4899" },
    { lv: 11, exp: 350, coins: 30, rank: "🔥 烈焰小法師", color: "#f43f5e" },
    { lv: 12, exp: 400, coins: 30, rank: "💧 水波小精靈", color: "#ef4444" },
    { lv: 13, exp: 450, coins: 30, rank: "🌪️ 狂風小飛俠", color: "#f97316" },
    { lv: 14, exp: 500, coins: 30, rank: "⚡ 閃電小超人", color: "#ea580c" },
    { lv: 15, exp: 550, coins: 40, rank: "❄️ 冰雪魔法使", color: "#f59e0b" },
    { lv: 16, exp: 600, coins: 40, rank: "🦁 獅鷲小騎士", color: "#eab308" },
    { lv: 17, exp: 650, coins: 40, rank: "🏹 神準小獵人", color: "#ca8a04" },
    { lv: 18, exp: 700, coins: 40, rank: "⚔️ 雙劍小達人", color: "#14b8a6" },
    { lv: 19, exp: 750, coins: 40, rank: "🛡️ 聖光小衛兵", color: "#06b6d4" },
    { lv: 20, exp: 800, coins: 50, rank: "👑 城堡守衛隊長", color: "#0284c7" },
    { lv: 21, exp: 860, coins: 50, rank: "🐉 飛龍馴獸師", color: "#2563eb" },
    { lv: 22, exp: 920, coins: 50, rank: "🦖 恐龍小霸王", color: "#4f46e5" },
    { lv: 23, exp: 980, coins: 50, rank: "🌋 火山探險家", color: "#7c3aed" },
    { lv: 24, exp: 1040, coins: 50, rank: "🌌 星空小旅人", color: "#9333ea" },
    { lv: 25, exp: 1100, coins: 50, rank: "🌠 彗星觀測者", color: "#c026d3" },
    { lv: 26, exp: 1170, coins: 50, rank: "🏅 青銅大師", color: "#db2777" },
    { lv: 27, exp: 1240, coins: 50, rank: "🥈 白銀大師", color: "#e11d48" },
    { lv: 28, exp: 1310, coins: 50, rank: "🥇 黃金大師", color: "#ea580c" },
    { lv: 29, exp: 1380, coins: 50, rank: "💎 鑽石大師", color: "#d97706" },
    { lv: 30, exp: 1450, coins: 50, rank: "🏆 榮耀大師", color: "#65a30d" },
    { lv: 31, exp: 1530, coins: 50, rank: "🧚 森林精靈王", color: "#16a34a" },
    { lv: 32, exp: 1610, coins: 60, rank: "🦅 鳳凰守護者", color: "#059669" },
    { lv: 33, exp: 1690, coins: 60, rank: "🦄 幻獸大師", color: "#0d9488" },
    { lv: 34, exp: 1770, coins: 60, rank: "⚡ 雷神小勇士", color: "#0891b2" },
    { lv: 35, exp: 1850, coins: 60, rank: "☀️ 太陽神官", color: "#0284c7" },
    { lv: 36, exp: 1940, coins: 60, rank: "👑 傳說中的勇者", color: "#4f46e5" },
    { lv: 37, exp: 2030, coins: 60, rank: "🌌 宇宙大探險家", color: "#7c3aed" },
    { lv: 38, exp: 2120, coins: 60, rank: "🌟 銀河守護神", color: "#be185d" },
    { lv: 39, exp: 2210, coins: 60, rank: "🐉 萬獸之王", color: "#e11d48" },
    { lv: "Max", exp: 2300, coins: 100, rank: "✨ 全班的超級英雄", color: "#ffd700" }
];

    function getRankHtml(exp) {
        let currentLevel = levelConfig[0];
        for (let i = levelConfig.length - 1; i >= 0; i--) {
            if (exp >= levelConfig[i].exp) {
                currentLevel = levelConfig[i];
                break;
            }
        }
        return `<span style="color:${currentLevel.color};">Lv.${currentLevel.lv} ${currentLevel.rank}</span>`;
    }

    async function loadData() {
        if (!uid || !no) {
            document.getElementById('loading').innerHTML = "❌ 掃描的 QR Code 網址有誤<br><span style='font-size:14px;color:#888;margin-top:10px;display:block;'>缺少老師代碼或座號</span>";
            return;
        }

        try {
            const docSnap = await getDoc(doc(db, "public_boards", uid));
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('contentArea').classList.remove('hidden');

            if (docSnap.exists()) {
                const data = docSnap.data();
                const student = data.summary.find(s => s.no === no);
                
                document.getElementById('updateTime').innerText = `最後更新：${data.lastUpdated}`;

                if (student) {
                    document.getElementById('stNo').innerText = student.no;
                    document.getElementById('stName').innerText = student.name;
                    
                    // 🌟 渲染經驗值、金幣與稱號
                    document.getElementById('stExp').innerText = student.exp || 0;
                    document.getElementById('stCoin').innerText = student.coins || 0;
                    document.getElementById('stRank').innerHTML = getRankHtml(student.exp || 0);
                    
                    // 渲染任務清單
                    if (student.debts.length === 0) {
                        document.getElementById('taskListArea').innerHTML = `
                            <div class="success-msg">
                                <i class="bi bi-shield-fill-check" style="font-size: 36px; display:block; margin-bottom:10px;"></i>
                                太棒了！<br>所有任務皆已順利討伐完畢！
                            </div>`;
                    } else {
                        let html = `<div class="debt-title"><i class="bi bi-exclamation-triangle-fill"></i> 待處理任務 (${student.debts.length})</div>`;
                        
                        // 依照日期與科目排序
                        student.debts.sort((a, b) => a.date < b.date ? 1 : -1);

                        student.debts.forEach(d => {
                            const badge = d.st === 2 ? '<span class="badge redo">需訂正</span>' : '<span class="badge miss">尚未繳交</span>';
                            const dateTxt = d.date ? `<div style="font-size:12px; color:#888; margin-top:4px;"><i class="bi bi-calendar"></i> 發布於：${d.date}</div>` : '';
                            
                            html += `
                            <div class="task-item">
                                <div class="task-header">
                                    <div class="task-name"><span class="badge subj">${d.subject}</span>${d.title}${dateTxt}</div>
                                    ${badge}
                                </div>
                            </div>`;
                        });
                        document.getElementById('taskListArea').innerHTML = html;
                    }
                } else {
                    document.getElementById('contentArea').innerHTML = "<h3 style='text-align:center;color:red;'>找不到該座號的冒險者</h3>";
                }
            } else {
                document.getElementById('contentArea').innerHTML = "<h3 style='text-align:center;'>尚未發布資料<br><span style='font-size:14px;color:#888;'>請提醒公會長(老師)開啟系統並連線</span></h3>";
            }
        } catch (error) {
            console.error(error);
            document.getElementById('loading').innerHTML = "❌ 連線失敗，請檢查網路狀態";
        }
    }

    loadData();
  </script>
</body>
</html>
