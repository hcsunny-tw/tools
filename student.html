/* ============================================================
   📐 新版局：上方橫幅萌寵 + 下方左右雙欄
   ============================================================ */
/* 調整內容區的 Flex 垂直排版 */
#contentArea {
  display: flex;
  flex-direction: column;
  gap: 15px;
  height: 100%;
  overflow: hidden;
}

/* 萌寵橫幅區域 (放在頂部) */
.pet-sanctuary-wrap {
  position: relative;
  width: 100%;
  flex-shrink: 0;
  border-radius: 16px;
  border: 2.5px solid #84cc16;
  background: linear-gradient(180deg, #dff6ff 0%, #f0fdf4 58%, #bef264 58%, #84cc16 100%);
  padding: 10px 15px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
  transition: all 0.4s ease;
  min-height: 160px; /* 橫幅高度適中 */
  display: flex;
  flex-direction: column;
}

.pet-sanctuary-inner {
  display: grid;
  grid-template-columns: 1fr 280px; /* 左側廣闊草地，右側圖鑑與集氣條 */
  gap: 15px;
  align-items: end;
  height: 100%;
}

.pet-left-stage {
  display: flex;
  flex-direction: column;
  height: 100%;
  justify-content: space-between;
}

.pet-right-stats {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 6px;
  height: 100%;
}

/* 讓草地舞台變寬 */
.pet-meadow-track {
  position: relative;
  width: 100%;
  height: 90px;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
}

/* 調整下方網格 */
.board-grid {
  display: grid;
  grid-template-columns: 350px 1fr; /* 左個人資料 / 右任務 */
  gap: 20px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
      .left-pane {

    .pet-sanctuary-wrap {
      position: relative;

/* ============================================================
   🐾 優化萌寵動畫 (參考 index.html 的 Hop 與 Sway)
   ============================================================ */
@keyframes petHappyBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes petWalkStep { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
@keyframes petScratchAnim { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
/* 新增：興奮跳躍與左右搖擺 */
@keyframes petHop { 
  0%, 100% { transform: translateY(0) scale(1); } 
  50% { transform: translateY(-15px) scale(1.05); } 
}
@keyframes petSway {
  0%, 100% { transform: rotate(-6deg); }
  50% { transform: rotate(6deg); }
}

.pet-bob { animation: petHappyBob 1.8s ease-in-out infinite; }
.pet-waddle { animation: petWalkStep 0.45s ease-in-out infinite; }
.pet-scratch { animation: petScratchAnim 0.35s ease-in-out infinite; }
.pet-hop { animation: petHop 0.4s ease-in-out infinite; }
.pet-sway { animation: petSway 2s ease-in-out infinite; transform-origin: bottom center;}

    @keyframes heartPop { 0% { opacity: 1; transform: translateY(0) scale(0.8); } 100% { opacity: 0; transform: translateY(-45px) scale(1.6); } }
    .heart-float { position: absolute; font-size: 22px; animation: heartPop 0.9s forwards ease-out; pointer-events: none; z-index: 20; }

    .gacha-bar-fill { height: 100%; background: linear-gradient(90deg, #fcd34d, #f59e0b); width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

    // 🎮 Web Audio API 音效引擎
    let audioCtx = null;
    window.playNativeSound = function(type = 'clear') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const master = audioCtx.createGain();
        master.gain.value = 0.22;
        master.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        const playTone = (freq, wave, startTime, duration) => {
          const osc = audioCtx.createOscillator();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, startTime);
          osc.connect(master);
          osc.start(startTime);
          osc.stop(startTime + duration);
        };

        if (type === 'tick') {
          playTone(880, 'sine', now, 0.08);
          playTone(1760, 'sine', now + 0.08, 0.12);
        } else if (type === 'chomp') {
          playTone(320, 'triangle', now, 0.09);
          playTone(440, 'triangle', now + 0.1, 0.1);
        } else if (type === 'error') {
          playTone(220, 'sawtooth', now, 0.14);
          playTone(165, 'sawtooth', now + 0.15, 0.22);
        } else {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            playTone(freq, 'square', now + i * 0.11, i === 3 ? 0.55 : 0.11);
          });
        }
      } catch(e) {}
    };

    window.playStudentPetCry = function(kind = 'cat') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const n = audioCtx.currentTime + 0.01;
        const r = 0.94 + Math.random() * 0.16;
        const master = audioCtx.createGain();
        master.gain.value = 0.55;
        master.connect(audioCtx.destination);
        
        const osc = audioCtx.createOscillator();
        osc.type = kind === 'dog' ? 'sawtooth' : 'triangle';
        if (kind === 'dog') {
          osc.frequency.setValueAtTime(420 * r, n);
          osc.frequency.exponentialRampToValueAtTime(190 * r, n + 0.13);
          osc.start(n); osc.stop(n + 0.18);
        } else {
          osc.frequency.setValueAtTime(680 * r, n);
          osc.frequency.exponentialRampToValueAtTime(1120 * r, n + 0.18);
          osc.frequency.exponentialRampToValueAtTime(640 * r, n + 0.58);
          osc.start(n); osc.stop(n + 0.62);
        }
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.001, n);
        g.gain.exponentialRampToValueAtTime(0.3, n + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, n + 0.6);
        osc.connect(g).connect(master);
      } catch (e) {}
    };

    function getCookieStoreKey() {
      return `hw_cookies_${uid}_${no}_${getTodayStr()}`;
    }
    function getCookieCount() {
      const val = localStorage.getItem(getCookieStoreKey());
      if (val === null) {
        localStorage.setItem(getCookieStoreKey(), '3');
        return 3;
      }
      return Math.max(0, parseInt(val) || 0);
    }
    function setCookieCount(cnt) {
      localStorage.setItem(getCookieStoreKey(), String(Math.max(0, cnt)));
      updateCookieUI();
    }
    function updateCookieUI() {
      const cnt = getCookieCount();
      const btnEl = document.getElementById('btnFeedPet');
      if (btnEl) {
        if (cnt <= 0) {
          btnEl.classList.add('empty');
          btnEl.innerHTML = `🍪 賺餅乾 (0)`;
        } else {
          btnEl.classList.remove('empty');
          btnEl.innerHTML = `🍪 餵食 (<span id="cookieCountTxt">${cnt}</span>)`;
        }
      }
    }

    // ============================================================
    // 🗂️ 智慧抽取作業項目類別 & 同項目自動前後歸類排序
    // ============================================================
    const BOOK_KEYWORDS = ["數習", "數練", "數作", "國習", "國作", "甲本", "乙本", "聯絡簿", "聽寫", "生字", "圈詞", "造詞", "學習單", "作文本", "閱讀", "英文", "社習", "社作", "自習", "自作", "考卷", "數卷", "國卷"];

    function extractTaskCategory(d) {
      const titleStr = (d.title || "").trim();
      for (let kw of BOOK_KEYWORDS) {
        if (titleStr.includes(kw)) return kw;
      }
      // 若為「11/14 聯絡簿 P.32」這種日期開頭格式，移除開頭日期再抓關鍵字
      const withoutDate = titleStr.replace(/^\d{1,2}[\/\-]\d{1,2}\s*/, '');
      const match = withoutDate.match(/^[\u4e00-\u9fa5]+/);
      if (match && !["完成", "寫", "訂正", "背", "帶", "交"].includes(match[0])) {
        return match[0].substring(0, 3);
      }
      return d.subject || "一般";
    }

    function updateExpUI(exp) {
      let currentLevel = levelConfig[0];
      let nextLevel = levelConfig[1];
      let isMax = false;
      for (let i = 0; i < levelConfig.length; i++) {
        if (exp >= levelConfig[i].exp) {
          currentLevel = levelConfig[i];
          nextLevel = levelConfig[i + 1] || currentLevel;
        }
      }
      if (currentLevel.lv === "Max" || nextLevel === currentLevel) isMax = true;
      document.getElementById('stRank').innerHTML = `<span style="color:${currentLevel.color};">Lv.${currentLevel.lv} ${currentLevel.rank}</span>`;
      const barFill = document.getElementById('expBarFill');
      const expText = document.getElementById('expText');
      if (isMax) {
        barFill.style.width = '100%'; expText.innerText = `MAX (已達最高等級)`;
      } else {
        const percentage = Math.min(100, Math.max(0, ((exp - currentLevel.exp) / (nextLevel.exp - currentLevel.exp)) * 100));
        setTimeout(() => { barFill.style.width = `${percentage}%`; }, 100);
        expText.innerText = `距離下一級還差 ${nextLevel.exp - exp} 點`;
      }
    }

    function fireConfetti() {
      setTimeout(() => { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#fca5a5', '#fcd34d', '#86efac', '#93c5fd', '#d8b4fe'] }); }, 300); 
    }

    function calcOverdueDays(dateStr) {
      if (!dateStr) return 0;
      const parts = dateStr.split('-');
      if (parts.length !== 3) return 0;
      const taskDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      const tParts = getTodayStr().split('-');
      const todayDate = new Date(parseInt(tParts[0]), parseInt(tParts[1]) - 1, parseInt(tParts[2]));
      return Math.max(0, Math.floor((todayDate - taskDate) / (1000 * 60 * 60 * 24)));
    }

    function renderTaskListArea(student) {
      if (student.debts.length === 0) {
        document.getElementById('btnRecommend').classList.remove('btn-locked');
        document.getElementById('btnRecommend').title = "好站推薦";
        document.getElementById('taskListArea').innerHTML = `
          <div class="success-msg">
            <i class="bi bi-shield-fill-check success-icon"></i>
            太棒了！<br>所有任務皆已順利討伐完畢！<br>
            <span style="font-size:14px; color:#15803d; margin-top:8px;">👑 快跟左邊草地上的專屬萌寵互動吧！</span>
          </div>`;
        fireConfetti();
      } else {
        document.getElementById('btnRecommend').classList.add('btn-locked');
        document.getElementById('btnRecommend').title = "作業繳齊後解鎖";
        
        // 1. 計算書包確認清單 & 為每筆任務標記 category
        const bookSummary = {};
        const enrichedDebts = student.debts.map(d => {
          const cat = extractTaskCategory(d);
          bookSummary[cat] = (bookSummary[cat] || 0) + 1;
          return { ...d, _cat: cat };
        });

        // 2. 🗂️ 自動將「同項目類別」排在前後項 (同類別再依名稱與日期排序)
        enrichedDebts.sort((a, b) => {
          if (a._cat !== b._cat) {
            return a._cat.localeCompare(b._cat, 'zh-Hant-TW');
          }
          const titleCmp = (a.title || '').localeCompare(b.title || '', 'zh-Hant-TW', { numeric: true });
          if (titleCmp !== 0) return titleCmp;
          return (a.date || '') < (b.date || '') ? 1 : -1;
        });

        // 3. 渲染書包確認清單 (依項目名稱排序)
        const packHtml = Object.entries(bookSummary)
          .sort((a, b) => a[0].localeCompare(b[0], 'zh-Hant-TW'))
          .map(([book, count]) => {
            const isChecked = localStorage.getItem(getPackStorageKey(book)) === '1';
            const safeBook = book.replace(/'/g, "\\'");
            return `<span class="pack-item ${isChecked ? 'checked' : ''}" onclick="window.togglePack(this, '${safeBook}')">
              <i class="bi ${isChecked ? 'bi-check-circle-fill' : 'bi-circle'}"></i> ${book}(${count})
            </span>`;
          }).join('');
        
        let cardsHtml = '';
        enrichedDebts.forEach((d, idx) => {
          const taskKey = encodeURIComponent(`${d.date || ''}_${d.subject || ''}_${d.title || idx}`);
          const isSelfDone = localStorage.getItem(getTaskDoneStorageKey(taskKey)) === '1';
          const overdueDays = calcOverdueDays(d.date);
          const isUrgent = overdueDays >= 3;

          const badge = d.st === 2 ? '<span class="badge redo">需訂正</span>' : '<span class="badge miss">尚未繳交</span>';
          const urgentHtml = isUrgent ? `<span class="urgent-tag"><i class="bi bi-fire"></i> 拖欠${overdueDays}天</span>` : '';
          const safeTitle = (d.title || '').replace(/'/g, "\\'");

          cardsHtml += `
            <div class="task-item ${isUrgent ? 'is-urgent' : ''} ${isSelfDone ? 'self-done' : ''}" id="taskCard_${taskKey}">
              <div>
                <div class="task-header">
                  <div class="task-name">
                    <span class="cat-tag">${d._cat}</span>${d.title}
                  </div>
                  ${badge}
                </div>
                <div class="self-done-stamp"><i class="bi bi-patch-check-fill"></i> 已在座位寫完，待檢查</div>
              </div>
              <div class="task-footer-row">
                <div style="font-size:11px; color:#888; font-weight:bold;">
                  <i class="bi bi-calendar3"></i> ${d.date || '無日期'}${urgentHtml}
                </div>
                <div class="task-btn-group">
                  <button class="quick-timer-btn" onclick="window.openFocusTimer('${safeTitle}', '${taskKey}')">
                    <i class="bi bi-stopwatch"></i> 專注
                  </button>
                  <button class="self-check-btn" onclick="window.toggleSelfDoneTask('${taskKey}')">
                    <i class="bi bi-check2-circle"></i> ${isSelfDone ? '已寫完' : '寫完了'}
                  </button>
                </div>
              </div>
            </div>`;
        });

        document.getElementById('taskListArea').innerHTML = `
          <div class="summary-box">
            <div class="summary-title"><i class="bi bi-backpack"></i> 帶回家書包確認清單 (點擊打勾打包)</div>
            <div class="pack-items-container">${packHtml}</div>
          </div>
          <div class="debt-title">
            <span><i class="bi bi-exclamation-triangle-fill"></i> 待處理任務 (${enrichedDebts.length} 項・已依同項目自動歸類)</span>
            <span style="font-size:11px; color:var(--muted); font-weight:bold;">寫完可點「寫完了」蓋章</span>
          </div>
          <div class="tasks-scroll-box">
            <div class="tasks-grid-inner">${cardsHtml}</div>
          </div>`;
      }
    }

      renderTaskListArea(student);
    }

    async function loadData() {
      if (!uid || !no) { document.getElementById('loading').innerHTML = "❌ 掃描的 QR Code 網址有誤"; return; }
      try {
        const docSnap = await getDoc(doc(db, "public_boards", uid));
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('contentArea').classList.remove('hidden');
        document.getElementById('fabTools').classList.remove('hidden');

        if (docSnap.exists()) {
          const data = docSnap.data();
          const student = data.summary.find(s => s.no === no);
          document.getElementById('updateTime').innerText = `最後更新：${data.lastUpdated}`;

          if (student) {
            renderFullStudentCard(student);
          } else {
            document.getElementById('contentArea').innerHTML = "<h3 style='text-align:center;color:red;'>找不到該座號的冒險者</h3>";
          }
        } else {
          document.getElementById('contentArea').innerHTML = "<h3 style='text-align:center;'>尚未發布資料</h3>";
        }
      } catch (error) {
        console.error(error);
        document.getElementById('loading').innerHTML = "❌ 連線失敗，請檢查網路狀態";
      }
    }
    loadData();

    // ============================================================
    // ⏱️ 懸浮拖曳計時面板 (與能量餅乾獎勵、任務完成蓋章連動)
    // ============================================================
    const panel = document.getElementById('toolPanel');
    const handle = document.getElementById('dragHandle');
    let isDragging = false, offsetX = 0, offsetY = 0;

    function startDrag(e) {
      if (e.target.closest('#closePanel')) return;
      isDragging = true;
      const rect = panel.getBoundingClientRect();
      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      offsetX = clientX - rect.left; offsetY = clientY - rect.top;
      panel.style.transform = 'none'; panel.style.left = rect.left + 'px'; panel.style.top = rect.top + 'px';
    }
    function doDrag(e) {
      if (!isDragging) return; e.preventDefault();
      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      panel.style.left = (clientX - offsetX) + 'px'; panel.style.top = (clientY - offsetY) + 'px';
    }
    function endDrag() { isDragging = false; }

    handle.addEventListener('mousedown', startDrag); document.addEventListener('mousemove', doDrag); document.addEventListener('mouseup', endDrag);
    handle.addEventListener('touchstart', startDrag, { passive: false }); document.addEventListener('touchmove', doDrag, { passive: false }); document.addEventListener('touchend', endDrag);

    let toolInterval;
    let timeInSeconds = 0;
    let initialTargetSeconds = 0;
    let isRunning = false;
    let currentMode = 'stopwatch';
    let pomoState = 'work';
    const WORK_MINUTES = 25;
    const BREAK_MINUTES = 5;
    const timeDisplay = document.getElementById('timeDisplay');
    const btnStartPause = document.getElementById('btnStartPause');
    const minInput = document.getElementById('minInput');
    const pomoStatus = document.getElementById('pomodoroStatus');

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }
    function updateDisplay() { timeDisplay.innerText = formatTime(timeInSeconds); }

    window.openTool = function(mode) {
      currentMode = mode; isRunning = false; clearInterval(toolInterval);
      if (mode !== 'timer') currentFocusedTaskKey = null;
      btnStartPause.innerText = "開始"; btnStartPause.className = "btn-start";
      panel.classList.remove('hidden');
      panel.style.transform = 'translateX(-50%)'; panel.style.left = '50%'; panel.style.top = '15%';
      document.getElementById('timerInputs').classList.add('hidden'); pomoStatus.classList.add('hidden');

      if (mode === 'stopwatch') {
        document.getElementById('toolTitle').innerHTML = "<i class='bi bi-stopwatch'></i> 專注碼表";
        timeInSeconds = 0;
        initialTargetSeconds = 0;
      } else if (mode === 'timer') {
        document.getElementById('toolTitle').innerHTML = "<i class='bi bi-hourglass-split'></i> 倒數計時器";
        document.getElementById('timerInputs').classList.remove('hidden');
        timeInSeconds = (parseInt(minInput.value) || 10) * 60;
        initialTargetSeconds = timeInSeconds;
      } else if (mode === 'pomodoro') {
        document.getElementById('toolTitle').innerHTML = "🍅 番茄鐘工作法";
        pomoStatus.classList.remove('hidden');
        pomoState = 'work'; pomoStatus.innerHTML = `🍅 專注時間 (${WORK_MINUTES}分)`;
        pomoStatus.style.color = "#ef4444"; pomoStatus.style.background = "#fee2e2";
        timeInSeconds = WORK_MINUTES * 60;
        initialTargetSeconds = timeInSeconds;
      }
      updateDisplay();
    };

    document.getElementById('btnStopwatch').addEventListener('click', () => window.openTool('stopwatch'));
    document.getElementById('btnTimer').addEventListener('click', () => window.openTool('timer'));
    document.getElementById('btnPomodoro').addEventListener('click', () => window.openTool('pomodoro'));
    document.getElementById('closePanel').addEventListener('click', () => panel.classList.add('hidden'));

    minInput.addEventListener('change', (e) => {
      if (!isRunning && currentMode === 'timer') {
        timeInSeconds = Math.max(1, parseInt(e.target.value) || 1) * 60;
        initialTargetSeconds = timeInSeconds;
        updateDisplay();
      }
    });

    function onFocusCompleteReward() {
      if (initialTargetSeconds >= 300) {
        setCookieCount(getCookieCount() + 1);
        showToastMsg("🎉 專注挑戰成功！獲得 1 塊能量餅乾 🍪！");
      }
      if (currentFocusedTaskKey) {
        localStorage.setItem(getTaskDoneStorageKey(currentFocusedTaskKey), '1');
        if (currentStudent) renderTaskListArea(currentStudent);
      }
    }

    btnStartPause.addEventListener('click', () => {
      if (isRunning) {
        clearInterval(toolInterval); isRunning = false; btnStartPause.innerText = "繼續"; btnStartPause.className = "btn-start";
      } else {
        isRunning = true; btnStartPause.innerText = "暫停"; btnStartPause.className = "btn-pause";
        toolInterval = setInterval(() => {
          if (currentMode === 'stopwatch') {
            timeInSeconds++;
          } else {
            if (timeInSeconds > 0) timeInSeconds--;
            if (timeInSeconds === 0) {
              window.playNativeSound('clear');
              if (currentMode === 'pomodoro') {
                if (pomoState === 'work') {
                  onFocusCompleteReward();
                  pomoState = 'break'; pomoStatus.innerHTML = `☕ 休息時間 (${BREAK_MINUTES}分)`;
                  pomoStatus.style.color = "#059669"; pomoStatus.style.background = "#d1fae5";
                  timeInSeconds = BREAK_MINUTES * 60;
                } else {
                  pomoState = 'work'; pomoStatus.innerHTML = `🍅 專注時間 (${WORK_MINUTES}分)`;
                  pomoStatus.style.color = "#ef4444"; pomoStatus.style.background = "#fee2e2";
                  timeInSeconds = WORK_MINUTES * 60;
                }
              } else {
                clearInterval(toolInterval); isRunning = false;
                btnStartPause.innerText = "時間到！"; btnStartPause.className = "btn-start";
                onFocusCompleteReward();
              }
            }
          }
          updateDisplay();
        }, 1000);
      }
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      clearInterval(toolInterval); isRunning = false; btnStartPause.innerText = "開始"; btnStartPause.className = "btn-start";
      if (currentMode === 'stopwatch') { timeInSeconds = 0; } 
      else if (currentMode === 'timer') {
        timeInSeconds = (parseInt(minInput.value) || 10) * 60;
        initialTargetSeconds = timeInSeconds;
      } else if (currentMode === 'pomodoro') {
        pomoState = 'work'; pomoStatus.innerHTML = `🍅 專注時間 (${WORK_MINUTES}分)`;
        pomoStatus.style.color = "#ef4444"; pomoStatus.style.background = "#fee2e2";
        timeInSeconds = WORK_MINUTES * 60;
        initialTargetSeconds = timeInSeconds;
      }
      updateDisplay();
    });
  </script>
</body>
</html>
