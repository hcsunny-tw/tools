<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>冒險者任務確認卡</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; background: #F4E4BC; color: #3E2723; text-align: center; padding: 20px; }
    .card { background: #FDF5E6; border: 3px solid #8B4513; border-radius: 16px; padding: 20px; max-width: 400px; margin: 0 auto; box-shadow: 4px 4px 0px rgba(139, 69, 19, 0.3); }
    .task-item { background: #fff; padding: 12px; margin: 10px 0; border: 2px dashed #D2B48C; border-radius: 8px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #d32f2f; color: white; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge.redo { background: #ea580c; }
    .success-msg { color: #2e7d32; font-size: 24px; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <h2 id="studentName">讀取中...</h2>
    <p id="updateTime" style="font-size:12px; color:#888;"></p>
    <div id="taskList">
        <i class="bi bi-hourglass-split" style="font-size: 2rem;"></i>
    </div>
  </div>

  <script type="module">
    // ⚠️ 這裡請貼上跟老師端完全一樣的 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA0UhDKqcsChUa8OZWxZUmuFdKATfgiL8E",
      authDomain: "homework-hc906.firebaseapp.com",
      projectId: "homework-hc906",
      storageBucket: "homework-hc906.firebasestorage.app",
      messagingSenderId: "1051903125085",
      appId: "1:1051903125085:web:b205f868669ea7d5c34fb4",
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"; 

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 從網址取得參數 (例如 ?uid=xxx&no=5)
    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get('uid');
    const no = parseInt(urlParams.get('no'));

    async function loadData() {
        if (!uid || !no) {
            document.getElementById('studentName').innerText = "❌ 掃描的 QR Code 有誤";
            document.getElementById('taskList').innerHTML = "缺少老師代碼或座號。";
            return;
        }

        try {
            // 唯獨讀取這 1 份公開文件
            const docSnap = await getDoc(doc(db, "public_boards", uid));
            if (docSnap.exists()) {
                const data = docSnap.data();
                const student = data.summary.find(s => s.no === no);
                
                document.getElementById('updateTime').innerText = `最後更新：${data.lastUpdated}`;

                if (student) {
                    document.getElementById('studentName').innerText = `🛡️ ${student.name} 的任務清單`;
                    
                    if (student.debts.length === 0) {
                        document.getElementById('taskList').innerHTML = `<div class="success-msg"><i class="bi bi-star-fill" style="color:#f59e0b"></i><br>太棒了！<br>所有任務皆已完成！</div>`;
                    } else {
                        let html = '';
                        student.debts.forEach(d => {
                            const badge = d.st === 2 ? '<span class="badge redo">需訂正</span>' : '<span class="badge">未繳交</span>';
                            html += `<div class="task-item"><span><b>[${d.subject}]</b> ${d.title}</span> ${badge}</div>`;
                        });
                        document.getElementById('taskList').innerHTML = html;
                    }
                } else {
                    document.getElementById('studentName').innerText = "找不到該座號的冒險者";
                    document.getElementById('taskList').innerHTML = "";
                }
            } else {
                document.getElementById('studentName').innerText = "尚未發布資料";
                document.getElementById('taskList').innerHTML = "請提醒公會長(老師)開啟系統並連線。";
            }
        } catch (error) {
            console.error(error);
            document.getElementById('studentName').innerText = "連線失敗";
            document.getElementById('taskList').innerHTML = "請檢查網路狀態。";
        }
    }

    loadData();
  </script>
</body>
</html>
