<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>導師日誌</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- 引入 SheetJS (XLSX) 用於解析 Excel 檔案 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- 引入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 隱藏滾動條，維持美觀 */
    ::-webkit-scrollbar { display: none; }
    body { 
      -ms-overflow-style: none; 
      scrollbar-width: none; 
      font-family: 'system-ui', -apple-system, sans-serif;
      background-color: #F7F5F2;
    }
    
    .tap-highlight-transparent {
      -webkit-tap-highlight-color: transparent;
    }

    /* 列印專屬樣式 (匯出 PDF 時確保 A4 滿版與黑白清晰) */
    @media print {
      body { background-color: #FFFFFF !important; }
      @page { size: A4; margin: 15mm; }
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6B7280',
            accent: '#8B9A96',
            paper: '#FFFFFF',
            danger: '#E5989B',
            highlight: '#E2E8F0',
            darkText: '#374151'
          }
        }
      }
    }
  </script>
</head>
<body class="text-gray-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 預設空課表與設定 ---
    const emptySchedule = [
      { id: 1, period: 1, subject: '', content: '', status: '完成', isActive: true },
      { id: 2, period: 2, subject: '', content: '', status: '完成', isActive: true },
      { id: 3, period: 3, subject: '', content: '', status: '完成', isActive: true },
      { id: 4, period: 4, subject: '', content: '', status: '完成', isActive: true },
      { id: 5, period: 5, subject: '', content: '', status: '完成', isActive: true },
      { id: 6, period: 6, subject: '', content: '', status: '完成', isActive: true },
      { id: 7, period: 7, subject: '', content: '', status: '完成', isActive: true },
    ];

    const defaultWeekSchedule = {
      1: [{subject: '國語', active: true}, {subject: '數學', active: true}, {subject: '英文', active: false}, {subject: '自然', active: false}, {subject: '社會', active: false}, {subject: '綜合', active: true}, {subject: '健體', active: false}],
      2: [{subject: '數學', active: true}, {subject: '國語', active: true}, {subject: '健體', active: false}, {subject: '綜合', active: true}, {subject: '社會', active: false}, {subject: '自然', active: false}, {subject: '英文', active: false}],
      3: [{subject: '國語', active: true}, {subject: '數學', active: true}, {subject: '美勞', active: false}, {subject: '美勞', active: false}, {subject: '綜合', active: true}, {subject: '空白', active: false}, {subject: '空白', active: false}],
      4: [{subject: '自然', active: false}, {subject: '社會', active: false}, {subject: '數學', active: true}, {subject: '國語', active: true}, {subject: '英文', active: false}, {subject: '電腦', active: false}, {subject: '音樂', active: false}],
      5: [{subject: '國語', active: true}, {subject: '數學', active: true}, {subject: '英文', active: false}, {subject: '綜合', active: true}, {subject: '健體', active: false}, {subject: '班會', active: true}, {subject: '社團', active: false}],
    };

    const initialHomework = [
      { id: 1, name: '聯絡本', checked: false, amount: '' },
      { id: 2, name: '生字', checked: false, amount: '' },
      { id: 3, name: '圈詞', checked: false, amount: '' },
      { id: 4, name: '國單', checked: false, amount: '' },
      { id: 5, name: '數單', checked: false, amount: '' },
    ];

    function App() {
      // --- 視圖狀態 ---
      const [activeTab, setActiveTab] = useState('log'); // 'log' | 'settings' | 'export'
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [exportMode, setExportMode] = useState('daily'); // 'daily' | 'weekly'

      // --- 表單狀態 ---
      const [date, setDate] = useState('');
      const [week, setWeek] = useState(1);
      const [absentees, setAbsentees] = useState('');
      const [isHoliday, setIsHoliday] = useState(false); // 今日是否放假
      const [schedule, setSchedule] = useState(emptySchedule);
      const [homework, setHomework] = useState(initialHomework);
      const [contactBook, setContactBook] = useState([{ id: Date.now(), text: '' }]);
      const [schoolAffairs, setSchoolAffairs] = useState([{ id: Date.now(), text: '', isOk: false }]);
      const [studentEvents, setStudentEvents] = useState([{ id: Date.now()+1, text: '', status: '已處理' }]);
      const [parentContacts, setParentContacts] = useState([{ id: Date.now()+2, text: '', status: '已處理' }]);
      const [notes, setNotes] = useState('');
      
      // --- UI 與設定狀態 ---
      const [showToast, setShowToast] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingPeriodId, setEditingPeriodId] = useState(null);
      const [tempSubjectName, setTempSubjectName] = useState('');
      const [autoSaveTime, setAutoSaveTime] = useState('');
      
      // 儲存期初課表與休假日設定
      const [weekSettings, setWeekSettings] = useState(defaultWeekSchedule);
      const [holidaySettings, setHolidaySettings] = useState([]); // 格式 ['2026-10-10']
      const [tempHolidays, setTempHolidays] = useState('');
      const [excelSyllabus, setExcelSyllabus] = useState([]); // 從 Excel 讀入的進度清單

      // 區塊收合狀態管理 (Accordion)
      const [expandedSections, setExpandedSections] = useState({
        schedule: true, contact: true, homework: true, school: true, student: true, parent: true, notes: true
      });

      // --- 初始化與 localStorage 讀取 ---
      useEffect(() => {
        const savedSettings = localStorage.getItem('homeroom_schedule_settings');
        if (savedSettings) {
          try {
            setWeekSettings(JSON.parse(savedSettings));
          } catch (e) { console.error("設定檔讀取失敗:", e); }
        }

        const savedHolidays = localStorage.getItem('homeroom_holidays');
        if (savedHolidays) {
          try { 
            const parsed = JSON.parse(savedHolidays);
            setHolidaySettings(parsed);
            setTempHolidays(parsed.join(', '));
          } catch(e){}
        }

        const savedSyllabus = localStorage.getItem('homeroom_syllabus');
        if (savedSyllabus) {
          try { setExcelSyllabus(JSON.parse(savedSyllabus)); } catch(e){}
        }

        const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        setDate(`${yyyy}-${mm}-${dd}`);
        setWeek(5); 
      }, []);

      // --- 當日期改變時，自動套用該星期的課表與進度 ---
      useEffect(() => {
        if (!date) return;
        
        // 檢查是否為設定中的休假日
        const isDayOff = holidaySettings.includes(date);
        setIsHoliday(isDayOff);

        const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
        if (savedLogs[date]) {
          const log = savedLogs[date];
          setWeek(log.week || 1);
          setAbsentees(log.absentees || '');
          setIsHoliday(log.isHoliday ?? isDayOff);
          setSchedule(log.schedule || emptySchedule);
          setHomework(log.homework || initialHomework);
          setContactBook(log.contactBook || [{ id: Date.now(), text: '' }]);
          setSchoolAffairs(log.schoolAffairs || [{ id: Date.now(), text: '', isOk: false }]);
          setStudentEvents(log.studentEvents || [{ id: Date.now()+1, text: '', status: '已處理' }]);
          setParentContacts(log.parentContacts || [{ id: Date.now()+2, text: '', status: '已處理' }]);
          setNotes(log.notes || '');
          return;
        }

        // 若無紀錄，套用期初課表
        const d = new Date(date);
        const dayOfWeek = d.getDay(); 
        
        let newSchedule = emptySchedule.map(item => ({ ...item, subject: '', isActive: false }));
        if (dayOfWeek >= 1 && dayOfWeek <= 5) {
          const todaysSubjects = weekSettings[dayOfWeek] || [];
          // 比對 Excel 進度清單，自動填入當天各科進度
          const matchedProgresses = excelSyllabus.filter(s => s.date === date);

          newSchedule = emptySchedule.map((item, index) => {
            const subjObj = todaysSubjects[index];
            const subjectName = subjObj?.subject || '';
            
            // 尋找是否有對應的 Excel 進度
            let assignedContent = '';
            const foundProg = matchedProgresses.find(p => p.subject === subjectName);
            if (foundProg) {
              assignedContent = foundProg.progress;
            }

            return {
              ...item,
              subject: subjectName,
              content: assignedContent,
              isActive: subjObj?.active ?? true
            };
          });
        }
        setSchedule(newSchedule);

        // 自動帶入昨日聯絡簿（若週一則抓上週五）
        let targetPrevDate = new Date(d);
        if (dayOfWeek === 1) targetPrevDate.setDate(targetPrevDate.getDate() - 3); 
        else if (dayOfWeek === 0) targetPrevDate.setDate(targetPrevDate.getDate() - 2);
        else targetPrevDate.setDate(targetPrevDate.getDate() - 1);
        
        const prevDateStr = `${targetPrevDate.getFullYear()}-${String(targetPrevDate.getMonth() + 1).padStart(2, '0')}-${String(targetPrevDate.getDate()).padStart(2, '0')}`;
        
        let foundHomework = false;
        if (savedLogs[prevDateStr] && savedLogs[prevDateStr].contactBook) {
            const cbData = savedLogs[prevDateStr].contactBook.filter(cb => cb.text.trim() !== '');
            if (cbData.length > 0) {
               setHomework(cbData.map((cb, idx) => ({ id: idx + 1, name: cb.text, checked: false, amount: '' })));
               foundHomework = true;
            }
        }
        
        if (!foundHomework) {
            setHomework(initialHomework);
        }
        
        setAbsentees('');
        setContactBook([{ id: Date.now(), text: '' }]);
        setSchoolAffairs([{ id: Date.now(), text: '', isOk: false }]);
        setStudentEvents([{ id: Date.now()+1, text: '', status: '已處理' }]);
        setParentContacts([{ id: Date.now()+2, text: '', status: '已處理' }]);
        setNotes('');
        
      }, [date, weekSettings, holidaySettings, excelSyllabus]);

      // --- 斷線自動存檔 (Auto-Save) ---
      useEffect(() => {
        if (!date) return;
        const timer = setTimeout(() => {
          const logData = { date, week, absentees, isHoliday, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes };
          const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
          savedLogs[date] = logData;
          localStorage.setItem('homeroom_logs', JSON.stringify(savedLogs));
          
          const now = new Date();
          setAutoSaveTime(now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }));
        }, 1500);
        return () => clearTimeout(timer);
      }, [date, week, absentees, isHoliday, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes]);

      // --- 資料更新處理函數 ---
      const updateSchedule = (id, field, value) => {
        setSchedule(schedule.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const updateHomework = (id, field, value) => {
        setHomework(homework.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const updateEvent = (type, id, field, value) => {
        if (type === 'student') setStudentEvents(studentEvents.map(item => item.id === id ? { ...item, [field]: value } : item));
        if (type === 'parent') setParentContacts(parentContacts.map(item => item.id === id ? { ...item, [field]: value } : item));
        if (type === 'school') setSchoolAffairs(schoolAffairs.map(item => item.id === id ? { ...item, [field]: value } : item));
        if (type === 'contact') setContactBook(contactBook.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const addEvent = (type, quickText = '') => {
        if (type === 'student') setStudentEvents([...studentEvents, { id: Date.now(), text: quickText, status: '已處理' }]);
        if (type === 'parent') setParentContacts([...parentContacts, { id: Date.now(), text: quickText, status: '已處理' }]);
        if (type === 'school') setSchoolAffairs([...schoolAffairs, { id: Date.now(), text: '', isOk: false }]);
        if (type === 'contact') setContactBook([...contactBook, { id: Date.now(), text: '' }]);
      };

      const removeEvent = (type, id) => {
        if (type === 'student') setStudentEvents(studentEvents.filter(e => e.id !== id));
        if (type === 'parent') setParentContacts(parentContacts.filter(e => e.id !== id));
        if (type === 'school') setSchoolAffairs(schoolAffairs.filter(e => e.id !== id));
        if (type === 'contact') setContactBook(contactBook.filter(e => e.id !== id));
      };

      const appendQuickText = (type, id, textToAdd) => {
        if (type === 'student') {
          setStudentEvents(studentEvents.map(item => {
            if (item.id === id) {
              const current = item.text.trim();
              const updated = current ? `${current}, ${textToAdd}` : textToAdd;
              return { ...item, text: updated };
            }
            return item;
          }));
        } else if (type === 'parent') {
          setParentContacts(parentContacts.map(item => {
            if (item.id === id) {
              const current = item.text.trim();
              const updated = current ? `${current}, ${textToAdd}` : textToAdd;
              return { ...item, text: updated };
            }
            return item;
          }));
        }
      };

      // 手動切換某節課今天是否要上課 (調代課用)
      const togglePeriodActive = (id) => {
        setSchedule(schedule.map(item => item.id === id ? { ...item, isActive: !item.isActive } : item));
      };

      const openSubjectModal = (item) => {
        setEditingPeriodId(item.id);
        setTempSubjectName(item.subject);
        setIsModalOpen(true);
      };

      const saveSubjectChange = () => {
        if (editingPeriodId !== null) {
          updateSchedule(editingPeriodId, 'subject', tempSubjectName);
        }
        setIsModalOpen(false);
      };

      const handleSave = () => {
        if (isSaving) return;
        setIsSaving(true);
        const logData = { date, week, absentees, isHoliday, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes };
        const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
        savedLogs[date] = logData;
        localStorage.setItem('homeroom_logs', JSON.stringify(savedLogs));
        
        setTimeout(() => {
          setIsSaving(false);
          setShowToast(true);
          setTimeout(() => setShowToast(false), 2500);
        }, 800);
      };

      const handlePrint = () => { window.print(); };

      const getDayString = (dateStr) => {
        if (!dateStr) return '';
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        return days[new Date(dateStr).getDay()];
      };

      const toggleSection = (section) => {
        setExpandedSections(prev => ({ ...prev, [section]: !prev[section] }));
      };

      const toggleAllSections = (expand) => {
        const newState = Object.keys(expandedSections).reduce((acc, key) => ({ ...acc, [key]: expand }), {});
        setExpandedSections(newState);
      };

      // 一週預覽相關輔助函數
      const getWeekDates = (currentDateStr) => {
        if (!currentDateStr) return [];
        const curr = new Date(currentDateStr);
        const day = curr.getDay();
        const diffToMon = curr.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(curr.setDate(diffToMon));
        
        const dates = [];
        for (let i = 0; i < 5; i++) {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          dates.push(`${yyyy}-${mm}-${dd}`);
        }
        return dates;
      };

      const getLogForDate = (targetDateStr) => {
        const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
        if (savedLogs[targetDateStr]) {
          const log = savedLogs[targetDateStr];
          return {
            ...log,
            homework: log.homework || initialHomework,
            contactBook: log.contactBook || [{ id: 1, text: '' }],
            schoolAffairs: log.schoolAffairs || [],
            studentEvents: log.studentEvents || [],
            parentContacts: log.parentContacts || [],
            schedule: log.schedule || emptySchedule
          };
        }
        // 若無紀錄則產生預設格式
        const isOff = holidaySettings.includes(targetDateStr);
        const d = new Date(targetDateStr);
        const dayOfWeek = d.getDay();
        let daySch = emptySchedule.map(item => ({ ...item, subject: '', isActive: false }));
        if (dayOfWeek >= 1 && dayOfWeek <= 5) {
          const todaysSubjects = weekSettings[dayOfWeek] || [];
          daySch = emptySchedule.map((item, index) => ({
            ...item,
            subject: todaysSubjects[index]?.subject || '',
            isActive: todaysSubjects[index]?.active ?? true
          }));
        }
        return {
          date: targetDateStr,
          week: week,
          absentees: '',
          isHoliday: isOff,
          schedule: daySch,
          homework: initialHomework,
          contactBook: [{ id: 1, text: '' }],
          schoolAffairs: [],
          studentEvents: [],
          parentContacts: [],
          notes: ''
        };
      };

      const currentDayOfWeek = date ? new Date(date).getDay() : new Date().getDay();
      const homeworkSubTitle = currentDayOfWeek === 1 ? '上週五指派' : '昨日指派';
      const contactBookPlaceholder = currentDayOfWeek === 5 ? '輸入作業內容 (自動帶入下週一批閱)...' : '輸入作業內容 (自動帶入明天批閱)...';
      const quickPhrases = {
        student: ['作業缺交', '上課分心', '常規不佳', '遲到', '身體不適', '與同學衝突'],
        parent: ['作業提醒', '近期表現佳', '電訪:行為宣導', '電訪:身體狀況', '傳達班級事務']
      };

      // ==========================================
      // 1. 填寫日誌畫面 (Log View)
      // ==========================================
      const renderLogView = () => (
        <div className="px-4 py-6 max-w-5xl mx-auto pb-24">
          
          {/* 頂部日期與狀態控制列 */}
          <div className="bg-white p-5 rounded-3xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div className="flex items-center gap-3 w-full md:w-auto">
              <div className="bg-accent/10 text-accent font-bold px-4 py-2.5 rounded-2xl text-sm">
                115學年度
              </div>
              <div className="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-2xl px-3 py-2">
                <span className="text-xs text-gray-500 font-bold">第</span>
                <input 
                  type="number" 
                  value={week} 
                  onChange={(e) => setWeek(Number(e.target.value))} 
                  className="w-10 text-center font-bold bg-transparent text-darkText outline-none"
                />
                <span className="text-xs text-gray-500 font-bold">週</span>
              </div>
              
              {/* 自動儲存時間提示 */}
              {autoSaveTime && (
                <div className="text-[11px] text-gray-400 hidden sm:block">
                  ☁️ 已自動儲存 {autoSaveTime}
                </div>
              )}
            </div>

            <div className="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
              <div className="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-2xl px-4 py-2">
                <i className="ph-bold ph-calendar text-accent"></i>
                <input 
                  type="date" 
                  value={date} 
                  onChange={(e) => setDate(e.target.value)} 
                  className="font-bold bg-transparent text-darkText outline-none text-sm"
                />
                <span className="text-xs font-bold text-accent px-1.5 py-0.5 bg-accent/10 rounded-lg">
                  【 {getDayString(date)} 】
                </span>
              </div>

              {/* 今日放假開關 */}
              <button 
                onClick={() => setIsHoliday(!isHoliday)}
                className={`px-4 py-2.5 rounded-2xl font-bold text-sm flex items-center gap-2 transition-all ${isHoliday ? 'bg-green-500 text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>
                <i className={`ph-bold ${isHoliday ? 'ph-palmtree' : 'ph-briefcase'} text-base`}></i>
                {isHoliday ? '今日已放假' : '正常上課'}
              </button>
            </div>
          </div>

          {/* 放假模式提示卡 */}
          {isHoliday ? (
            <div className="bg-white rounded-3xl p-12 shadow-sm border border-gray-100 text-center flex flex-col items-center justify-center my-10">
              <div className="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center text-green-500 mb-4 text-4xl shadow-inner">
                🏖️
              </div>
              <h2 className="text-2xl font-bold text-darkText mb-2">今天是放假 / 停課日</h2>
              <p className="text-sm text-gray-400 max-w-md mx-auto">好好享受假期吧！系統已自動為您隱藏課程與作業進度，若有特殊聯繫事項仍可於下方記錄。</p>
            </div>
          ) : (
            <>
              {/* 快速收合控制列 */}
              <div className="flex justify-between items-center mb-4 px-2">
                <span className="text-xs font-bold text-gray-400">表單快速操作</span>
                <div className="flex gap-2 text-xs">
                  <button onClick={() => toggleAllSections(true)} className="text-accent hover:underline">全部展開</button>
                  <span className="text-gray-300">|</span>
                  <button onClick={() => toggleAllSections(false)} className="text-accent hover:underline">全部收合</button>
                </div>
              </div>

              {/* RWD 雙欄格線系統 (電腦版左右並排，手機版單欄) */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
                
                {/* === 左欄：教學實際進度 & 作業批閱 === */}
                <div className="flex flex-col gap-6">
                  
                  {/* 教學實際進度卡片 */}
                  <div className="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden transition-all">

            { 日期: "2026-09-01", 科目: "國語", 進度: "第一課 生字詞語" },
            { 日期: "2026-09-01", 科目: "數學", 進度: "單元一 100以內的數" },
            { 日期: "2026-09-02", 科目: "國語", 進度: "第一課 課文朗讀與深究" }
          ];
          const ws = XLSX.utils.json_to_sheet(templateData);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "教學進度表");
          XLSX.writeFile(wb, "導師日誌_進度範本.xlsx");
        };

        // 讀取上傳的 Excel 檔案
        const handleFileUpload = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const bstr = evt.target.result;
              const wb = XLSX.read(bstr, { type: 'binary' });
              const wsname = wb.SheetNames[0];
              const ws = wb.Sheets[wsname];
              const data = XLSX.utils.sheet_to_json(ws);
              
              // 轉換格式儲存
              const formatted = data.map(row => ({
                date: String(row['日期'] || '').trim(),
                subject: String(row['科目'] || '').trim(),
                progress: String(row['進度'] || '').trim()
              })).filter(r => r.date && r.subject);

              setExcelSyllabus(formatted);
              localStorage.setItem('homeroom_syllabus', JSON.stringify(formatted));
              alert(`成功匯入 ${formatted.length} 筆教學進度！`);
            } catch (err) {
              alert("Excel 解析失敗，請確認格式是否正確！");
            }
          };
          reader.readAsBinaryString(file);
        };

                              newSet[dObj.day][pIdx].active = !newSet[dObj.day][pIdx].active;

              {excelSyllabus.length > 0 && (
                <div className="mt-4 text-xs text-green-600 font-bold bg-green-50 p-3 rounded-xl">
                  ✓ 目前已成功載入 {excelSyllabus.length} 筆教學進度資料！
                </div>
              )}
            </div>

            {/* 休假日設定區 */}
            <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 mb-8">
              <h2 className="text-xl font-bold text-darkText mb-2 flex items-center gap-2">
                <i className="ph-fill ph-calendar-x text-accent"></i> 學期休假日設定 (自動避開排課)
              </h2>
              <p className="text-sm text-gray-500 mb-4">請輸入本學期不需上課的日期（如國慶日、校慶補假），多個日期請用半形逗號隔開。</p>
              <input 
                type="text" 
                placeholder="例如: 2026-10-10, 2026-10-11"
                value={tempHolidays}
                onChange={(e) => setTempHolidays(e.target.value)}
                className="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3 text-sm text-darkText outline-none focus:ring-2 focus:ring-accent/40 mb-2"
              />
            </div>

            <div className="flex justify-end">
              <button onClick={handleSaveSettings} className="px-8 py-4 bg-accent text-white font-bold rounded-2xl shadow-lg hover:bg-accent/90 transition-all">
                儲存所有期初設定
              </button>
            </div>
          </div>
        );
      };

      // ==========================================
      // 3. 匯出與列印預覽畫面 (Export View)
      // ==========================================
      const renderExportView = () => {
        const pagesToRender = exportMode === 'weekly' 
           ? getWeekDates(date).map(d => getLogForDate(d))
           : [{ date, week, absentees, isHoliday, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes }];

        return (
          <div className="px-4 py-6 max-w-5xl mx-auto">
            <div className="mb-6 flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm print:hidden gap-4 sticky top-16 z-10">
              <div className="flex gap-2 w-full sm:w-auto bg-gray-100 p-1.5 rounded-xl">
                <button onClick={() => setExportMode('daily')} className={`flex-1 sm:flex-none px-4 py-2 rounded-lg font-bold text-sm transition-all ${exportMode === 'daily' ? 'bg-white text-accent shadow-sm' : 'text-gray-500'}`}>單日預覽</button>
                <button onClick={() => setExportMode('weekly')} className={`flex-1 sm:flex-none px-4 py-2 rounded-lg font-bold text-sm transition-all ${exportMode === 'weekly' ? 'bg-white text-accent shadow-sm' : 'text-gray-500'}`}>一週預覽 (一~五)</button>
              </div>
              <button onClick={handlePrint} className="w-full sm:w-auto px-6 py-3 bg-darkText text-white rounded-xl font-bold shadow-md hover:bg-gray-800 flex items-center justify-center gap-2">
                <i className="ph-bold ph-printer"></i> {exportMode === 'weekly' ? '匯出整週 PDF (共 5 頁)' : '匯出單日 PDF'}
              </button>
            </div>

            <div className="flex flex-col gap-8 print:gap-0">
              {pagesToRender.map((pageData, pageIdx) => (
                <div key={pageData.date} 
                     className="bg-white p-8 sm:p-12 shadow-md mx-auto rounded-none sm:rounded-xl text-black relative" 
                     style={{ minHeight: '297mm', maxWidth: '210mm', width: '100%', pageBreakAfter: pageIdx !== pagesToRender.length - 1 ? 'always' : 'auto' }}>
                  
                  <h1 className="text-2xl sm:text-3xl font-bold text-center mb-8 tracking-widest border-b-2 border-black pb-4">
                    115學年度 第一學期 導師工作日誌
                  </h1>
                  
                  <div className="flex justify-between items-end mb-4 font-bold text-lg">
                    <div>第 <span className="underline px-2">{pageData.week}</span> 週</div>
                    <div>{pageData.date ? pageData.date.split('-')[0] : '2026'} 年 <span className="underline px-2">{pageData.date ? pageData.date.split('-')[1] : '10'}</span> 月 <span className="underline px-2">{pageData.date ? pageData.date.split('-')[2] : '01'}</span> 日 【 {getDayString(pageData.date)} 】</div>
                    <div>請假學生：<span className="underline px-4">{pageData.absentees || '無'}</span></div>
                  </div>

                  {pageData.isHoliday ? (
                     <div className="border-2 border-black flex flex-col items-center justify-center text-gray-400" style={{ height: '220mm' }}>
                         <i className="ph-fill ph-calendar-x text-7xl mb-4 text-gray-300"></i>
                         <h2 className="text-3xl font-bold tracking-widest text-gray-400">（ 本 日 放 假 / 停 課 ）</h2>
                     </div>
                  ) : (
                     <>
                        <table className="w-full border-collapse border-2 border-black mb-6 text-sm">
                          <thead>
                            <tr>
                              <th className="border-2 border-black p-2 w-12 text-center">節次</th>
                              <th className="border-2 border-black p-2 w-[22%]">科目 (預定內容)</th>
                              <th className="border-2 border-black p-2 w-[28%]">教學實際進度</th>
                              <th className="border-2 border-black p-2 w-[28%]">作業批閱</th>
                              <th className="border-2 border-black p-2 w-16 text-center">數量</th>
                            </tr>
                          </thead>
                          <tbody>
                            {pageData.schedule.map((item, index) => (
                              <tr key={item.id} className={index === 4 ? "border-t-[3px] border-black" : ""}>
                                <td className="border border-black p-2 text-center font-bold text-lg">{item.period}</td>
                                
                                {item.isActive !== false ? (
                                  <>
                                    <td className="border border-black p-2">{item.subject}</td>
                                    <td className="border border-black p-2 relative h-16">
                                      <div className="mb-4 pr-10">{item.content}</div>
                                      <div className="flex gap-2 text-[10px] absolute bottom-1 right-1 opacity-80">
                                        <span>{item.status === '完成' ? '☑' : '☐'}完成</span>
                                        <span>{item.status === '超前' ? '☑' : '☐'}超前</span>
                                        <span>{item.status === '待補課' ? '☑' : '☐'}待補課</span>
                                      </div>
                                    </td>
                                  </>
                                ) : (
                                  <td className="border border-black p-2 text-center text-gray-400 bg-gray-50" colSpan="2">
                                     <span className="opacity-50 tracking-widest text-xs">（ 非 任 教 節 次 ）</span>
                                  </td>
                                )}

                                {index < 5 ? (
                                  <>
                                    <td className="border border-black p-2">
                                      {pageData.homework[index]?.checked ? '☑' : '☐'} {pageData.homework[index]?.name}
                                    </td>
                                    <td className="border border-black p-2 text-center">{pageData.homework[index]?.amount}</td>
                                  </>
                                ) : index === 5 ? (
                                   <td colSpan="2" rowSpan="2" className="border-2 border-black p-2 align-top">
                                      <div className="font-bold text-center border-b border-black mb-1 pb-1">學校相關事務</div>
                                      {(pageData.schoolAffairs || []).filter(s => s.text).map((s, i) => (
                                        <div key={i} className="flex justify-between mb-1 text-xs">
                                          <span>{s.text}</span>
                                          <span>{s.isOk ? '☑' : '☐'}OK</span>
                                        </div>
                                      ))}
                                   </td>
                                ) : null}
                              </tr>
                            ))}
                          </tbody>
                        </table>

                        <table className="w-full border-collapse border-2 border-black text-sm">
                          <tbody>
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 今日聯絡簿</td>
                            </tr>
                            <tr>
                              <td colSpan="2" className="border-2 border-black p-2 align-top h-16">
                                <div className="grid grid-cols-2 gap-x-4 text-xs">
                                  {(pageData.contactBook || []).filter(cb => cb.text.trim()).map((cb, idx) => (
                                     <div key={idx} className="mb-1">{idx + 1}. {cb.text}</div>
                                  ))}
                                </div>
                              </td>
                            </tr>
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 學生事件</td>
                            </tr>
                            {(pageData.studentEvents || []).length > 0 ? (pageData.studentEvents || []).map((evt, idx) => (
                               <tr key={idx}>
                                  <td className="border border-black p-2 h-8 w-3/4 text-xs">{evt.text}</td>
                                  <td className="border border-black p-2 text-center w-1/4 text-xs">
                                     {evt.status === '已處理' ? '☑' : '☐'} 已處理 &nbsp;&nbsp; {evt.status === '需轉介' ? '☑' : '☐'} 需轉介
                                  </td>
                               </tr>
                            )) : (
                               <tr><td className="border border-black p-2 h-8 text-gray-300 text-xs" colSpan="2">無紀錄</td></tr>
                            )}
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 家長聯繫</td>
                            </tr>
                            {(pageData.parentContacts || []).length > 0 ? (pageData.parentContacts || []).map((evt, idx) => (
                               <tr key={idx}>
                                  <td className="border border-black p-2 h-8 w-3/4 text-xs">{evt.text}</td>
                                  <td className="border border-black p-2 text-center w-1/4 text-xs">
                                     {evt.status === '已處理' ? '☑' : '☐'} 已處理 &nbsp;&nbsp; {evt.status === '需轉達' ? '☑' : '☐'} 需轉達
                                  </td>
                               </tr>
                            )) : (
                               <tr><td className="border border-black p-2 h-8 text-gray-300 text-xs" colSpan="2">無紀錄</td></tr>
                            )}
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 其他記事</td>
                            </tr>
                            <tr>
                              <td colSpan="2" className="border-2 border-black p-2 h-20 align-top whitespace-pre-wrap text-xs">
                                {pageData.notes}
                              </td>
                            </tr>
                          </tbody>
                        </table>
                     </>
                  )}
                </div>
              ))}
            </div>
          </div>
        );
      };

      return (
        <div className="w-full relative min-h-screen">
          {/* 頂部漢堡選單導覽列 */}
          <nav className="bg-white shadow-sm sticky top-0 z-50 print:hidden">
            <div className="max-w-5xl mx-auto px-4 flex justify-between items-center h-14">
              <div className="font-bold text-lg flex items-center gap-2 text-darkText">
                 {activeTab === 'log' && <><i className="ph-fill ph-pencil-line text-accent"></i> 導師日誌</>}
                 {activeTab === 'settings' && <><i className="ph-fill ph-gear text-accent"></i> 期初設定</>}
                 {activeTab === 'export' && <><i className="ph-fill ph-printer text-accent"></i> 匯出與預覽</>}
              </div>
              
              <button 
                onClick={() => setIsMenuOpen(!isMenuOpen)} 
                className="p-2 text-gray-500 hover:text-accent transition-colors focus:outline-none tap-highlight-transparent flex items-center justify-center rounded-xl active:bg-gray-100">
                <i className={`ph-bold ${isMenuOpen ? 'ph-x' : 'ph-list'} text-2xl`}></i>
              </button>
            </div>

            <div className={`overflow-hidden transition-all duration-300 ease-in-out ${isMenuOpen ? 'max-h-60 border-t border-gray-100 shadow-inner' : 'max-h-0'}`}>
              <div className="max-w-5xl mx-auto px-4 py-4 flex flex-col gap-2.5 bg-gray-50">
                <button onClick={() => { setActiveTab('log'); setIsMenuOpen(false); }} 
                        className={`text-left px-5 py-3.5 rounded-xl font-bold transition-all flex items-center gap-3 ${activeTab === 'log' ? 'bg-accent text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100 shadow-sm border border-gray-100'}`}>
                  <i className="ph-fill ph-pencil-line text-xl w-6 text-center"></i> 填寫日誌
                </button>
                <button onClick={() => { setActiveTab('settings'); setIsMenuOpen(false); }} 
                        className={`text-left px-5 py-3.5 rounded-xl font-bold transition-all flex items-center gap-3 ${activeTab === 'settings' ? 'bg-accent text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100 shadow-sm border border-gray-100'}`}>
                  <i className="ph-fill ph-gear text-xl w-6 text-center"></i> 期初設定 (課表與進度)
                </button>
                <button onClick={() => { setActiveTab('export'); setIsMenuOpen(false); }} 
                        className={`text-left px-5 py-3.5 rounded-xl font-bold transition-all flex items-center gap-3 ${activeTab === 'export' ? 'bg-accent text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100 shadow-sm border border-gray-100'}`}>
                  <i className="ph-fill ph-printer text-xl w-6 text-center"></i> 匯出與列印預覽
                </button>
              </div>
            </div>
          </nav>

          <main className="max-w-5xl mx-auto">
            {activeTab === 'log' && renderLogView()}
            {activeTab === 'settings' && renderSettingsView()}
            {activeTab === 'export' && renderExportView()}
          </main>

          {/* 修改科目 Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[60] p-4 print:hidden">
              <div className="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl">
                <h3 className="text-lg font-bold text-darkText mb-2 flex items-center gap-2">
                  <i className="ph-bold ph-pencil-simple text-accent"></i> 修改科目
                </h3>
                <p className="text-xs text-gray-500 mb-4">如遇調課或代課，請直接修改科目名稱。</p>
                <input 
                  type="text" 
                  value={tempSubjectName} 
                  onChange={(e) => setTempSubjectName(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && saveSubjectChange()}
                  autoFocus
                  className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-5 text-darkText font-bold focus:ring-2 focus:ring-accent/50 outline-none"
                />
                <div className="flex gap-3">
                  <button onClick={() => setIsModalOpen(false)} className="flex-1 py-3 bg-gray-100 text-gray-600 font-bold rounded-xl">取消</button>
                  <button onClick={saveSubjectChange} className="flex-1 py-3 bg-accent text-white font-bold rounded-xl">確定</button>
                </div>
              </div>
            </div>
          )}

          {/* Toast 提示 */}
          {showToast && (
            <div className="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-darkText/90 backdrop-blur-md text-white px-8 py-5 rounded-3xl shadow-2xl flex flex-col items-center gap-3 z-[60] animate-bounce print:hidden">
              <div className="w-12 h-12 bg-green-400 rounded-full flex items-center justify-center mb-1">
                 <i className="ph-bold ph-check text-2xl text-darkText"></i>
              </div>
              <span className="font-bold text-lg">操作成功！</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
