<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>導師日誌系統</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- 引入 SheetJS (XLSX) 用於解析 Excel 檔案 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- 引入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 隱藏滾動條，維持美觀 */
    ::-webkit-scrollbar { display: none; }
    body { 
      -ms-overflow-style: none; 
      scrollbar-width: none; 
      font-family: 'system-ui', -apple-system, sans-serif;
      background-color: #F7F5F2;
      transition: background-color 0.3s ease;
    }
    
    .tap-highlight-transparent {
      -webkit-tap-highlight-color: transparent;
    }

    /* 列印專屬樣式 (匯出 PDF 時確保 A4 滿版與黑白清晰) */
    @media print {
      body { background-color: #FFFFFF !important; }
      @page { size: A4; margin: 5mm; }
    }

    /* 動態主題顏色 CSS 變數定義 */
    :root {
      --color-primary: #8B9A96;
      --color-primary-hover: #788783;
      --color-primary-light: rgba(139, 154, 150, 0.15);
    }

    .bg-theme { background-color: var(--color-primary) !important; }
    .bg-theme-hover:hover { background-color: var(--color-primary-hover) !important; }
    .bg-theme-light { background-color: var(--color-primary-light) !important; }
    .text-theme { color: var(--color-primary) !important; }
    .border-theme { border-color: var(--color-primary) !important; }
    .ring-theme:focus { --tw-ring-color: var(--color-primary) !important; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FFFFFF',
            danger: '#E5989B',
            highlight: '#E2E8F0',
            darkText: '#374151'
          }
        }
      }
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInAnonymously, 
      signInWithCustomToken, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase 配置與初始化
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'homeroom-teacher-log';
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyD-RVYlQrgRFgZ-Et1Hdm8bhF-J5wAaCZw",
          authDomain: "teacher-fa5e4.firebaseapp.com",
          projectId: "teacher-fa5e4",
          storageBucket: "teacher-fa5e4.firebasestorage.app",
          messagingSenderId: "248651659825",
          appId: "1:248651659825:web:ed9ae5af6af6eeb2247310",
          measurementId: "G-C9TNW80MF7"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 暴露 Firebase 服務至 window 全局物件供 React 調用
    window.firebaseService = {
      app,
      auth,
      db,
      appId,
      signInWithGoogle: async () => {
        const provider = new GoogleAuthProvider();
        return await signInWithPopup(auth, provider);
      },
      logout: () => signOut(auth),
      getUser: () => auth.currentUser,
      onAuth: (callback) => onAuthStateChanged(auth, callback),
      
      saveLogCloud: async (userId, logData) => {
        if (!userId || !logData || !logData.date) return;
        try {
          const logRef = doc(db, 'artifacts', appId, 'users', userId, 'logs', logData.date);
          await setDoc(logRef, logData, { merge: true });
        } catch (e) {
          console.error("雲端日誌儲存失敗:", e);
        }
      },

      saveSettingsCloud: async (userId, settingsData) => {
        if (!userId || !settingsData) return;
        try {
          const settingsRef = doc(db, 'artifacts', appId, 'users', userId, 'settings', 'config');
          await setDoc(settingsRef, settingsData, { merge: true });
        } catch (e) {
          console.error("雲端設定儲存失敗:", e);
        }
      },

      subscribeLogCloud: (userId, dateStr, callback, errorCb) => {
        if (!userId || !dateStr) return () => {};
        const logRef = doc(db, 'artifacts', appId, 'users', userId, 'logs', dateStr);
        return onSnapshot(logRef, (docSnap) => {
          if (docSnap.exists()) {
            callback(docSnap.data());
          } else {
            callback(null);
          }
        }, errorCb || ((err) => console.error("Firestore sync error:", err)));
      },

      getSettingsCloud: async (userId) => {
        if (!userId) return null;
        try {
          const settingsRef = doc(db, 'artifacts', appId, 'users', userId, 'settings', 'config');
          const snap = await getDoc(settingsRef);
          return snap.exists() ? snap.data() : null;
        } catch (e) {
          console.error("讀取雲端設定失敗:", e);
          return null;
        }
      }
    };

    (async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (e) {
        console.warn("匿名驗證備援:", e);
      }
    })();
  </script>

<body class="text-gray-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 預設主題顏色選項 ---
    const themePalettes = [
      { id: 'morandi-gray', name: '莫蘭迪灰綠', color: '#8B9A96', hover: '#788783' },
      { id: 'slate-blue', name: '沉靜黛藍', color: '#4B6584', hover: '#3B526F' },
      { id: 'forest-green', name: '森林竹綠', color: '#5A7D7C', hover: '#486665' },
      { id: 'lavender-purple', name: '優雅薰紫', color: '#7B68EE', hover: '#6753D6' },
      { id: 'warm-terracotta', name: '暖陽橙褐', color: '#C86D51', hover: '#B35B40' }
    ];

    // --- 導師七彩正向鼓勵希望卡庫 ---
    const hopeCards = [
      { color: 'from-rose-500 to-pink-500', bgLight: 'bg-rose-50', text: 'text-rose-700', border: 'border-rose-200', title: '暖陽紅', quote: '「每一個微小的進步，都值得為自己與孩子喝采！」' },
      { color: 'from-orange-400 to-amber-500', bgLight: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-200', title: '活力橘', quote: '「溫柔地對待學生的同時，別忘了也溫柔地對待努力的自己。」' },
      { color: 'from-amber-400 to-yellow-500', bgLight: 'bg-yellow-50', text: 'text-amber-800', border: 'border-yellow-200', title: '希望黃', quote: '「您今天的一句話、一個微笑，可能已經點亮了某個孩子的一生。」' },
      { color: 'from-emerald-400 to-teal-500', bgLight: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', title: '森林綠', quote: '「教育是一場溫柔的馬拉松，保持自己的節奏，靜待花開。」' },
      { color: 'from-sky-400 to-blue-500', bgLight: 'bg-sky-50', text: 'text-sky-700', border: 'border-sky-200', title: '寧靜藍', quote: '「深呼吸，喝口水。今天的您已經做得很棒了，辛苦了！」' },
      { color: 'from-indigo-500 to-purple-500', bgLight: 'bg-indigo-50', text: 'text-indigo-700', border: 'border-indigo-200', title: '智慧靛', quote: '「接納班級的不完美，也是教育中最有力量的學習與成長。」' },
      { color: 'from-purple-500 to-fuchsia-500', bgLight: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', title: '優雅紫', quote: '「用愛帶班，用心生活。記得給辛苦的自己一個大大的讚！」' }
    ];

    // --- 預設空課表與設定 ---
    const emptySchedule = [
      { id: 1, period: 1, subject: '', content: '', status: '完成', isActive: true },
      { id: 2, period: 2, subject: '', content: '', status: '完成', isActive: true },
      { id: 3, period: 3, subject: '', content: '', status: '完成', isActive: true },
      { id: 4, period: 4, subject: '', content: '', status: '完成', isActive: true },
      { id: 5, period: 5, subject: '', content: '', status: '完成', isActive: true },
      { id: 6, period: 6, subject: '', content: '', status: '完成', isActive: true },
      { id: 7, period: 7, subject: '', content: '', status: '完成', isActive: true },
    ];

    const defaultWeekSchedule = {
      1: [{subject: '國語', active: true}, {subject: '數學', active: true}, {subject: '英文', active: false}, {subject: '自然', active: false}, {subject: '社會', active: false}, {subject: '綜合', active: true}, {subject: '健體', active: false}],
      2: [{subject: '數學', active: true}, {subject: '國語', active: true}, {subject: '健體', active: false}, {subject: '綜合', active: true}, {subject: '社會', active: false}, {subject: '自然', active: false}, {subject: '英文', active: false}],
      3: [{subject: '國語', active: true}, {subject: '數學', active: true}, {subject: '美勞', active: false}, {subject: '美勞', active: false}, {subject: '綜合', active: true}, {subject: '空白', active: false}, {subject: '空白', active: false}],
      4: [{subject: '自然', active: false}, {subject: '社會', active: false}, {subject: '數學', active: true}, {subject: '國語', active: true}, {subject: '英文', active: false}, {subject: '電腦', active: false}, {subject: '音樂', active: false}],
      5: [{subject: '國語', active: true}, {subject: '數學', active: true}, {subject: '英文', active: false}, {subject: '綜合', active: true}, {subject: '健體', active: false}, {subject: '班會', active: true}, {subject: '社團', active: false}],
    };

    const initialHomework = [
      { id: 1, name: '聯絡本', checked: false, amount: '' },
      { id: 2, name: '生字', checked: false, amount: '' },
      { id: 3, name: '圈詞', checked: false, amount: '' },
      { id: 4, name: '國單', checked: false, amount: '' },
      { id: 5, name: '數單', checked: false, amount: '' },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('log'); 
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [exportMode, setExportMode] = useState('daily'); 

      const [currentUser, setCurrentUser] = useState(null);
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      const [currentTheme, setCurrentTheme] = useState('morandi-gray');

      const [date, setDate] = useState('');
      const [week, setWeek] = useState(1);
      const [absentees, setAbsentees] = useState('');
      const [quickAbsenceText, setQuickAbsenceText] = useState('');
      const [isHoliday, setIsHoliday] = useState(false);
      const [schedule, setSchedule] = useState(emptySchedule);
      const [homework, setHomework] = useState(initialHomework);
      const [contactBook, setContactBook] = useState([{ id: Date.now(), text: '' }]);
      const [schoolAffairs, setSchoolAffairs] = useState([{ id: Date.now(), text: '', isOk: false }]);
      const [studentEvents, setStudentEvents] = useState([{ id: Date.now()+1, text: '', status: '已處理' }]);
      const [parentContacts, setParentContacts] = useState([{ id: Date.now()+2, text: '', status: '已處理' }]);
      const [notes, setNotes] = useState('');
      
      const [showToast, setShowToast] = useState(false);
      const [toastMessage, setToastMessage] = useState('操作成功！');
      const [isSaving, setIsSaving] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingPeriodId, setEditingPeriodId] = useState(null);
      const [tempSubjectName, setTempSubjectName] = useState('');
      const [autoSaveTime, setAutoSaveTime] = useState('');

      // 正向鼓勵希望卡 Modal 狀態
      const [showHopeModal, setShowHopeModal] = useState(false);
      const [currentHopeCard, setCurrentHopeCard] = useState(null);
      const [dontShowHopeToday, setDontShowHopeToday] = useState(false);
      
      const [weekSettings, setWeekSettings] = useState(defaultWeekSchedule);
      const [holidaySettings, setHolidaySettings] = useState([]); 
      const [tempHolidays, setTempHolidays] = useState('');
      const [excelSyllabus, setExcelSyllabus] = useState([]);

      const [expandedSections, setExpandedSections] = useState({
        schedule: true, contact: true, homework: true, school: true, student: true, parent: true, notes: true
      });

      const applyTheme = (themeId) => {
        const theme = themePalettes.find(t => t.id === themeId) || themePalettes[0];
        document.documentElement.style.setProperty('--color-primary', theme.color);
        document.documentElement.style.setProperty('--color-primary-hover', theme.hover);
        document.documentElement.style.setProperty('--color-primary-light', `${theme.color}20`);
        setCurrentTheme(theme.id);
        localStorage.setItem('homeroom_theme', theme.id);
      };

      useEffect(() => {
        const savedTheme = localStorage.getItem('homeroom_theme');
        if (savedTheme) applyTheme(savedTheme);

        const savedSettings = localStorage.getItem('homeroom_schedule_settings');
        if (savedSettings) {
          try { setWeekSettings(JSON.parse(savedSettings)); } catch (e) {}
        }

        const savedHolidays = localStorage.getItem('homeroom_holidays');
        if (savedHolidays) {
          try { 
            const parsed = JSON.parse(savedHolidays);
            setHolidaySettings(parsed);
            setTempHolidays(parsed.join(', '));
          } catch(e){}
        }

        const savedSyllabus = localStorage.getItem('homeroom_syllabus');
        if (savedSyllabus) {
          try { setExcelSyllabus(JSON.parse(savedSyllabus)); } catch(e){}
        }

        const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}-${mm}-${dd}`;
        setDate(todayStr);
        setWeek(5);

        // 檢查希望卡今天是否不再顯示
        const hideHopeDate = localStorage.getItem('homeroom_hide_hope_date');
        if (hideHopeDate !== todayStr) {
          const randomCard = hopeCards[Math.floor(Math.random() * hopeCards.length)];
          setCurrentHopeCard(randomCard);
          setShowHopeModal(true);
        }

        if (window.firebaseService) {
          const unsubscribe = window.firebaseService.onAuth(async (user) => {
            setCurrentUser(user);
            if (user && !user.isAnonymous) {
              const cloudSettings = await window.firebaseService.getSettingsCloud(user.uid);
              if (cloudSettings) {
                if (cloudSettings.weekSettings) setWeekSettings(cloudSettings.weekSettings);
                if (cloudSettings.holidaySettings) {
                  setHolidaySettings(cloudSettings.holidaySettings);
                  setTempHolidays(cloudSettings.holidaySettings.join(', '));
                }
                if (cloudSettings.excelSyllabus) setExcelSyllabus(cloudSettings.excelSyllabus);
                if (cloudSettings.theme) applyTheme(cloudSettings.theme);
              }
            }
          });
          return () => unsubscribe && unsubscribe();
        }
      }, []);

      const handleCloseHopeModal = () => {
        if (dontShowHopeToday && date) {
          localStorage.setItem('homeroom_hide_hope_date', date);
        }
        setShowHopeModal(false);
      };

      const handleGoogleLogin = async () => {
        if (!window.firebaseService) return;
        setIsLoggingIn(true);
        try {
          const result = await window.firebaseService.signInWithGoogle();
          setToastMessage(`歡迎，${result.user.displayName || '老師'}！已連結雲端同步。`);
          setShowToast(true);
          setTimeout(() => setShowToast(false), 3000);
        } catch (error) {
          console.error("Google 登入失敗:", error);
          setToastMessage("登入未完成或彈出視窗被阻擋，已保留本機備份。");
          setShowToast(true);
          setTimeout(() => setShowToast(false), 3000);
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleLogout = async () => {
        if (!window.firebaseService) return;
        await window.firebaseService.logout();
        setToastMessage("已登出 Google 帳號，系統維持離線使用。");
        setShowToast(true);
        setTimeout(() => setShowToast(false), 2500);
      };

      useEffect(() => {
        if (!date) return;
        
        const isDayOff = holidaySettings.includes(date);
        setIsHoliday(isDayOff);

        const loadLogData = (log) => {
          setWeek(log.week || 1);
          setAbsentees(log.absentees || '');
          setIsHoliday(log.isHoliday ?? isDayOff);
          setSchedule(log.schedule || emptySchedule);
          setHomework(log.homework || initialHomework);
          setContactBook(log.contactBook || [{ id: Date.now(), text: '' }]);
          setSchoolAffairs(log.schoolAffairs || [{ id: Date.now(), text: '', isOk: false }]);
          setStudentEvents(log.studentEvents || [{ id: Date.now()+1, text: '', status: '已處理' }]);
          setParentContacts(log.parentContacts || [{ id: Date.now()+2, text: '', status: '已處理' }]);
          setNotes(log.notes || '');
        };

        const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
        if (savedLogs[date]) {
          loadLogData(savedLogs[date]);
        } else {
          const d = new Date(date);
          const dayOfWeek = d.getDay(); 
          let newSchedule = emptySchedule.map(item => ({ ...item, subject: '', isActive: false }));
          if (dayOfWeek >= 1 && dayOfWeek <= 5) {
            const todaysSubjects = weekSettings[dayOfWeek] || [];
            const matchedProgresses = excelSyllabus.filter(s => s.date === date);

            newSchedule = emptySchedule.map((item, index) => {
              const subjObj = todaysSubjects[index];
              const subjectName = subjObj?.subject || '';
              let assignedContent = '';
              const foundProg = matchedProgresses.find(p => p.subject === subjectName);
              if (foundProg) assignedContent = foundProg.progress;

              return {
                ...item,
                subject: subjectName,
                content: assignedContent,
                isActive: subjObj?.active ?? true
              };
            });
          }
          setSchedule(newSchedule);

          let targetPrevDate = new Date(d);
          if (dayOfWeek === 1) targetPrevDate.setDate(targetPrevDate.getDate() - 3); 
          else if (dayOfWeek === 0) targetPrevDate.setDate(targetPrevDate.getDate() - 2);
          else targetPrevDate.setDate(targetPrevDate.getDate() - 1);
          
          const prevDateStr = `${targetPrevDate.getFullYear()}-${String(targetPrevDate.getMonth() + 1).padStart(2, '0')}-${String(targetPrevDate.getDate()).padStart(2, '0')}`;
          
          if (savedLogs[prevDateStr] && savedLogs[prevDateStr].contactBook) {
              const cbData = savedLogs[prevDateStr].contactBook.filter(cb => cb.text.trim() !== '');
              if (cbData.length > 0) {
                 setHomework(cbData.map((cb, idx) => ({ id: idx + 1, name: cb.text, checked: false, amount: '' })));
              } else {
                setHomework(initialHomework);
              }
          } else {
              setHomework(initialHomework);
          }

          setAbsentees('');
          setContactBook([{ id: Date.now(), text: '' }]);
          setSchoolAffairs([{ id: Date.now(), text: '', isOk: false }]);
          setStudentEvents([{ id: Date.now()+1, text: '', status: '已處理' }]);
          setParentContacts([{ id: Date.now()+2, text: '', status: '已處理' }]);
          setNotes('');
        }

        let unsubCloud = null;
        if (currentUser && window.firebaseService) {
          unsubCloud = window.firebaseService.subscribeLogCloud(currentUser.uid, date, (cloudLog) => {
            if (cloudLog) {
              loadLogData(cloudLog);
              savedLogs[date] = cloudLog;
              localStorage.setItem('homeroom_logs', JSON.stringify(savedLogs));
            }
          });
        }

        return () => unsubCloud && unsubCloud();

      }, [date, weekSettings, holidaySettings, excelSyllabus, currentUser]);

      // 自動存檔
      useEffect(() => {
        if (!date) return;
        const timer = setTimeout(() => {
          const logData = { date, week, absentees, isHoliday, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes };
          
          const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
          savedLogs[date] = logData;
          localStorage.setItem('homeroom_logs', JSON.stringify(savedLogs));
          
          if (currentUser && window.firebaseService) {
            window.firebaseService.saveLogCloud(currentUser.uid, logData);
          }

          const now = new Date();
          setAutoSaveTime(now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }));
        }, 1500);
        return () => clearTimeout(timer);
      }, [date, week, absentees, isHoliday, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes, currentUser]);

      // --- 學生出缺勤智能快捷代碼解析 ---
      const handleApplyQuickAbsence = () => {
        if (!quickAbsenceText.trim()) return;
        
        const mapping = { 's': '病假', 'p': '事假', 'e': '早退', 'l': '遲到' };
        const cleaned = quickAbsenceText.toLowerCase().replace(/：/g, ':').replace(/，/g, ',');
        const parts = cleaned.trim().split(/\s+/);
        const parsedResults = [];

        parts.forEach(part => {
          if (part.includes(':')) {
            const [code, numStr] = part.split(':');
            if (mapping[code] && numStr) {
              const nums = numStr.split(',').map(n => n.trim()).filter(n => n && !isNaN(n)).join(', ');
              if (nums) {
                parsedResults.push(`${mapping[code]}:${nums}`);
              }
            }
          }
        });

        if (parsedResults.length > 0) {
          const resultStr = parsedResults.join(' | ');
          setAbsentees(prev => prev ? `${prev} | ${resultStr}` : resultStr);
          setQuickAbsenceText('');

        const handleExportBackup = () => {
          const backupData = {
            version: '1.0',

            logs: JSON.parse(localStorage.getItem('homeroom_logs') || '{}'),
            scheduleSettings: JSON.parse(localStorage.getItem('homeroom_schedule_settings') || '{}'),
            holidays: JSON.parse(localStorage.getItem('homeroom_holidays') || '[]'),
            syllabus: JSON.parse(localStorage.getItem('homeroom_syllabus') || '[]'),
            theme: localStorage.getItem('homeroom_theme') || 'morandi-gray'
          };

          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
          const downloadAnchor = document.createElement('a');
          const todayStr = new Date().toISOString().split('T')[0];
          downloadAnchor.setAttribute("href", dataStr);
          downloadAnchor.setAttribute("download", `導師日誌完整備份_${todayStr}.json`);
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          downloadAnchor.remove();

          setToastMessage("已成功下載完整 JSON 備份檔！");
          setShowToast(true);
          setTimeout(() => setShowToast(false), 2000);
        };

        // --- 匯入並還原 JSON 備份檔 ---
        const handleImportBackup = (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const data = JSON.parse(evt.target.result);
              if (!data.logs && !data.scheduleSettings) {
                throw new Error("無效的備份檔案格式");
              }

              if (confirm("確定要還原備份嗎？這將會覆蓋現有的日誌與期初設定資料。")) {
                if (data.logs) localStorage.setItem('homeroom_logs', JSON.stringify(data.logs));
                if (data.scheduleSettings) {
                  localStorage.setItem('homeroom_schedule_settings', JSON.stringify(data.scheduleSettings));
                  setWeekSettings(data.scheduleSettings);
                }
                if (data.holidays) {
                  localStorage.setItem('homeroom_holidays', JSON.stringify(data.holidays));
                  setHolidaySettings(data.holidays);
                  setTempHolidays(data.holidays.join(', '));
                }
                if (data.syllabus) {
                  localStorage.setItem('homeroom_syllabus', JSON.stringify(data.syllabus));
                  setExcelSyllabus(data.syllabus);
                }
                if (data.theme) applyTheme(data.theme);

                // 若目前為登入狀態，同步將還原的資料備份至雲端
                if (currentUser && window.firebaseService) {
                  window.firebaseService.saveSettingsCloud(currentUser.uid, {
                    weekSettings: data.scheduleSettings,
                    holidaySettings: data.holidays,
                    excelSyllabus: data.syllabus,
                    theme: data.theme
                  });
                  if (data.logs) {
                    Object.keys(data.logs).forEach(logDate => {
                      window.firebaseService.saveLogCloud(currentUser.uid, data.logs[logDate]);
                    });
                  }
                }

                setToastMessage("備份還原成功！頁面即將重新載入...");
                setShowToast(true);
                setTimeout(() => window.location.reload(), 1500);
              }
            } catch (err) {
              setToastMessage("備份檔解析失敗，請確認檔案格式是否正確！");
              setShowToast(true);
              setTimeout(() => setShowToast(false), 2500);
            }
          };
          reader.readAsText(file);

              <div className="flex gap-2 w-full sm:w-auto bg-gray-100 p-1.5 rounded-xl">
                <button onClick={() => setExportMode('daily')} className={`flex-1 sm:flex-none px-4 py-2 rounded-lg font-bold text-sm transition-all ${exportMode === 'daily' ? 'bg-white text-theme shadow-sm' : 'text-gray-500'}`}>單日預覽</button>
                <button onClick={() => setExportMode('weekly')} className={`flex-1 sm:flex-none px-4 py-2 rounded-lg font-bold text-sm transition-all ${exportMode === 'weekly' ? 'bg-white text-theme shadow-sm' : 'text-gray-500'}`}>一週預覽 (一~五)</button>
              </div>
              <button onClick={handlePrint} className="w-full sm:w-auto px-6 py-3 bg-darkText text-white rounded-xl font-bold shadow-md hover:bg-gray-800 flex items-center justify-center gap-2">
                <i className="ph-bold ph-printer"></i> {exportMode === 'weekly' ? '匯出整週 PDF (共 5 頁)' : '匯出單日 PDF'}
              </button>
            </div>

      <div className="flex flex-col gap-8 print:gap-0">
              {pagesToRender.map((pageData, pageIdx) => (
                <div key={pageData.date} 
                     className="bg-white p-6 sm:p-8 print:p-2 shadow-md mx-auto rounded-none sm:rounded-xl text-black relative" 
                     style={{ minHeight: '297mm', maxWidth: '210mm', width: '100%', pageBreakAfter: pageIdx !== pagesToRender.length - 1 ? 'always' : 'auto' }}>
                  
                  <h1 className="text-2xl sm:text-3xl font-bold text-center mb-8 tracking-widest border-b-2 border-black pb-4">
                    115學年度 第一學期 導師工作日誌
                  </h1>
                  
                  <div className="flex justify-between items-end mb-4 font-bold text-lg">
                    <div>第 <span className="underline px-2">{pageData.week}</span> 週</div>
                    <div>{pageData.date ? pageData.date.split('-')[0] : '2026'} 年 <span className="underline px-2">{pageData.date ? pageData.date.split('-')[1] : '10'}</span> 月 <span className="underline px-2">{pageData.date ? pageData.date.split('-')[2] : '01'}</span> 日 【 {getDayString(pageData.date)} 】</div>
                    <div>請假學生：<span className="underline px-4">{pageData.absentees || '無'}</span></div>
                  </div>

                  {pageData.isHoliday ? (
                     <div className="border-2 border-black flex flex-col items-center justify-center text-gray-400" style={{ height: '220mm' }}>
                         <i className="ph-fill ph-calendar-x text-7xl mb-4 text-gray-300"></i>
                         <h2 className="text-3xl font-bold tracking-widest text-gray-400">（ 本 日 放 假 / 停 課 ）</h2>
                     </div>
                  ) : (
                     <>
                        <table className="w-full border-collapse border-2 border-black mb-6 text-sm">
                          <thead>
                            <tr>
                              <th className="border-2 border-black p-2 w-10 text-center shrink-0">節次</th>
                              <th className="border-2 border-black p-2 w-[10%]">科目</th>
                              <th className="border-2 border-black p-2 w-[47%]">教學實際進度</th>
                              <th className="border-2 border-black p-2 w-[23%]">作業批閱</th>
                              <th className="border-2 border-black p-2 w-12 text-center shrink-0">數量</th>
                            </tr>
                          </thead>
                          <tbody>
                            {pageData.schedule.map((item, index) => (
                              <tr key={item.id} className={index === 4 ? "border-t-[3px] border-black" : ""}>
                                <td className="border border-black p-2 text-center font-bold text-lg">{item.period}</td>
                                
                                {item.isActive !== false ? (
                                  <>
                                    <td className="border border-black p-2">{item.subject}</td>
                                    <td className="border border-black p-2 relative h-16">
                                      <div className="mb-4 pr-10">{item.content}</div>
                                      <div className="flex gap-2 text-[10px] absolute bottom-1 right-1 opacity-80">
                                        <span>{item.status === '完成' ? '☑' : '☐'}完成</span>
                                        <span>{item.status === '超前' ? '☑' : '☐'}超前</span>
                                        <span>{item.status === '待補課' ? '☑' : '☐'}待補課</span>
                                      </div>
                                    </td>
                                  </>
                                ) : (
                                  <td className="border border-black p-2 text-center text-gray-400 bg-gray-50" colSpan="2">
                                     <span className="opacity-50 tracking-widest text-xs">（ 非 任 教 節 次 ）</span>
                                  </td>
                                )}

                                {index < 5 ? (
                                  <>
                                    <td className="border border-black p-2">
                                      {pageData.homework[index]?.checked ? '☑' : '☐'} {pageData.homework[index]?.name}
                                    </td>
                                    <td className="border border-black p-2 text-center">{pageData.homework[index]?.amount}</td>
                                  </>
                                ) : index === 5 ? (
                                   <td colSpan="2" rowSpan="2" className="border-2 border-black p-2 align-top">
                                      <div className="font-bold text-center border-b border-black mb-1 pb-1">學校相關事務</div>
                                      {(pageData.schoolAffairs || []).filter(s => s.text).map((s, i) => (
                                        <div key={i} className="flex justify-between mb-1 text-xs">
                                          <span>{s.text}</span>
                                          <span>{s.isOk ? '☑' : '☐'}OK</span>
                                        </div>
                                      ))}
                                   </td>
                                ) : null}
                              </tr>
                            ))}
                          </tbody>
                        </table>

                        <table className="w-full border-collapse border-2 border-black text-sm">
                          <tbody>
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 今日聯絡簿</td>
                            </tr>
                            <tr>
                              <td colSpan="2" className="border-2 border-black p-2 align-top h-16">
                                <div className="grid grid-cols-2 gap-x-4 text-xs">
                                  {(pageData.contactBook || []).filter(cb => cb.text.trim()).map((cb, idx) => (
                                     <div key={idx} className="mb-1">{idx + 1}. {cb.text}</div>
                                  ))}
                                </div>
                              </td>
                            </tr>
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 學生事件</td>
                            </tr>
                            {(pageData.studentEvents || []).length > 0 ? (pageData.studentEvents || []).map((evt, idx) => (
                               <tr key={idx}>
                                  <td className="border border-black p-2 h-8 w-3/4 text-xs">{evt.text}</td>
                                  <td className="border border-black p-2 text-center w-1/4 text-xs">
                                     {evt.status === '已處理' ? '☑' : '☐'} 已處理 &nbsp;&nbsp; {evt.status === '需轉介' ? '☑' : '☐'} 需轉介
                                  </td>
                               </tr>
                            )) : (
                               <tr><td className="border border-black p-2 h-8 text-gray-300 text-xs" colSpan="2">無紀錄</td></tr>
                            )}
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 家長聯繫</td>
                            </tr>
                            {(pageData.parentContacts || []).length > 0 ? (pageData.parentContacts || []).map((evt, idx) => (
                               <tr key={idx}>
                                  <td className="border border-black p-2 h-8 w-3/4 text-xs">{evt.text}</td>
                                  <td className="border border-black p-2 text-center w-1/4 text-xs">
                                     {evt.status === '已處理' ? '☑' : '☐'} 已處理 &nbsp;&nbsp; {evt.status === '需轉達' ? '☑' : '☐'} 需轉達
                                  </td>
                               </tr>
                            )) : (
                               <tr><td className="border border-black p-2 h-8 text-gray-300 text-xs" colSpan="2">無紀錄</td></tr>
                            )}
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 其他記事</td>
                            </tr>
                            <tr>
                              <td colSpan="2" className="border-2 border-black p-2 h-20 align-top whitespace-pre-wrap text-xs">
                                {pageData.notes}
                              </td>
                            </tr>
                          </tbody>
                        </table>
                     </>
                  )}
                </div>
              ))}
            </div>
          </div>
        );
      };

      return (
        <div className="w-full relative min-h-screen">
          {/* 頂部導航列與 Google 登入同步控制 */}
          <nav className="bg-white shadow-sm sticky top-0 z-50 print:hidden">
            <div className="max-w-5xl mx-auto px-4 flex justify-between items-center h-16">
              <div className="font-bold text-lg flex items-center gap-2 text-darkText">
                 {activeTab === 'log' && <><i className="ph-fill ph-pencil-line text-theme"></i> 導師日誌</>}
                 {activeTab === 'settings' && <><i className="ph-fill ph-gear text-theme"></i> 期初設定與主題</>}
                 {activeTab === 'export' && <><i className="ph-fill ph-printer text-theme"></i> 匯出與預覽</>}
              </div>

              <div className="flex items-center gap-3">
                {currentUser && !currentUser.isAnonymous ? (
                  <div className="flex items-center gap-2.5 bg-gray-50 border border-gray-200 px-3 py-1.5 rounded-2xl">
                    {currentUser.photoURL ? (
                      <img src={currentUser.photoURL} className="w-7 h-7 rounded-full" alt="User Avatar" />
                    ) : (
                      <div className="w-7 h-7 rounded-full bg-theme text-white flex items-center justify-center font-bold text-xs">
                        {currentUser.displayName ? currentUser.displayName[0] : '教'}
                      </div>
                    )}
                    <span className="text-xs font-bold text-darkText hidden sm:inline">
                      {currentUser.displayName || '導師帳號'}
                    </span>
                    <button 
                      onClick={handleLogout} 
                      title="登出帳號"
                      className="text-xs text-gray-400 hover:text-danger pl-1">
                      <i className="ph-bold ph-sign-out text-base"></i>
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={handleGoogleLogin} 
                    disabled={isLoggingIn}
                    className="flex items-center gap-2 bg-white border border-gray-300 hover:bg-gray-50 text-darkText px-3.5 py-2 rounded-2xl font-bold text-xs shadow-sm transition-all">
                    <svg className="w-4 h-4" viewBox="0 0 24 24">
                      <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                      <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.15C3.26 21.3 7.31 24 12 24z"/>
                      <path fill="#FBBC05" d="M5.28 14.24c-.25-.75-.38-1.55-.38-2.36s.13-1.61.38-2.36V6.37H1.29C.47 8.01 0 9.94 0 12s.47 3.99 1.29 5.63l3.99-3.39z"/>
                      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.37l3.99 3.39c.95-2.85 3.6-4.96 6.72-4.96z"/>
                    </svg>
                    <span>{isLoggingIn ? '驗證中...' : 'Google 登入同步'}</span>
                  </button>
                )}

                <button 
                  onClick={() => setIsMenuOpen(!isMenuOpen)} 
                  className="p-2 text-gray-500 hover:text-theme transition-colors focus:outline-none tap-highlight-transparent flex items-center justify-center rounded-xl active:bg-gray-100">
                  <i className={`ph-bold ${isMenuOpen ? 'ph-x' : 'ph-list'} text-2xl`}></i>
                </button>
              </div>
            </div>

            <div className={`overflow-hidden transition-all duration-300 ease-in-out ${isMenuOpen ? 'max-h-60 border-t border-gray-100 shadow-inner' : 'max-h-0'}`}>
              <div className="max-w-5xl mx-auto px-4 py-4 flex flex-col gap-2.5 bg-gray-50">
                <button onClick={() => { setActiveTab('log'); setIsMenuOpen(false); }} 
                        className={`text-left px-5 py-3.5 rounded-xl font-bold transition-all flex items-center gap-3 ${activeTab === 'log' ? 'bg-theme text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100 shadow-sm border border-gray-100'}`}>
                  <i className="ph-fill ph-pencil-line text-xl w-6 text-center"></i> 填寫日誌
                </button>
                <button onClick={() => { setActiveTab('settings'); setIsMenuOpen(false); }} 
                        className={`text-left px-5 py-3.5 rounded-xl font-bold transition-all flex items-center gap-3 ${activeTab === 'settings' ? 'bg-theme text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100 shadow-sm border border-gray-100'}`}>
                  <i className="ph-fill ph-gear text-xl w-6 text-center"></i> 期初設定 (課表、主題與進度)
                </button>
                <button onClick={() => { setActiveTab('export'); setIsMenuOpen(false); }} 
                        className={`text-left px-5 py-3.5 rounded-xl font-bold transition-all flex items-center gap-3 ${activeTab === 'export' ? 'bg-theme text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100 shadow-sm border border-gray-100'}`}>
                  <i className="ph-fill ph-printer text-xl w-6 text-center"></i> 匯出與列印預覽
                </button>
              </div>
            </div>
          </nav>

          <main className="max-w-5xl mx-auto">
            {activeTab === 'log' && renderLogView()}
            {activeTab === 'settings' && renderSettingsView()}
            {activeTab === 'export' && renderExportView()}
          </main>

          {/* 正向鼓勵希望卡 Modal */}
          {showHopeModal && currentHopeCard && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[70] p-4 print:hidden animate-fadeIn">
              <div className="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl border border-gray-100 transform transition-all">
                <div className={`bg-gradient-to-r ${currentHopeCard.color} p-6 text-white relative`}>
                  <button 
                    onClick={handleCloseHopeModal}
                    className="absolute top-4 right-4 text-white/80 hover:text-white bg-black/20 hover:bg-black/40 rounded-full w-8 h-8 flex items-center justify-center transition-all">
                    <i className="ph-bold ph-x text-lg"></i>
                  </button>
                  <div className="flex items-center gap-2 mb-2">
                    <span className="text-xl">✨</span>
                    <span className="text-xs font-bold tracking-wider uppercase bg-white/20 px-3 py-1 rounded-full backdrop-blur-md">
                      今日導師希望卡 ({currentHopeCard.title})
                    </span>
                  </div>
                  <h3 className="text-xl font-bold tracking-wide">給親愛的導師：</h3>
                </div>

                <div className="p-6 text-center">
                  <div className={`p-6 rounded-2xl ${currentHopeCard.bgLight} ${currentHopeCard.border} border mb-6 shadow-inner`}>
                    <p className={`text-base sm:text-lg font-bold leading-relaxed ${currentHopeCard.text}`}>
                      {currentHopeCard.quote}
                    </p>
                  </div>

                  <div className="flex items-center justify-between pt-2 border-t border-gray-100 gap-2">
                    <label className="flex items-center gap-2 text-xs font-bold text-gray-500 cursor-pointer select-none">
                      <input 
                        type="checkbox" 
                        checked={dontShowHopeToday}
                        onChange={(e) => setDontShowHopeToday(e.target.checked)}
                        className="w-4 h-4 rounded accent-theme cursor-pointer"
                      />
                      今日不再顯示
                    </label>
                    <button 
                      onClick={handleCloseHopeModal}
                      className={`px-5 py-2.5 bg-gradient-to-r ${currentHopeCard.color} text-white font-bold rounded-xl text-xs sm:text-sm shadow-md hover:opacity-90 active:scale-95 transition-all`}>
                      接收祝福 ❤️
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 修改科目 Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[60] p-4 print:hidden">
              <div className="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl">
                <h3 className="text-lg font-bold text-darkText mb-2 flex items-center gap-2">
                  <i className="ph-bold ph-pencil-simple text-theme"></i> 修改科目
                </h3>
                <p className="text-xs text-gray-500 mb-4">如遇調課或代課，請直接修改科目名稱。</p>
                <input 
                  type="text" 
                  value={tempSubjectName} 
                  onChange={(e) => setTempSubjectName(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && saveSubjectChange()}
                  autoFocus
                  className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-5 text-darkText font-bold ring-theme focus:ring-2 outline-none"
                />
                <div className="flex gap-3">
                  <button onClick={() => setIsModalOpen(false)} className="flex-1 py-3 bg-gray-100 text-gray-600 font-bold rounded-xl">取消</button>
                  <button onClick={saveSubjectChange} className="flex-1 py-3 bg-theme text-white font-bold rounded-xl">確定</button>
                </div>
              </div>
            </div>
          )}

          {/* Toast 提示 */}
          {showToast && (
            <div className="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-darkText/90 backdrop-blur-md text-white px-8 py-5 rounded-3xl shadow-2xl flex flex-col items-center gap-3 z-[60] animate-bounce print:hidden max-w-xs text-center">
              <div className="w-12 h-12 bg-green-400 rounded-full flex items-center justify-center mb-1">
                 <i className="ph-bold ph-check text-2xl text-darkText"></i>
              </div>
              <span className="font-bold text-sm leading-relaxed">{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
