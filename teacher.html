<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>導師日誌</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- 引入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 隱藏滾動條，維持美觀 */
    ::-webkit-scrollbar { display: none; }
    body { 
      -ms-overflow-style: none; 
      scrollbar-width: none; 
      font-family: 'system-ui', -apple-system, sans-serif;
      background-color: #F7F5F2;
    }
    
    .tap-highlight-transparent {
      -webkit-tap-highlight-color: transparent;
    }

    /* 列印專屬樣式 (匯出 PDF 時確保 A4 滿版與黑白清晰) */
    @media print {
      body { background-color: #FFFFFF !important; }
      @page { size: A4; margin: 15mm; }
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6B7280',
            accent: '#8B9A96',
            paper: '#FFFFFF',
            danger: '#E5989B',
            highlight: '#E2E8F0',
            darkText: '#374151'
          }
        }
      }
    }
  </script>
</head>
<body class="text-gray-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 預設空課表與設定 ---
    const emptySchedule = [
      { id: 1, period: 1, subject: '', content: '', status: '完成' },
      { id: 2, period: 2, subject: '', content: '', status: '完成' },
      { id: 3, period: 3, subject: '', content: '', status: '完成' },
      { id: 4, period: 4, subject: '', content: '', status: '完成' },
      { id: 5, period: 5, subject: '', content: '', status: '完成' },
      { id: 6, period: 6, subject: '', content: '', status: '完成' },
      { id: 7, period: 7, subject: '', content: '', status: '完成' },
    ];

    // 預設的期初課表格式
    const defaultWeekSchedule = {
      1: ['國語', '數學', '英文', '自然', '社會', '綜合', '健體'], // 星期一
      2: ['數學', '國語', '健體', '綜合', '社會', '自然', '英文'], // 星期二
      3: ['國語', '數學', '美勞', '美勞', '綜合', '空白', '空白'], // 星期三 (通常半天)
      4: ['自然', '社會', '數學', '國語', '英文', '電腦', '音樂'], // 星期四
      5: ['國語', '數學', '英文', '綜合', '健體', '班會', '社團'], // 星期五
    };

    const initialHomework = [
      { id: 1, name: '聯絡本', checked: false, amount: '' },
      { id: 2, name: '生字', checked: false, amount: '' },
      { id: 3, name: '圈詞', checked: false, amount: '' },
      { id: 4, name: '國單', checked: false, amount: '' },
      { id: 5, name: '數單', checked: false, amount: '' },
    ];

    function App() {
      // --- 視圖狀態 ---
      const [activeTab, setActiveTab] = useState('log'); // 'log' | 'settings' | 'export'

      // --- 表單狀態 ---
      const [date, setDate] = useState('');
      const [week, setWeek] = useState(1);
      const [absentees, setAbsentees] = useState('');
      const [schedule, setSchedule] = useState(emptySchedule);
      const [homework, setHomework] = useState(initialHomework);
      const [contactBook, setContactBook] = useState([{ id: Date.now(), text: '' }]); // 新增聯絡簿狀態
      const [schoolAffairs, setSchoolAffairs] = useState([{ id: Date.now(), text: '', isOk: false }]);
      const [studentEvents, setStudentEvents] = useState([{ id: Date.now()+1, text: '', status: '已處理' }]);
      const [parentContacts, setParentContacts] = useState([{ id: Date.now()+2, text: '', status: '已處理' }]);
      const [notes, setNotes] = useState('');
      
      // --- UI 與設定狀態 ---
      const [showToast, setShowToast] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingPeriodId, setEditingPeriodId] = useState(null);
      const [tempSubjectName, setTempSubjectName] = useState('');
      
      // 新增：自動儲存時間狀態 (Auto-Save 救星)
      const [autoSaveTime, setAutoSaveTime] = useState('');
      
      // 儲存期初課表的 State
      const [weekSettings, setWeekSettings] = useState(defaultWeekSchedule);

      // --- 初始化與 localStorage 讀取 ---
      useEffect(() => {
        // 從 LocalStorage 讀取期初課表設定
        const savedSettings = localStorage.getItem('homeroom_schedule_settings');
        if (savedSettings) {
          setWeekSettings(JSON.parse(savedSettings));
        }

        // 設定初始日期為今天
        const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        setDate(`${yyyy}-${mm}-${dd}`);
        setWeek(5); 
      }, []);

      // --- 當日期改變時，自動套用該星期的課表 ---
      useEffect(() => {
        if (!date) return;
        
        // 嘗試讀取當天的歷史紀錄
        const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
        if (savedLogs[date]) {
          const log = savedLogs[date];
          setWeek(log.week || 1);
          setAbsentees(log.absentees || '');
          setSchedule(log.schedule || emptySchedule);
          setHomework(log.homework || initialHomework);
          setContactBook(log.contactBook || [{ id: Date.now(), text: '' }]);
          setSchoolAffairs(log.schoolAffairs || [{ id: Date.now(), text: '', isOk: false }]);
          setStudentEvents(log.studentEvents || [{ id: Date.now()+1, text: '', status: '已處理' }]);
          setParentContacts(log.parentContacts || [{ id: Date.now()+2, text: '', status: '已處理' }]);
          setNotes(log.notes || '');
          return;
        }

        // 若當天無紀錄，套用期初設定課表
        const d = new Date(date);
        const dayOfWeek = d.getDay(); // 0(日) ~ 6(六)
        
        if (dayOfWeek >= 1 && dayOfWeek <= 5) {
          const todaysSubjects = weekSettings[dayOfWeek];
          setSchedule(prevSchedule => 
            prevSchedule.map((item, index) => ({
              ...item,
              subject: todaysSubjects[index] || ''
            }))
          );
        } else {
          setSchedule(prevSchedule => prevSchedule.map(item => ({ ...item, subject: '' })));
        }

        // 神奇功能：尋找最近一天的歷史紀錄，將其「聯絡簿」自動轉為今天的「作業批閱」
        const prevDates = Object.keys(savedLogs).sort().filter(d => d < date);
        if (prevDates.length > 0) {
           const lastLog = savedLogs[prevDates[prevDates.length - 1]];
           if (lastLog.contactBook && lastLog.contactBook.some(cb => cb.text.trim() !== '')) {
               const newHomework = lastLog.contactBook
                   .filter(cb => cb.text.trim() !== '')
                   .map((cb, idx) => ({ id: idx + 1, name: cb.text, checked: false, amount: '' }));
               setHomework(newHomework);
           } else {
               setHomework(initialHomework);
           }
        } else {
           setHomework(initialHomework);
        }
        
        // 清空其他今日新填項
        setAbsentees('');
        setContactBook([{ id: Date.now(), text: '' }]);
        setSchoolAffairs([{ id: Date.now(), text: '', isOk: false }]);
        setStudentEvents([{ id: Date.now()+1, text: '', status: '已處理' }]);
        setParentContacts([{ id: Date.now()+2, text: '', status: '已處理' }]);
        setNotes('');
        
      }, [date, weekSettings]); // 當日期或設定改變時觸發

      // --- 新增：斷線自動存檔 (Auto-Save 救星) ---
      useEffect(() => {
        if (!date) return;
        
        // 延遲 1.5 秒執行儲存，避免每打一個字就寫入一次造成卡頓
        const timer = setTimeout(() => {
          const logData = { date, week, absentees, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes };
          const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
          
          savedLogs[date] = logData;
          localStorage.setItem('homeroom_logs', JSON.stringify(savedLogs));
          
          // 更新 UI 顯示的儲存時間
          const now = new Date();
          setAutoSaveTime(now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }));
        }, 1500);

        return () => clearTimeout(timer); // 重新計時 (Debounce 技術)
      }, [date, week, absentees, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes]);

      // --- 資料更新處理函數 ---
      const updateSchedule = (id, field, value) => {
        setSchedule(schedule.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const updateHomework = (id, field, value) => {
        setHomework(homework.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const updateEvent = (type, id, field, value) => {
        if (type === 'student') setStudentEvents(studentEvents.map(item => item.id === id ? { ...item, [field]: value } : item));
        if (type === 'parent') setParentContacts(parentContacts.map(item => item.id === id ? { ...item, [field]: value } : item));
        if (type === 'school') setSchoolAffairs(schoolAffairs.map(item => item.id === id ? { ...item, [field]: value } : item));
        if (type === 'contact') setContactBook(contactBook.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const addEvent = (type) => {
        const newEvent = { id: Date.now(), text: '', status: '已處理' };
        if (type === 'student') setStudentEvents([...studentEvents, newEvent]);
        if (type === 'parent') setParentContacts([...parentContacts, newEvent]);
        if (type === 'school') setSchoolAffairs([...schoolAffairs, { id: Date.now(), text: '', isOk: false }]);
        if (type === 'contact') setContactBook([...contactBook, { id: Date.now(), text: '' }]);
      };

      const removeEvent = (type, id) => {
        if (type === 'student') setStudentEvents(studentEvents.filter(e => e.id !== id));
        if (type === 'parent') setParentContacts(parentContacts.filter(e => e.id !== id));
        if (type === 'school') setSchoolAffairs(schoolAffairs.filter(e => e.id !== id));
        if (type === 'contact') setContactBook(contactBook.filter(e => e.id !== id));
      };

      // --- Modal 處理 ---
      const openSubjectModal = (item) => {
        setEditingPeriodId(item.id);
        setTempSubjectName(item.subject);
        setIsModalOpen(true);
      };

      const saveSubjectChange = () => {
        if (editingPeriodId !== null) {
          updateSchedule(editingPeriodId, 'subject', tempSubjectName);
        }
        setIsModalOpen(false);
      };

      // --- 儲存與列印 ---
      const handleSave = () => {
        if (isSaving) return;
        setIsSaving(true);
        const logData = { date, week, absentees, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes };
        
        // 儲存到 LocalStorage 以利跨日自動讀取聯絡簿
        const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
        savedLogs[date] = logData;
        localStorage.setItem('homeroom_logs', JSON.stringify(savedLogs));
        
        console.log("準備送出至資料庫 Data: ", logData);
        
        setTimeout(() => {
          setIsSaving(false);
          setShowToast(true);
          setTimeout(() => setShowToast(false), 3000);
        }, 1000);
      };

      const handlePrint = () => {
        window.print();
      };

      const saveSettingsToLocal = () => {
        localStorage.setItem('homeroom_schedule_settings', JSON.stringify(weekSettings));
        setShowToast(true);
        setTimeout(() => setShowToast(false), 2000);
      };

      // 計算星期幾字串
      const getDayString = (dateStr) => {
        if (!dateStr) return '';
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        return days[new Date(dateStr).getDay()];
      };

      // --- 新增：常用片語清單 (Quick Phrases) ---
      const quickPhrases = {
        student: ['作業缺交', '上課分心', '常規不佳', '遲到', '身體不適', '與同學衝突'],
        parent: ['作業提醒', '近期表現佳', '電訪:行為宣導', '電訪:身體狀況', '傳達班級事務']
      };

      // ==========================================
      // RENDER: 日誌填寫畫面 (支援 RWD 雙欄)
      // ==========================================
      const renderLogView = () => (
        <div className="pb-28">
          {/* Header */}
          <header className="bg-accent text-white p-5 lg:p-6 rounded-b-3xl shadow-md mb-6 sticky top-0 z-10 transition-all">
            <div className="flex justify-between items-center mb-4">
              <h1 className="text-2xl font-bold flex items-center gap-2">
                <i className="ph-fill ph-notebook text-3xl"></i> 導師日誌
              </h1>
              <div className="flex flex-col items-end gap-1">
                <span className="text-sm bg-white/20 px-3 py-1 rounded-full font-medium tracking-wide">115 學年度</span>
                {/* 顯示自動存檔時間 */}
                {autoSaveTime && <span className="text-[10px] text-white/80 flex items-center gap-1 font-medium"><i className="ph-bold ph-cloud-check"></i>已自動儲存 {autoSaveTime}</span>}
              </div>
            </div>
            
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="col-span-1 lg:col-span-1">
                <label className="text-xs opacity-80 block mb-1 font-medium">日期</label>
                <input type="date" value={date} onChange={(e) => setDate(e.target.value)} 
                       className="w-full bg-white/20 border-none text-white rounded-xl p-2.5 focus:ring-2 focus:ring-white outline-none" />
              </div>
              <div className="col-span-1 lg:col-span-1 flex gap-2">
                <div className="w-1/2">
                  <label className="text-xs opacity-80 block mb-1 font-medium">週次</label>
                  <input type="number" value={week} onChange={(e) => setWeek(e.target.value)} 
                         className="w-full bg-white/20 border-none text-white text-center rounded-xl p-2.5 focus:ring-2 focus:ring-white outline-none" />
                </div>
                <div className="w-1/2">
                  <label className="text-xs opacity-80 block mb-1 font-medium">星期</label>
                  <div className="w-full bg-white/10 border-none text-white text-center rounded-xl p-2.5">
                    {getDayString(date)}
                  </div>
                </div>
              </div>
              <div className="col-span-2 lg:col-span-2">
                <label className="text-xs opacity-80 block mb-1 font-medium">請假學生 (座號)</label>
                <input type="text" placeholder="如: 5, 12" value={absentees} onChange={(e) => setAbsentees(e.target.value)} 
                       className="w-full bg-white/20 border-none text-white placeholder-white/50 rounded-xl p-2.5 focus:ring-2 focus:ring-white outline-none" />
              </div>
            </div>
          </header>

          {/* RWD 雙欄配置 Grid */}
          <div className="px-4 lg:px-8 grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-10">
            
            {/* 左欄：課表與作業 */}
            <div className="space-y-6">
              <section>
                <h2 className="text-lg font-bold mb-3 flex items-center gap-2 text-darkText">
                  <i className="ph-fill ph-chalkboard-teacher text-accent text-2xl"></i> 教學實際進度
                </h2>
                <div className="space-y-3">
                  {schedule.map((item) => (
                    <div key={item.id} className="bg-paper p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-3">
                      <div className="flex justify-between items-center">
                        <div className="flex items-center gap-3">
                          <span className="bg-highlight text-primary w-7 h-7 flex items-center justify-center rounded-full text-sm font-bold">{item.period}</span>
                          <div className="flex items-center gap-1">
                            <span className="font-bold text-lg text-darkText w-16">{item.subject || '無'}</span>
                            <button className="text-gray-400 hover:text-accent p-1.5 rounded-full bg-gray-50 active:bg-gray-200 tap-highlight-transparent transition-colors" 
                                    onClick={() => openSubjectModal(item)}>
                              <i className="ph-bold ph-arrows-left-right text-lg"></i>
                            </button>
                          </div>
                        </div>
                        <div className="flex bg-gray-100 rounded-xl p-1">
                          {['完成', '超前', '待補課'].map(status => (
                            <button key={status}
                              className={`px-2 lg:px-3 py-1.5 text-xs rounded-lg font-medium transition-all ${item.status === status ? 'bg-white shadow-sm text-accent scale-105' : 'text-gray-500 hover:text-gray-700'}`}
                              onClick={() => updateSchedule(item.id, 'status', status)}>
                              {status}
                            </button>
                          ))}
                        </div>
                      </div>
                      <input type="text" placeholder="輸入教學單元或內容..." value={item.content} onChange={(e) => updateSchedule(item.id, 'content', e.target.value)} 
                             className="w-full bg-gray-50 rounded-xl p-3 text-sm focus:bg-white focus:ring-2 focus:ring-accent/50 outline-none transition-all placeholder-gray-400 border border-transparent focus:border-accent/30" />
                    </div>
                  ))}
                </div>
              </section>

              <section>
                <h2 className="text-lg font-bold mb-3 flex items-center gap-2 text-darkText">
                  <i className="ph-fill ph-pencil-line text-accent text-2xl"></i> 聯絡簿指派 (今日作業)
                </h2>
                <div className="bg-paper p-3 rounded-2xl shadow-sm border border-gray-100 space-y-2">
                  {contactBook.map((item, idx) => (
                    <div key={item.id} className="flex gap-2 items-center">
                      <span className="text-accent font-bold text-sm w-5">{idx + 1}.</span>
                      <input type="text" placeholder="輸入作業內容 (自動帶入明天批閱欄)..." value={item.text} onChange={(e) => updateEvent('contact', item.id, 'text', e.target.value)}
                             onKeyDown={(e) => e.key === 'Enter' && addEvent('contact')}
                             className="flex-1 bg-gray-50 border border-transparent rounded-xl p-2 text-sm focus:bg-white focus:ring-2 focus:ring-accent/50 outline-none" />
                      <button onClick={() => removeEvent('contact', item.id)} className="p-2 text-gray-300 hover:text-danger rounded-xl transition-colors">
                        <i className="ph-bold ph-trash"></i>
                      </button>
                    </div>
                  ))}
                  <button onClick={() => addEvent('contact')} className="w-full py-2 text-sm text-accent font-bold border-2 border-dashed border-accent/30 rounded-xl hover:bg-accent/5 transition-colors flex items-center justify-center gap-1">
                    <i className="ph-bold ph-plus"></i> 新增作業
                  </button>
                </div>
              </section>

              <section>
                <h2 className="text-lg font-bold mb-3 flex items-center gap-2 text-darkText">
                  <i className="ph-fill ph-books text-accent text-2xl"></i> 作業批閱 (昨日指派)
                </h2>
                <div className="bg-paper rounded-2xl shadow-sm border border-gray-100 p-2">
                  {homework.map((hw) => (
                    <div key={hw.id} className="flex items-center justify-between p-3 border-b border-gray-50 last:border-0">
                      <label className="flex items-center gap-3 cursor-pointer tap-highlight-transparent flex-1">
                        <div className={`w-6 h-6 rounded-md flex items-center justify-center transition-colors ${hw.checked ? 'bg-accent text-white' : 'bg-gray-100 border border-gray-300'}`}>
                           {hw.checked && <i className="ph-bold ph-check text-sm"></i>}
                        </div>
                        <input type="checkbox" checked={hw.checked} onChange={(e) => updateHomework(hw.id, 'checked', e.target.checked)} className="hidden" />
                        <span className={`${hw.checked ? 'text-darkText font-bold' : 'text-gray-500 font-medium'}`}>{hw.name}</span>
                      </label>
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-gray-400">數量</span>
                        <input type="number" placeholder="-" value={hw.amount} onChange={(e) => updateHomework(hw.id, 'amount', e.target.value)}
                               className="w-14 text-center bg-gray-50 border border-gray-100 rounded-lg p-1.5 text-sm focus:ring-2 focus:ring-accent/50 outline-none" />
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            </div>

            {/* 右欄：事件與記事 */}
            <div className="space-y-6">
              <section>
                <h2 className="text-lg font-bold mb-3 flex items-center gap-2 text-darkText">
                  <i className="ph-fill ph-buildings text-accent text-2xl"></i> 學校事務與會議
                </h2>
                <div className="space-y-3">
                  {schoolAffairs.map((evt) => (
                    <div key={evt.id} className="bg-paper p-1.5 pl-3 rounded-2xl shadow-sm border border-gray-100 flex gap-2 items-center focus-within:border-accent/50 transition-colors">
                      <input type="text" placeholder="處室宣導、會議紀錄..." value={evt.text} onChange={(e) => updateEvent('school', evt.id, 'text', e.target.value)}
                             className="flex-1 bg-transparent py-2 text-sm outline-none text-darkText min-w-0" />
                      <label className="flex items-center gap-1.5 cursor-pointer tap-highlight-transparent bg-gray-50 hover:bg-gray-100 px-3 py-2 rounded-xl transition-colors flex-shrink-0">
                        <div className={`w-5 h-5 rounded flex items-center justify-center transition-colors ${evt.isOk ? 'bg-accent text-white' : 'bg-white border border-gray-300'}`}>
                           {evt.isOk && <i className="ph-bold ph-check text-xs"></i>}
                        </div>
                        <input type="checkbox" checked={evt.isOk} onChange={(e) => updateEvent('school', evt.id, 'isOk', e.target.checked)} className="hidden" />
                        <span className={`text-xs font-bold ${evt.isOk ? 'text-accent' : 'text-gray-400'}`}>OK</span>
                      </label>
                      <button onClick={() => removeEvent('school', evt.id)} className="p-2 mr-1 text-gray-300 hover:text-danger bg-gray-50 rounded-xl transition-colors flex-shrink-0">
                        <i className="ph-bold ph-trash"></i>
                      </button>
                    </div>
                  ))}
                  <button onClick={() => addEvent('school')} className="w-full py-2.5 text-sm text-accent font-bold border-2 border-dashed border-accent/30 rounded-2xl hover:bg-accent/5 transition-colors flex items-center justify-center gap-1">
                    <i className="ph-bold ph-plus"></i> 新增事務
                  </button>
                </div>
              </section>

              <section>
                <h2 className="text-lg font-bold mb-3 flex items-center gap-2 text-darkText">
                  <i className="ph-fill ph-student text-accent text-2xl"></i> 學生事件
                </h2>
                <div className="space-y-3">
                  {studentEvents.map((evt) => (
                    <div key={evt.id} className="bg-paper p-2 pl-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col focus-within:border-accent/50 transition-colors">
                      <div className="flex flex-wrap lg:flex-nowrap gap-2 items-center w-full">
                        <input type="text" placeholder="紀錄學生狀況..." value={evt.text} onChange={(e) => updateEvent('student', evt.id, 'text', e.target.value)}
                               className="flex-1 w-full lg:w-auto bg-transparent py-1 text-sm outline-none text-darkText min-w-0" />
                        <div className="flex bg-gray-100 rounded-xl p-1 flex-shrink-0 ml-auto">
                          {['已處理', '需轉介'].map(status => (
                            <button key={status}
                              className={`px-2 py-1.5 text-xs rounded-lg font-bold transition-all ${evt.status === status ? (status==='需轉介'?'bg-danger text-white shadow-sm':'bg-accent text-white shadow-sm') : 'text-gray-500 hover:text-gray-700'}`}
                              onClick={() => updateEvent('student', evt.id, 'status', status)}>
                              {status}
                            </button>
                          ))}
                        </div>
                        <button onClick={() => removeEvent('student', evt.id)} className="p-2 text-gray-300 hover:text-danger bg-gray-50 rounded-xl transition-colors flex-shrink-0">
                          <i className="ph-bold ph-trash"></i>
                        </button>
                      </div>
                      
                      {/* 新增：學生事件的常用片語快選 */}
                      <div className="flex flex-wrap gap-1.5 mt-2 pt-2 border-t border-gray-50">
                         {quickPhrases.student.map(phrase => (
                            <button key={phrase} 
                                    onClick={() => updateEvent('student', evt.id, 'text', evt.text ? `${evt.text}, ${phrase}` : phrase)}
                                    className="text-[10px] bg-gray-50 text-gray-500 px-2.5 py-1 rounded-lg hover:bg-accent/10 hover:text-accent transition-colors border border-gray-100">
                               +{phrase}
                            </button>
                         ))}
                      </div>
                    </div>
                  ))}
                  <button onClick={() => addEvent('student')} className="w-full py-2.5 text-sm text-accent font-bold border-2 border-dashed border-accent/30 rounded-2xl hover:bg-accent/5 transition-colors flex items-center justify-center gap-1">
                    <i className="ph-bold ph-plus"></i> 新增學生事件
                  </button>
                </div>
              </section>

              <section>
                <h2 className="text-lg font-bold mb-3 flex items-center gap-2 text-darkText">
                  <i className="ph-fill ph-phone-call text-accent text-2xl"></i> 家長聯繫
                </h2>
                <div className="space-y-3">
                  {parentContacts.map((evt) => (
                    <div key={evt.id} className="bg-paper p-2 pl-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col focus-within:border-accent/50 transition-colors">
                      <div className="flex flex-wrap lg:flex-nowrap gap-2 items-center w-full">
                        <input type="text" placeholder="聯繫內容..." value={evt.text} onChange={(e) => updateEvent('parent', evt.id, 'text', e.target.value)}
                               className="flex-1 w-full lg:w-auto bg-transparent py-1 text-sm outline-none text-darkText min-w-0" />
                        <div className="flex bg-gray-100 rounded-xl p-1 flex-shrink-0 ml-auto">
                          {['已處理', '需轉達'].map(status => (
                            <button key={status}
                              className={`px-2 py-1.5 text-xs rounded-lg font-bold transition-all ${evt.status === status ? 'bg-accent text-white shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                              onClick={() => updateEvent('parent', evt.id, 'status', status)}>
                              {status}
                            </button>
                          ))}
                        </div>
                        <button onClick={() => removeEvent('parent', evt.id)} className="p-2 text-gray-300 hover:text-danger bg-gray-50 rounded-xl transition-colors flex-shrink-0">
                          <i className="ph-bold ph-trash"></i>
                        </button>
                      </div>
                      
                      {/* 新增：家長聯繫的常用片語快選 */}
                      <div className="flex flex-wrap gap-1.5 mt-2 pt-2 border-t border-gray-50">
                         {quickPhrases.parent.map(phrase => (
                            <button key={phrase} 
                                    onClick={() => updateEvent('parent', evt.id, 'text', evt.text ? `${evt.text}, ${phrase}` : phrase)}
                                    className="text-[10px] bg-gray-50 text-gray-500 px-2.5 py-1 rounded-lg hover:bg-accent/10 hover:text-accent transition-colors border border-gray-100">
                               +{phrase}
                            </button>
                         ))}
                      </div>
                    </div>
                  ))}
                  <button onClick={() => addEvent('parent')} className="w-full py-2.5 text-sm text-accent font-bold border-2 border-dashed border-accent/30 rounded-2xl hover:bg-accent/5 transition-colors flex items-center justify-center gap-1">
                    <i className="ph-bold ph-plus"></i> 新增家長聯繫
                  </button>
                </div>
              </section>

              <section>
                <h2 className="text-lg font-bold mb-3 flex items-center gap-2 text-darkText">
                  <i className="ph-fill ph-note-pencil text-accent text-2xl"></i> 其他記事
                </h2>
                <textarea placeholder="隨手記下重要的事、交辦事項..." value={notes} onChange={(e) => setNotes(e.target.value)} rows="4"
                          className="w-full bg-paper rounded-2xl p-4 shadow-sm border border-gray-100 text-sm focus:ring-2 focus:ring-accent/50 outline-none resize-none text-darkText"></textarea>
              </section>
            </div>
          </div>

          {/* 底部懸浮儲存按鈕 */}
          <div className="fixed bottom-0 left-0 right-0 p-4 pb-6 bg-gradient-to-t from-[#F7F5F2] via-[#F7F5F2]/90 to-transparent flex justify-center z-20 pointer-events-none">
            <button onClick={handleSave} disabled={isSaving}
                    className={`pointer-events-auto w-full max-w-sm py-4 rounded-2xl shadow-xl font-bold text-lg flex items-center justify-center gap-2 transition-transform duration-200 ${isSaving ? 'bg-gray-400 text-gray-200 cursor-not-allowed' : 'bg-darkText text-white hover:bg-gray-900 active:scale-95'}`}>
              {isSaving ? <i className="ph-bold ph-spinner animate-spin text-xl"></i> : <i className="ph-bold ph-paper-plane-tilt text-xl"></i>}
              {isSaving ? '儲存中...' : '儲存今日日誌'}
            </button>
          </div>
        </div>
      );

      // ==========================================
      // RENDER: 期初課表設定畫面
      // ==========================================
      const renderSettingsView = () => (
        <div className="px-4 lg:px-8 py-6 max-w-3xl mx-auto">
          <div className="bg-paper p-6 rounded-3xl shadow-sm border border-gray-100">
            <h2 className="text-2xl font-bold mb-2 flex items-center gap-2 text-darkText">
              <i className="ph-fill ph-gear text-accent"></i> 期初課表設定
            </h2>
            <p className="text-sm text-gray-500 mb-6">設定每週的固定課表，系統會根據您選擇的日期自動帶入當天科目。</p>

            <div className="space-y-8">
              {[1, 2, 3, 4, 5].map(day => (
                <div key={day} className="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                  <h3 className="font-bold text-lg mb-3 text-darkText">星期 {['一', '二', '三', '四', '五'][day-1]}</h3>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                    {[0, 1, 2, 3, 4, 5, 6].map(periodIndex => (
                      <div key={periodIndex} className="flex flex-col gap-1">
                        <label className="text-xs font-medium text-gray-500">第 {periodIndex + 1} 節</label>
                        <input type="text" 
                               value={weekSettings[day][periodIndex]} 
                               onChange={(e) => {
                                 const newSettings = {...weekSettings};
                                 newSettings[day][periodIndex] = e.target.value;
                                 setWeekSettings(newSettings);
                               }}
                               className="bg-white border border-gray-200 rounded-xl p-2 text-sm focus:ring-2 focus:ring-accent outline-none"
                               placeholder="科目" />
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            <button onClick={saveSettingsToLocal}
                    className="mt-8 w-full py-4 bg-accent text-white rounded-2xl font-bold text-lg shadow-md hover:bg-accent/90 active:scale-95 transition-all flex items-center justify-center gap-2">
              <i className="ph-bold ph-floppy-disk"></i> 儲存設定至瀏覽器
            </button>
          </div>
        </div>
      );

      // ==========================================
      // RENDER: 匯出與列印預覽畫面 (模擬紙本表格)
      // ==========================================
      const renderExportView = () => (
        <div className="px-4 py-6 max-w-5xl mx-auto">
          {/* 列印控制列 (列印時隱藏) */}
          <div className="mb-6 flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm print:hidden gap-4">
            <p className="text-sm text-gray-500 font-medium">請確認日誌內容無誤，點擊右方按鈕即可匯出 PDF 檔案。</p>
            <button onClick={handlePrint} className="w-full sm:w-auto px-6 py-3 bg-darkText text-white rounded-xl font-bold shadow-md hover:bg-gray-800 flex items-center justify-center gap-2">
              <i className="ph-bold ph-printer"></i> 列印 / 匯出 PDF
            </button>
          </div>

          {/* A4 模擬畫布 (列印時這區塊將滿版呈現) */}
          <div className="bg-white p-8 sm:p-12 shadow-md mx-auto rounded-none sm:rounded-xl text-black" style={{ minHeight: '297mm', maxWidth: '210mm' }}>
            <h1 className="text-2xl sm:text-3xl font-bold text-center mb-8 tracking-widest border-b-2 border-black pb-4">
              115學年度 第一學期 教師工作日誌
            </h1>
            
            <div className="flex justify-between items-end mb-4 font-bold text-lg">
              <div>第 <span className="underline px-2">{week}</span> 週</div>
              <div>{date.split('-')[0]} 年 <span className="underline px-2">{date.split('-')[1]}</span> 月 <span className="underline px-2">{date.split('-')[2]}</span> 日 【 {getDayString(date)} 】</div>
              <div>請假學生：<span className="underline px-4">{absentees || '無'}</span></div>
            </div>

            {/* 核心大表格 */}
            <table className="w-full border-collapse border-2 border-black mb-6 text-sm">
              <thead>
                <tr>
                  <th className="border-2 border-black p-2 w-12 text-center">節次</th>
                  <th className="border-2 border-black p-2 w-1/4">科目 (預定內容)</th>
                  <th className="border-2 border-black p-2 w-1/4">教學實際進度</th>
                  <th className="border-2 border-black p-2 w-1/4">作業批閱</th>
                  <th className="border-2 border-black p-2 w-16 text-center">數量</th>
                </tr>
              </thead>
              <tbody>
                {schedule.map((item, index) => (
                  <tr key={item.id} className={index === 4 ? "border-t-[3px] border-black" : ""}>
                    <td className="border border-black p-2 text-center font-bold text-lg">{item.period}</td>
                    <td className="border border-black p-2">{item.subject}</td>
                    <td className="border border-black p-2 relative">
                      <div className="mb-4">{item.content}</div>
                      <div className="flex gap-3 text-xs absolute bottom-1 right-2">
                        <span>{item.status === '完成' ? '☑' : '☐'}完成</span>
                        <span>{item.status === '超前' ? '☑' : '☐'}超前</span>
                        <span>{item.status === '待補課' ? '☑' : '☐'}待補課</span>
                      </div>
                    </td>
                    {/* 作業欄位合併處理 (前5節對應5項作業) */}
                    {index < 5 ? (
                      <>
                        <td className="border border-black p-2">
                          {homework[index].checked ? '☑' : '☐'} {homework[index].name}
                        </td>
                        <td className="border border-black p-2 text-center">{homework[index].amount}</td>
                      </>
                    ) : index === 5 ? (
                       <td colSpan="2" rowSpan="2" className="border-2 border-black p-2 align-top">
                          <div className="font-bold text-center border-b border-black mb-1 pb-1">學校相關事務</div>
                          {schoolAffairs.filter(s => s.text).map((s, i) => (
                            <div key={i} className="flex justify-between mb-1">
                              <span>{s.text}</span>
                              <span>{s.isOk ? '☑' : '☐'}OK</span>
                            </div>
                          ))}
                       </td>
                    ) : null}
                  </tr>
                ))}
              </tbody>
            </table>

            {/* 下半部事件表格 */}
            <table className="w-full border-collapse border-2 border-black text-sm">
              <tbody>
                <tr>
                  <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 今日聯絡簿</td>
                </tr>
                <tr>
                  <td colSpan="2" className="border-2 border-black p-2 align-top">
                    <div className="grid grid-cols-2 gap-x-4">
                      {contactBook.filter(cb => cb.text.trim()).map((cb, idx) => (
                         <div key={idx} className="mb-1">{idx + 1}. {cb.text}</div>
                      ))}
                    </div>
                  </td>
                </tr>
                <tr>
                  <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 學生事件</td>
                </tr>
                {studentEvents.map((evt, idx) => (
                   <tr key={idx}>
                      <td className="border border-black p-2 h-8 w-3/4">{evt.text}</td>
                      <td className="border border-black p-2 text-center w-1/4">
                         {evt.status === '已處理' ? '☑' : '☐'} 已處理 &nbsp;&nbsp; {evt.status === '需轉介' ? '☑' : '☐'} 需轉介
                      </td>
                   </tr>
                ))}
                <tr>
                  <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 家長聯繫</td>
                </tr>
                {parentContacts.map((evt, idx) => (
                   <tr key={idx}>
                      <td className="border border-black p-2 h-8 w-3/4">{evt.text}</td>
                      <td className="border border-black p-2 text-center w-1/4">
                         {evt.status === '已處理' ? '☑' : '☐'} 已處理 &nbsp;&nbsp; {evt.status === '需轉達' ? '☑' : '☐'} 需轉達
                      </td>
                   </tr>
                ))}
                <tr>
                  <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 其他記事</td>
                </tr>
                <tr>
                  <td colSpan="2" className="border-2 border-black p-4 h-24 align-top whitespace-pre-wrap">
                    {notes}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      );

      return (
        <div className="w-full relative min-h-screen">
          
          {/* 頂部導覽列 Navigation - 列印時隱藏 */}
          <nav className="bg-white shadow-sm sticky top-0 z-50 print:hidden">
            <div className="max-w-5xl mx-auto px-4 flex justify-around sm:justify-start sm:gap-8 overflow-x-auto">
              <button onClick={() => setActiveTab('log')} 
                      className={`whitespace-nowrap py-4 px-2 font-bold border-b-[3px] transition-colors flex items-center gap-2 ${activeTab === 'log' ? 'border-accent text-accent' : 'border-transparent text-gray-400 hover:text-gray-600'}`}>
                <i className="ph-fill ph-pencil-line text-xl"></i> 填寫日誌
              </button>
              <button onClick={() => setActiveTab('settings')} 
                      className={`whitespace-nowrap py-4 px-2 font-bold border-b-[3px] transition-colors flex items-center gap-2 ${activeTab === 'settings' ? 'border-accent text-accent' : 'border-transparent text-gray-400 hover:text-gray-600'}`}>
                <i className="ph-fill ph-gear text-xl"></i> 期初設定
              </button>
              <button onClick={() => setActiveTab('export')} 
                      className={`whitespace-nowrap py-4 px-2 font-bold border-b-[3px] transition-colors flex items-center gap-2 ${activeTab === 'export' ? 'border-accent text-accent' : 'border-transparent text-gray-400 hover:text-gray-600'}`}>
                <i className="ph-fill ph-printer text-xl"></i> 匯出與預覽
              </button>
            </div>
          </nav>

          {/* 主要內容區 */}
          <main className="max-w-5xl mx-auto">
            {activeTab === 'log' && renderLogView()}
            {activeTab === 'settings' && renderSettingsView()}
            {activeTab === 'export' && renderExportView()}
          </main>

          {/* 修改科目 Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[60] p-4 print:hidden">
              <div className="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl">
                <h3 className="text-lg font-bold text-darkText mb-2 flex items-center gap-2">
                  <i className="ph-bold ph-pencil-simple text-accent"></i> 修改科目
                </h3>
                <p className="text-xs text-gray-500 mb-4">如遇調課或代課，請直接修改科目名稱，或在後方加上 (代)。</p>
                
                <input 
                  type="text" 
                  value={tempSubjectName} 
                  onChange={(e) => setTempSubjectName(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && saveSubjectChange()}
                  autoFocus
                  className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-5 text-darkText font-bold focus:ring-2 focus:ring-accent/50 outline-none"
                />
                
                <div className="flex gap-3">
                  <button onClick={() => setIsModalOpen(false)} className="flex-1 py-3 bg-gray-100 text-gray-600 font-bold rounded-xl active:bg-gray-200 transition-colors">取消</button>
                  <button onClick={saveSubjectChange} className="flex-1 py-3 bg-accent text-white font-bold rounded-xl active:bg-accent/80 transition-colors">確定</button>
                </div>
              </div>
            </div>
          )}

          {/* Toast 提示 */}
          {showToast && (
            <div className="fixed top-[50%] left-[50%] transform -translate-x-[50%] -translate-y-[50%] bg-darkText/90 backdrop-blur-md text-white px-8 py-5 rounded-3xl shadow-2xl flex flex-col items-center gap-3 z-[60] animate-bounce print:hidden">
              <div className="w-12 h-12 bg-green-400 rounded-full flex items-center justify-center mb-1">
                 <i className="ph-bold ph-check text-2xl text-darkText"></i>
              </div>
              <span className="font-bold text-lg">操作成功！</span>
            </div>
          )}
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
