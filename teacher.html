<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>導師日誌</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- 引入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 隱藏滾動條，維持美觀 */
    ::-webkit-scrollbar { display: none; }
    body { 
      -ms-overflow-style: none; 
      scrollbar-width: none; 
      font-family: 'system-ui', -apple-system, sans-serif;
      background-color: #F7F5F2;
    }
    
    .tap-highlight-transparent {
      -webkit-tap-highlight-color: transparent;
    }

    /* 列印專屬樣式 (匯出 PDF 時確保 A4 滿版與黑白清晰) */
    @media print {
      body { background-color: #FFFFFF !important; }
      @page { size: A4; margin: 15mm; }
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6B7280',
            accent: '#8B9A96',
            paper: '#FFFFFF',
            danger: '#E5989B',
            highlight: '#E2E8F0',
            darkText: '#374151'
          }
        }
      }
    }
  </script>
</head>
<body class="text-gray-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 預設空課表與設定 ---
    const emptySchedule = [
      { id: 1, period: 1, subject: '', content: '', status: '完成', isActive: true },
      { id: 2, period: 2, subject: '', content: '', status: '完成', isActive: true },
      { id: 3, period: 3, subject: '', content: '', status: '完成', isActive: true },
      { id: 4, period: 4, subject: '', content: '', status: '完成', isActive: true },
      { id: 5, period: 5, subject: '', content: '', status: '完成', isActive: true },
      { id: 6, period: 6, subject: '', content: '', status: '完成', isActive: true },
      { id: 7, period: 7, subject: '', content: '', status: '完成', isActive: true },
    ];

    // 預設的期初課表格式 (進階版：支援設定是否為本人任教 active)
    const defaultWeekSchedule = {
      1: [{subject: '國語', active: true}, {subject: '數學', active: true}, {subject: '英文', active: false}, {subject: '自然', active: false}, {subject: '社會', active: false}, {subject: '綜合', active: true}, {subject: '健體', active: false}],
      2: [{subject: '數學', active: true}, {subject: '國語', active: true}, {subject: '健體', active: false}, {subject: '綜合', active: true}, {subject: '社會', active: false}, {subject: '自然', active: false}, {subject: '英文', active: false}],
      3: [{subject: '國語', active: true}, {subject: '數學', active: true}, {subject: '美勞', active: false}, {subject: '美勞', active: false}, {subject: '綜合', active: true}, {subject: '空白', active: false}, {subject: '空白', active: false}],
      4: [{subject: '自然', active: false}, {subject: '社會', active: false}, {subject: '數學', active: true}, {subject: '國語', active: true}, {subject: '英文', active: false}, {subject: '電腦', active: false}, {subject: '音樂', active: false}],
      5: [{subject: '國語', active: true}, {subject: '數學', active: true}, {subject: '英文', active: false}, {subject: '綜合', active: true}, {subject: '健體', active: false}, {subject: '班會', active: true}, {subject: '社團', active: false}],
    };

    const initialHomework = [
      { id: 1, name: '聯絡本', checked: false, amount: '' },
      { id: 2, name: '生字', checked: false, amount: '' },
      { id: 3, name: '圈詞', checked: false, amount: '' },
      { id: 4, name: '國單', checked: false, amount: '' },
      { id: 5, name: '數單', checked: false, amount: '' },
    ];

    function App() {
      // --- 視圖狀態 ---
      const [activeTab, setActiveTab] = useState('log'); // 'log' | 'settings' | 'export'

      // --- 表單狀態 ---
      const [date, setDate] = useState('');
      const [week, setWeek] = useState(1);
      const [absentees, setAbsentees] = useState('');
      const [schedule, setSchedule] = useState(emptySchedule);
      const [homework, setHomework] = useState(initialHomework);
      const [contactBook, setContactBook] = useState([{ id: Date.now(), text: '' }]); // 新增聯絡簿狀態
      const [schoolAffairs, setSchoolAffairs] = useState([{ id: Date.now(), text: '', isOk: false }]);
      const [studentEvents, setStudentEvents] = useState([{ id: Date.now()+1, text: '', status: '已處理' }]);
      const [parentContacts, setParentContacts] = useState([{ id: Date.now()+2, text: '', status: '已處理' }]);
      const [notes, setNotes] = useState('');
      
      // --- UI 與設定狀態 ---
      const [showToast, setShowToast] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingPeriodId, setEditingPeriodId] = useState(null);
      const [tempSubjectName, setTempSubjectName] = useState('');
      
      // 新增：自動儲存時間狀態 (Auto-Save 救星)
      const [autoSaveTime, setAutoSaveTime] = useState('');
      
      // 儲存期初課表的 State
      const [weekSettings, setWeekSettings] = useState(defaultWeekSchedule);

      // --- 初始化與 localStorage 讀取 ---
      useEffect(() => {
        // 從 LocalStorage 讀取期初課表設定
        const savedSettings = localStorage.getItem('homeroom_schedule_settings');
        if (savedSettings) {
          try {
            const parsed = JSON.parse(savedSettings);
            // 自動升級舊版設定資料：如果第一天第一節是字串，代表是舊版，幫他升級成新物件格式
            if (typeof parsed[1][0] === 'string') {
              const migrated = {};
              [1, 2, 3, 4, 5].forEach(d => {
                migrated[d] = parsed[d].map(subj => ({ subject: subj, active: true }));
              });
              setWeekSettings(migrated);
            } else {
              setWeekSettings(parsed);
            }
          } catch (e) {
            console.error("設定檔讀取失敗:", e);
          }
        }

        // 設定初始日期為今天
        const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        setDate(`${yyyy}-${mm}-${dd}`);
        setWeek(5); 
      }, []);

      // --- 當日期改變時，自動套用該星期的課表 ---
      useEffect(() => {
        if (!date) return;
        
        // 嘗試讀取當天的歷史紀錄
        const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
        if (savedLogs[date]) {
          const log = savedLogs[date];
          setWeek(log.week || 1);
          setAbsentees(log.absentees || '');
          setSchedule(log.schedule || emptySchedule);
          setHomework(log.homework || initialHomework);
          setContactBook(log.contactBook || [{ id: Date.now(), text: '' }]);
          setSchoolAffairs(log.schoolAffairs || [{ id: Date.now(), text: '', isOk: false }]);
          setStudentEvents(log.studentEvents || [{ id: Date.now()+1, text: '', status: '已處理' }]);
          setParentContacts(log.parentContacts || [{ id: Date.now()+2, text: '', status: '已處理' }]);
          setNotes(log.notes || '');
          return;
        }

        // 若當天無紀錄，套用期初設定課表
        const d = new Date(date);
        const dayOfWeek = d.getDay(); // 0(日) ~ 6(六)
        
        if (dayOfWeek >= 1 && dayOfWeek <= 5) {
          const todaysSubjects = weekSettings[dayOfWeek];
          setSchedule(emptySchedule.map((item, index) => ({
            ...item,
            subject: todaysSubjects[index]?.subject || '',
            isActive: todaysSubjects[index]?.active ?? true
          })));
        } else {
          setSchedule(emptySchedule.map(item => ({ ...item, subject: '', isActive: false })));
        }

        // 神奇功能：尋找最近一天的歷史紀錄，將其「聯絡簿」自動轉為今天的「作業批閱」
        // 為了讓「週一」優先抓「上週五」的作業，我們先計算前一個工作日
        let targetPrevDate = new Date(d);
        if (dayOfWeek === 1) { // 星期一
          targetPrevDate.setDate(targetPrevDate.getDate() - 3); 
        } else if (dayOfWeek === 0) { // 星期日
          targetPrevDate.setDate(targetPrevDate.getDate() - 2);
        } else {
          targetPrevDate.setDate(targetPrevDate.getDate() - 1);
        }
        
        const yyyyPrev = targetPrevDate.getFullYear();
        const mmPrev = String(targetPrevDate.getMonth() + 1).padStart(2, '0');
        const ddPrev = String(targetPrevDate.getDate()).padStart(2, '0');
        const prevWorkingDateStr = `${yyyyPrev}-${mmPrev}-${ddPrev}`;
        
        // 1. 優先找前一個工作日
        let foundHomework = false;
        if (savedLogs[prevWorkingDateStr] && savedLogs[prevWorkingDateStr].contactBook) {
            const cbData = savedLogs[prevWorkingDateStr].contactBook.filter(cb => cb.text.trim() !== '');
            if (cbData.length > 0) {
               setHomework(cbData.map((cb, idx) => ({ id: idx + 1, name: cb.text, checked: false, amount: '' })));
               foundHomework = true;
            }
        }
        
        // 2. 如果前一個工作日沒紀錄（可能放假），則往前回溯找最近有寫聯絡簿的一天
        if (!foundHomework) {
            const prevDates = Object.keys(savedLogs).sort().filter(dateKey => dateKey < date);
            let fallbackFound = false;
            for (let i = prevDates.length - 1; i >= 0; i--) {
                const lastLog = savedLogs[prevDates[i]];
                if (lastLog.contactBook) {
                    const cbData = lastLog.contactBook.filter(cb => cb.text.trim() !== '');
                    if (cbData.length > 0) {
                        setHomework(cbData.map((cb, idx) => ({ id: idx + 1, name: cb.text, checked: false, amount: '' })));
                        fallbackFound = true;
                        break;
                    }
                }
            }
            if (!fallbackFound) {
                setHomework(initialHomework);
            }
        }
        
        // 清空其他今日新填項
        setAbsentees('');
        setContactBook([{ id: Date.now(), text: '' }]);
        setSchoolAffairs([{ id: Date.now(), text: '', isOk: false }]);
        setStudentEvents([{ id: Date.now()+1, text: '', status: '已處理' }]);
        setParentContacts([{ id: Date.now()+2, text: '', status: '已處理' }]);
        setNotes('');
        
      }, [date, weekSettings]); // 當日期或設定改變時觸發

      // --- 新增：斷線自動存檔 (Auto-Save 救星) ---
      useEffect(() => {
        if (!date) return;
        
        // 延遲 1.5 秒執行儲存，避免每打一個字就寫入一次造成卡頓
        const timer = setTimeout(() => {
          const logData = { date, week, absentees, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes };
          const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
          
          savedLogs[date] = logData;
          localStorage.setItem('homeroom_logs', JSON.stringify(savedLogs));
          
          // 更新 UI 顯示的儲存時間
          const now = new Date();
          setAutoSaveTime(now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }));
        }, 1500);

        return () => clearTimeout(timer); // 重新計時 (Debounce 技術)
      }, [date, week, absentees, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes]);

      // --- 資料更新處理函數 ---
      const updateSchedule = (id, field, value) => {
        setSchedule(schedule.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const updateHomework = (id, field, value) => {
        setHomework(homework.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const updateEvent = (type, id, field, value) => {
        if (type === 'student') setStudentEvents(studentEvents.map(item => item.id === id ? { ...item, [field]: value } : item));
        if (type === 'parent') setParentContacts(parentContacts.map(item => item.id === id ? { ...item, [field]: value } : item));
        if (type === 'school') setSchoolAffairs(schoolAffairs.map(item => item.id === id ? { ...item, [field]: value } : item));
        if (type === 'contact') setContactBook(contactBook.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const addEvent = (type) => {
        const newEvent = { id: Date.now(), text: '', status: '已處理' };
        if (type === 'student') setStudentEvents([...studentEvents, newEvent]);
        if (type === 'parent') setParentContacts([...parentContacts, newEvent]);
        if (type === 'school') setSchoolAffairs([...schoolAffairs, { id: Date.now(), text: '', isOk: false }]);
        if (type === 'contact') setContactBook([...contactBook, { id: Date.now(), text: '' }]);
      };

      const removeEvent = (type, id) => {
        if (type === 'student') setStudentEvents(studentEvents.filter(e => e.id !== id));
        if (type === 'parent') setParentContacts(parentContacts.filter(e => e.id !== id));
        if (type === 'school') setSchoolAffairs(schoolAffairs.filter(e => e.id !== id));
        if (type === 'contact') setContactBook(contactBook.filter(e => e.id !== id));
      };

      // --- Modal 處理 ---
      const openSubjectModal = (item) => {
        setEditingPeriodId(item.id);
        setTempSubjectName(item.subject);
        setIsModalOpen(true);
      };

      const saveSubjectChange = () => {
        if (editingPeriodId !== null) {
          updateSchedule(editingPeriodId, 'subject', tempSubjectName);
        }
        setIsModalOpen(false);
      };

      // --- 儲存與列印 ---
      const handleSave = () => {
        if (isSaving) return;
        setIsSaving(true);
        const logData = { date, week, absentees, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes };
        
        // 儲存到 LocalStorage 以利跨日自動讀取聯絡簿
        const savedLogs = JSON.parse(localStorage.getItem('homeroom_logs') || '{}');
        savedLogs[date] = logData;
        localStorage.setItem('homeroom_logs', JSON.stringify(savedLogs));
        
        console.log("準備送出至資料庫 Data: ", logData);
        
        setTimeout(() => {
          setIsSaving(false);
          setShowToast(true);
          setTimeout(() => setShowToast(false), 3000);
        }, 1000);
      };

      const handlePrint = () => {
        window.print();
      };

      const saveSettingsToLocal = () => {
        localStorage.setItem('homeroom_schedule_settings', JSON.stringify(weekSettings));
        setShowToast(true);
        setTimeout(() => setShowToast(false), 2000);
      };

      // 計算星期幾字串
      const getDayString = (dateStr) => {
        if (!dateStr) return '';
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        return days[new Date(dateStr).getDay()];
      };

      // 判斷當前日期的屬性，用於顯示提示文字
      const currentDayOfWeek = date ? new Date(date).getDay() : new Date().getDay();
      const homeworkSubTitle = currentDayOfWeek === 1 ? '上週五指派' : '昨日指派';
      const contactBookPlaceholder = currentDayOfWeek === 5 ? '輸入作業內容 (自動帶入下週一批閱)...' : '輸入作業內容 (自動帶入明天批閱)...';

      // --- 新增：常用片語清單 (Quick Phrases) ---
      const quickPhrases = {
        student: ['作業缺交', '上課分心', '常規不佳', '遲到', '身體不適', '與同學衝突'],
        parent: ['作業提醒', '近期表現佳', '電訪:行為宣導', '電訪:身體狀況', '傳達班級事務']
      };

      // 新增：區塊收合狀態管理 (Accordion)
      const [expandedSections, setExpandedSections] = useState({
        schedule: true, contact: true, homework: true, school: true, student: true, parent: true, notes: true
      });

      const toggleSection = (section) => {
        setExpandedSections(prev => ({ ...prev, [section]: !prev[section] }));
      };

      const toggleAllSections = (expand) => {
        const newState = Object.keys(expandedSections).reduce((acc, key) => ({ ...acc, [key]: expand }), {});
        setExpandedSections(newState);
      };

      // --- 新增：設定頁面專用控制函數 ---
      const updateSettingSubject = (day, periodIdx, value) => {
        const newSettings = { ...weekSettings };
        newSettings[day][periodIdx].subject = value;
        setWeekSettings(newSettings);
      };

      const toggleSettingActive = (day, periodIdx) => {
        const newSettings = { ...weekSettings };
        newSettings[day][periodIdx].active = !newSettings[day][periodIdx].active;
        setWeekSettings(newSettings);
      };

      // ==========================================
      // RENDER: 匯出與列印預覽畫面 (支援單頁/多頁列印)
      // ==========================================
      const renderExportView = () => {
        // 判斷要渲染一頁還是五頁
        const pagesToRender = exportMode === 'weekly' 
           ? getWeekDates(date).map(d => getLogForDate(d))
           : [{ date, week, absentees, schedule, homework, contactBook, schoolAffairs, studentEvents, parentContacts, notes, isHoliday }];

        return (
          <div className="px-4 py-6 max-w-5xl mx-auto">
            {/* 列印控制列 (列印時隱藏) */}
            <div className="mb-6 flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm print:hidden gap-4 sticky top-16 z-10">
              <div className="flex gap-2 w-full sm:w-auto bg-gray-100 p-1.5 rounded-xl">
                <button onClick={() => setExportMode('daily')} className={`flex-1 sm:flex-none px-4 py-2 rounded-lg font-bold text-sm transition-all ${exportMode === 'daily' ? 'bg-white text-accent shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>單日預覽</button>
                <button onClick={() => setExportMode('weekly')} className={`flex-1 sm:flex-none px-4 py-2 rounded-lg font-bold text-sm transition-all ${exportMode === 'weekly' ? 'bg-white text-accent shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>一週預覽 (一~五)</button>
              </div>
              <button onClick={handlePrint} className="w-full sm:w-auto px-6 py-3 bg-darkText text-white rounded-xl font-bold shadow-md hover:bg-gray-800 flex items-center justify-center gap-2 transition-transform active:scale-95">
                <i className="ph-bold ph-printer"></i> {exportMode === 'weekly' ? '匯出整週 PDF (共 5 頁)' : '匯出單日 PDF'}
              </button>
            </div>

            {/* A4 模擬畫布容器 (支援多頁) */}
            <div className="flex flex-col gap-8 print:gap-0">
              {pagesToRender.map((pageData, pageIdx) => (
                <div key={pageData.date} 
                     className="bg-white p-8 sm:p-12 shadow-md mx-auto rounded-none sm:rounded-xl text-black relative" 
                     style={{ minHeight: '297mm', maxWidth: '210mm', width: '100%', pageBreakAfter: pageIdx !== pagesToRender.length - 1 ? 'always' : 'auto' }}>
                  
                  <h1 className="text-2xl sm:text-3xl font-bold text-center mb-8 tracking-widest border-b-2 border-black pb-4">
                    115學年度 第一學期 教師工作日誌
                  </h1>
                  
                  <div className="flex justify-between items-end mb-4 font-bold text-lg">
                    <div>第 <span className="underline px-2">{pageData.week}</span> 週</div>
                    <div>{pageData.date.split('-')[0]} 年 <span className="underline px-2">{pageData.date.split('-')[1]}</span> 月 <span className="underline px-2">{pageData.date.split('-')[2]}</span> 日 【 {getDayString(pageData.date)} 】</div>
                    <div>請假學生：<span className="underline px-4">{pageData.absentees || '無'}</span></div>
                  </div>

                  {pageData.isHoliday ? (
                     <div className="border-2 border-black flex flex-col items-center justify-center text-gray-400" style={{ height: '220mm' }}>
                         <i className="ph-fill ph-calendar-x text-7xl mb-4 text-gray-300"></i>
                         <h2 className="text-3xl font-bold tracking-widest text-gray-400">（ 本 日 放 假 / 停 課 ）</h2>
                     </div>
                  ) : (
                     <>
                        {/* 核心大表格 */}
                        <table className="w-full border-collapse border-2 border-black mb-6 text-sm">
                          <thead>
                            <tr>
                              <th className="border-2 border-black p-2 w-12 text-center">節次</th>
                              <th className="border-2 border-black p-2 w-[22%]">科目 (預定內容)</th>
                              <th className="border-2 border-black p-2 w-[28%]">教學實際進度</th>
                              <th className="border-2 border-black p-2 w-[28%]">作業批閱</th>
                              <th className="border-2 border-black p-2 w-16 text-center">數量</th>
                            </tr>
                          </thead>
                          <tbody>
                            {pageData.schedule.map((item, index) => (
                              <tr key={item.id} className={index === 4 ? "border-t-[3px] border-black" : ""}>
                                <td className="border border-black p-2 text-center font-bold text-lg">{item.period}</td>
                                
                                {item.isActive !== false ? (
                                  <>
                                    <td className="border border-black p-2">{item.subject}</td>
                                    <td className="border border-black p-2 relative h-16">
                                      <div className="mb-4 pr-10">{item.content}</div>
                                      <div className="flex gap-2 text-[10px] absolute bottom-1 right-1 opacity-80">
                                        <span>{item.status === '完成' ? '☑' : '☐'}完成</span>
                                        <span>{item.status === '超前' ? '☑' : '☐'}超前</span>
                                        <span>{item.status === '待補課' ? '☑' : '☐'}待補課</span>
                                      </div>
                                    </td>
                                  </>
                                ) : (
                                  <td className="border border-black p-2 text-center text-gray-400 bg-gray-50" colSpan="2">
                                     <span className="opacity-50 tracking-widest text-xs">（ 非 任 教 節 次 ）</span>
                                  </td>
                                )}

                                {index < 5 ? (
                                  <>
                                    <td className="border border-black p-2">
                                      {pageData.homework[index]?.checked ? '☑' : '☐'} {pageData.homework[index]?.name}
                                    </td>
                                    <td className="border border-black p-2 text-center">{pageData.homework[index]?.amount}</td>
                                  </>
                                ) : index === 5 ? (
                                   <td colSpan="2" rowSpan="2" className="border-2 border-black p-2 align-top">
                                      <div className="font-bold text-center border-b border-black mb-1 pb-1">學校相關事務</div>
                                      {(pageData.schoolAffairs || []).filter(s => s.text).map((s, i) => (
                                        <div key={i} className="flex justify-between mb-1 text-xs">
                                          <span>{s.text}</span>
                                          <span>{s.isOk ? '☑' : '☐'}OK</span>
                                        </div>
                                      ))}
                                   </td>
                                ) : null}
                              </tr>
                            ))}
                          </tbody>
                        </table>

                        {/* 下半部事件表格 */}
                        <table className="w-full border-collapse border-2 border-black text-sm">
                          <tbody>
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 今日聯絡簿</td>
                            </tr>
                            <tr>
                              <td colSpan="2" className="border-2 border-black p-2 align-top h-16">
                                <div className="grid grid-cols-2 gap-x-4 text-xs">
                                  {(pageData.contactBook || []).filter(cb => cb.text.trim()).map((cb, idx) => (
                                     <div key={idx} className="mb-1">{idx + 1}. {cb.text}</div>
                                  ))}
                                </div>
                              </td>
                            </tr>
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 學生事件</td>
                            </tr>
                            {(pageData.studentEvents || []).length > 0 ? (pageData.studentEvents || []).map((evt, idx) => (
                               <tr key={idx}>
                                  <td className="border border-black p-2 h-8 w-3/4 text-xs">{evt.text}</td>
                                  <td className="border border-black p-2 text-center w-1/4 text-xs">
                                     {evt.status === '已處理' ? '☑' : '☐'} 已處理 &nbsp;&nbsp; {evt.status === '需轉介' ? '☑' : '☐'} 需轉介
                                  </td>
                               </tr>
                            )) : (
                               <tr><td className="border border-black p-2 h-8 text-gray-300 text-xs" colSpan="2">無紀錄</td></tr>
                            )}
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 家長聯繫</td>
                            </tr>
                            {(pageData.parentContacts || []).length > 0 ? (pageData.parentContacts || []).map((evt, idx) => (
                               <tr key={idx}>
                                  <td className="border border-black p-2 h-8 w-3/4 text-xs">{evt.text}</td>
                                  <td className="border border-black p-2 text-center w-1/4 text-xs">
                                     {evt.status === '已處理' ? '☑' : '☐'} 已處理 &nbsp;&nbsp; {evt.status === '需轉達' ? '☑' : '☐'} 需轉達
                                  </td>
                               </tr>
                            )) : (
                               <tr><td className="border border-black p-2 h-8 text-gray-300 text-xs" colSpan="2">無紀錄</td></tr>
                            )}
                            <tr>
                              <td className="border-2 border-black p-2 font-bold bg-gray-100" colSpan="2">* 其他記事</td>
                            </tr>
                            <tr>
                              <td colSpan="2" className="border-2 border-black p-2 h-20 align-top whitespace-pre-wrap text-xs">
                                {pageData.notes}
                              </td>
                            </tr>
                          </tbody>
                        </table>
                     </>
                  )}
                </div>
              ))}
            </div>
          </div>
        );
      };

      return (
        <div className="w-full relative min-h-screen">
          
          {/* 頂部導覽列 Navigation - 漢堡選單版 (列印時隱藏) */}
          <nav className="bg-white shadow-sm sticky top-0 z-50 print:hidden">
            <div className="max-w-5xl mx-auto px-4 flex justify-between items-center h-14">
              {/* 動態顯示當前頁面標題 */}
              <div className="font-bold text-lg flex items-center gap-2 text-darkText">
                 {activeTab === 'log' && <><i className="ph-fill ph-pencil-line text-accent"></i> 填寫日誌</>}
                 {activeTab === 'settings' && <><i className="ph-fill ph-gear text-accent"></i> 期初設定</>}
                 {activeTab === 'export' && <><i className="ph-fill ph-printer text-accent"></i> 匯出與預覽</>}
              </div>
              
              {/* 三條線 (Hamburger) 選單按鈕 */}
              <button 
                onClick={() => setIsMenuOpen(!isMenuOpen)} 
                className="p-2 text-gray-500 hover:text-accent transition-colors focus:outline-none tap-highlight-transparent flex items-center justify-center rounded-xl active:bg-gray-100">
                <i className={`ph-bold ${isMenuOpen ? 'ph-x' : 'ph-list'} text-2xl`}></i>
              </button>
            </div>

            {/* 展開的下拉選單區塊 */}
            <div className={`overflow-hidden transition-all duration-300 ease-in-out ${isMenuOpen ? 'max-h-60 border-t border-gray-100 shadow-inner' : 'max-h-0'}`}>
              <div className="max-w-5xl mx-auto px-4 py-4 flex flex-col gap-2.5 bg-gray-50">
                <button onClick={() => { setActiveTab('log'); setIsMenuOpen(false); }} 
                        className={`text-left px-5 py-3.5 rounded-xl font-bold transition-all flex items-center gap-3 active:scale-[0.98] ${activeTab === 'log' ? 'bg-accent text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100 shadow-sm border border-gray-100'}`}>
                  <i className="ph-fill ph-pencil-line text-xl w-6 text-center"></i> 填寫日誌
                </button>
                <button onClick={() => { setActiveTab('settings'); setIsMenuOpen(false); }} 
                        className={`text-left px-5 py-3.5 rounded-xl font-bold transition-all flex items-center gap-3 active:scale-[0.98] ${activeTab === 'settings' ? 'bg-accent text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100 shadow-sm border border-gray-100'}`}>
                  <i className="ph-fill ph-gear text-xl w-6 text-center"></i> 期初設定 (含 Excel)
                </button>
                <button onClick={() => { setActiveTab('export'); setIsMenuOpen(false); }} 
                        className={`text-left px-5 py-3.5 rounded-xl font-bold transition-all flex items-center gap-3 active:scale-[0.98] ${activeTab === 'export' ? 'bg-accent text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100 shadow-sm border border-gray-100'}`}>
                  <i className="ph-fill ph-printer text-xl w-6 text-center"></i> 匯出與列印預覽
                </button>
              </div>
            </div>
          </nav>

          {/* 主要內容區 */}
          <main className="max-w-5xl mx-auto">
            {activeTab === 'log' && renderLogView()}
            {activeTab === 'settings' && renderSettingsView()}
            {activeTab === 'export' && renderExportView()}
          </main>

          {/* 修改科目 Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[60] p-4 print:hidden">
              <div className="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl">
                <h3 className="text-lg font-bold text-darkText mb-2 flex items-center gap-2">
                  <i className="ph-bold ph-pencil-simple text-accent"></i> 修改科目
                </h3>
                <p className="text-xs text-gray-500 mb-4">如遇調課或代課，請直接修改科目名稱，或在後方加上 (代)。</p>
                
                <input 
                  type="text" 
                  value={tempSubjectName} 
                  onChange={(e) => setTempSubjectName(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && saveSubjectChange()}
                  autoFocus
                  className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-5 text-darkText font-bold focus:ring-2 focus:ring-accent/50 outline-none"
                />
                
                <div className="flex gap-3">
                  <button onClick={() => setIsModalOpen(false)} className="flex-1 py-3 bg-gray-100 text-gray-600 font-bold rounded-xl active:bg-gray-200 transition-colors">取消</button>
                  <button onClick={saveSubjectChange} className="flex-1 py-3 bg-accent text-white font-bold rounded-xl active:bg-accent/80 transition-colors">確定</button>
                </div>
              </div>
            </div>
          )}

          {/* Toast 提示 */}
          {showToast && (
            <div className="fixed top-[50%] left-[50%] transform -translate-x-[50%] -translate-y-[50%] bg-darkText/90 backdrop-blur-md text-white px-8 py-5 rounded-3xl shadow-2xl flex flex-col items-center gap-3 z-[60] animate-bounce print:hidden">
              <div className="w-12 h-12 bg-green-400 rounded-full flex items-center justify-center mb-1">
                 <i className="ph-bold ph-check text-2xl text-darkText"></i>
              </div>
              <span className="font-bold text-lg">操作成功！</span>
            </div>
          )}
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
