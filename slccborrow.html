<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>資訊設備管理系統</title>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-sidebar: #f7f7f5;
            --text-main: #37352f;
            --text-muted: #787774;
            --border-color: #ededeb;
            --accent-color: #ff6b6b; /* 淨春型：明亮溫暖紅 */
            --accent-hover: #ff5252;
            --blue-action: #2383e2; 
            --admin-color: #e6a23c; /* 管理員專屬暖橘色 */
            --touch-size: 44px; /* 平板友善觸控高度 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

        body { display: flex; height: 100vh; background-color: var(--bg-main); color: var(--text-main); overflow: hidden; }

        /* 左側邊欄 */
        .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); padding: 24px 16px; display: flex; flex-direction: column; }
        .logo { font-size: 18px; font-weight: 600; margin-bottom: 32px; padding-left: 8px; display: flex; align-items: center; gap: 8px; }
        
        .nav-item { min-height: var(--touch-size); display: flex; align-items: center; gap: 12px; padding: 0 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; color: var(--text-main); font-size: 16px; transition: background 0.2s; }
        .nav-item:hover { background-color: rgba(0, 0, 0, 0.04); }
        .nav-item.active { background-color: rgba(0, 0, 0, 0.06); font-weight: 500; }
        .admin-btn { margin-top: auto; color: var(--text-muted); font-size: 14px; min-height: var(--touch-size); display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .admin-btn.logged-in { background-color: #fff3e0; color: #d35400; font-weight: 600; border: 1px solid #ffd8a8; }

        /* 右側主要內容區 */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .header h1 { font-size: 32px; font-weight: 700; margin-bottom: 24px; }

        /* 搜尋列 */
        .search-bar { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 250px; min-height: var(--touch-size); padding: 0 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; outline: none; }
        .search-input:focus { border-color: var(--blue-action); }
        .filter-checkbox { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--text-muted); cursor: pointer; min-height: var(--touch-size); }
        .filter-checkbox input { width: 20px; height: 20px; }

        /* 器材卡片網格 */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .card { border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; background: white; display: flex; flex-direction: column; transition: box-shadow 0.2s; }
        .card:hover { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-size: 18px; font-weight: 600; line-height: 1.4; }
        .status-badge { font-size: 13px; padding: 6px 10px; border-radius: 6px; font-weight: 500; }
        .status-avail { background: #e3fcef; color: #18794e; }
        .status-none { background: #ffebe9; color: #bf2419; }
        .card-info { font-size: 15px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.5; }
        
        /* 按鈕區 */
        .card-actions { margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }
        .borrow-btn, .dispose-btn { min-height: var(--touch-size); width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 500; transition: all 0.2s; }
        .borrow-btn { background-color: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); }
        .borrow-btn:hover:not(:disabled) { background-color: var(--blue-action); color: white; border-color: var(--blue-action); }
        .borrow-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .dispose-btn { background-color: #fff5f5; border: 1px solid #ffc9c9; color: var(--accent-hover); display: none; }
        .dispose-btn:hover { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }

        /* 表格樣式 */
        .records-table-container { width: 100%; overflow-x: auto; border: 1px solid var(--border-color); border-radius: 12px; background: white; }
        .records-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 15px; }
        .records-table th, .records-table td { padding: 16px; border-bottom: 1px solid var(--border-color); }
        .records-table th { background-color: var(--bg-sidebar); color: var(--text-muted); font-weight: 500; white-space: nowrap; }
        .records-table tr:hover { background-color: rgba(0,0,0,0.02); }

        /* Modal 共用樣式 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 15, 15, 0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(2px); }
        .modal-content { background: white; width: 100%; max-width: 560px; border-radius: 16px; padding: 32px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 22px; font-weight: 600; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 15px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; min-height: var(--touch-size); padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--blue-action); }
        .form-group input.admin-focus:focus { border-color: var(--admin-color); }
        .form-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 200px; }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; }
        .btn-cancel, .btn-submit, .btn-danger { min-height: var(--touch-size); padding: 0 24px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 500; border: none; }
        .btn-cancel { border: 1px solid var(--border-color); background: white; }
        .btn-submit { background: var(--accent-color); color: white; }
        .btn-submit:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--admin-color); color: white; }
        .btn-danger:hover { background: #d35400; }

        /* Loading Overlay */
        .loader-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; font-size: 18px; font-weight: 500; flex-direction: column; gap: 16px;}
        .bounce-emoji { font-size: 40px; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">🧱 資訊設備管理</div>
        <div class="nav-item active" onclick="filterCategory('全部')"><span>🎮</span> 全部器材</div>
        <div class="nav-item" onclick="filterCategory('學生載具')"><span>📱</span> 學生載具</div>
        <div class="nav-item" onclick="filterCategory('電腦主機')"><span>💻</span> 電腦主機</div>
        <div class="nav-item" onclick="filterCategory('攝影/影音')"><span>📷</span> 攝影/影音</div>
        <div class="nav-item" onclick="filterCategory('網路設備')"><span>📡</span> 網路設備</div>
        
        <div style="height: 1px; background: var(--border-color); margin: 16px 0;"></div>
        <div class="nav-item" id="nav-records" onclick="showRecords()"><span>📋</span> 異動紀錄</div>
        <div class="admin-btn" id="adminBtn" onclick="adminLogin()">🔒 管理員入口</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 id="page-title">全部器材</h1>
        </div>

        <!-- 設備清單視圖 -->
        <div id="view-equipments">
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="搜尋器材名稱、編號... (例如: Surface)" onkeyup="searchItems()">
                <label class="filter-checkbox">
                    <input type="checkbox" id="availFilter" onchange="searchItems()"> 只顯示可借用
                </label>
            </div>
            <div class="grid-container" id="itemGrid"></div>
        </div>

        <!-- 異動紀錄視圖 -->
        <div id="view-records" style="display: none;">
            <div class="records-table-container">
                <table class="records-table">
                    <thead>
                        <tr>
                            <th>狀態</th><th>處理/借用人</th><th>處室/班級</th><th>器材名稱</th><th>借用日</th><th>預計歸還</th><th>事由/備註</th>
                        </tr>
                    </thead>
                    <tbody id="recordsGrid"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 借用表單 Modal -->
    <div class="modal-overlay" id="borrowModal">
        <div class="modal-content">
            <div class="modal-title">🐶 填寫借用登記</div>
            <div class="form-group">
                <label>借用器材</label>
                <input type="text" id="formItemName" readonly style="background: #f7f7f5; color: var(--text-muted);">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>姓名 <span style="color:var(--accent-color)">*</span></label>
                    <input type="text" id="formName" placeholder="如: 王小明">
                </div>
                <div class="form-group">
                    <label>處室 / 班級 <span style="color:var(--accent-color)">*</span></label>
                    <input type="text" id="formUnit" placeholder="如: 教務處 ext.123">
                </div>
            </div>
            <div class="form-group">
                <label>電子信箱 Email <span style="color:var(--accent-color)">*</span></label>
                <input type="email" id="formEmail" placeholder="接收借用成功通知">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>借用日期 <span style="color:var(--accent-color)">*</span></label>
                    <input type="date" id="formStartDate">
                </div>
                <div class="form-group">
                    <label>預計歸還日期 <span style="color:var(--accent-color)">*</span></label>
                    <input type="date" id="formEndDate">
                </div>
            </div>
            <div class="form-group">
                <label>借用事由與設備編號 <span style="color:var(--accent-color)">*</span></label>
                <input type="text" id="formReason" placeholder="如: 課堂使用 (借用編號: 01)">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('borrowModal')">取消</button>
                <button class="btn-submit" onclick="submitBorrow()">確認登記</button>
            </div>
        </div>
    </div>

    <!-- 汰換與數量調整 Modal (管理員專屬) -->
    <div class="modal-overlay" id="disposeModal">
        <div class="modal-content" style="border-top: 6px solid var(--admin-color);">
            <div class="modal-title" style="color: var(--admin-color);">🛠️ 耗材汰換與數量調整</div>
            <div class="form-group">
                <label>調整器材</label>
                <input type="text" id="disposeItemName" readonly style="background: #fff8f0; color: #d35400; font-weight: 500;">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>處理人 (管理員姓名) <span style="color:var(--admin-color)">*</span></label>
                    <input type="text" id="disposeAdminName" class="admin-focus" placeholder="如: 資訊組長">
                </div>
                <div class="form-group">
                    <label>減少數量 <span style="color:var(--admin-color)">*</span></label>
                    <input type="number" id="disposeQty" class="admin-focus" min="1" placeholder="輸入報廢/汰換數量">
                </div>
            </div>
            <div class="form-group">
                <label>汰換原因與備註 <span style="color:var(--admin-color)">*</span></label>
                <input type="text" id="disposeReason" class="admin-focus" placeholder="如: 接頭斷裂報廢、主機板燒毀 (登錄號: 288)">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('disposeModal')">取消</button>
                <button class="btn-danger" onclick="submitDispose()">確認扣除</button>
            </div>
        </div>
    </div>

    <!-- 載入動畫 -->
    <div class="loader-overlay" id="loader">
        <div class="bounce-emoji">🦫</div>
        <div>資料處理中，請稍候...</div>
    </div>

    <script>
        // ⚠️ 請替換為您包含 action_type 邏輯的最新 GAS 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbwuVHBUJg1Zmfg1BWO7MzHGsf4eTD2PzaRD6H8GWHTCexNMBuF_ZSS8eXnjUpEDCknd/exec";

        let allEquipmentData = [];
        let currentCategory = '全部';
        let isAdmin = false; // 管理員狀態旗標

        window.onload = function() {
            document.getElementById('itemGrid').innerHTML = '<div style="padding: 24px; font-size: 16px; color: var(--text-muted);">連線中 🧱...</div>';
            fetchData();
        };

        function fetchData() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    allEquipmentData = data;
                    renderItems(allEquipmentData);
                })
                .catch(err => {
                    document.getElementById('itemGrid').innerHTML = '<div style="color: var(--accent-color); padding: 24px;">🦫 讀取資料失敗，請確認 API 網址是否正確。</div>';
                });
        }

        function renderItems(items) {
            const grid = document.getElementById('itemGrid');
            grid.innerHTML = ''; 

            let renderedCount = 0;

            items.forEach(item => {
                const total = parseInt(item.total) || 0;
                
                // 【核心 UI 邏輯】：一般老師看不到總數為 0 的已汰換設備，管理員才看得到
                if (!isAdmin && total <= 0) return;

                const isAvail = item.available > 0;
                const statusClass = isAvail ? 'status-avail' : 'status-none';
                
                // 如果總數為 0，加上視覺標記
                const isDisposed = total <= 0;
                const cardOpacity = isDisposed ? '0.6' : '1';
                const statusText = isDisposed ? '已全數報廢' : (isAvail ? '可借用' : '已借出');
                const badgeStyle = isDisposed ? 'background: #f2f2f2; color: #999;' : '';

                // 組裝財產標籤與存放地顯示
                const tagHTML = item.asset_tags ? `<div class="card-info">🏷️ 編號：${item.asset_tags}</div>` : '';
                const locHTML = item.location ? `<div class="card-info">📍 存放：${item.location}</div>` : '';

                let html = `
                    <div class="card" style="opacity: ${cardOpacity}">
                        <div class="card-header">
                            <div class="card-title">${item.name || '未命名設備'}</div>
                            <div class="status-badge ${statusClass}" style="${badgeStyle}">${statusText}</div>
                        </div>
                        <div class="card-info">分類：${item.category || '未分類'}</div>
                        ${locHTML}
                        ${tagHTML}
                        <div class="card-info">庫存：${item.available || 0} / ${total}</div>
                        
                        <div class="card-actions">
                            <button class="borrow-btn" ${(!isAvail || isDisposed) ? 'disabled' : ''} onclick="openBorrowModal('${item.name}')">
                                ${isDisposed ? '無法借用' : (isAvail ? '申請借用' : '暫無庫存')}
                            </button>
                            <button class="dispose-btn" style="display: ${isAdmin && !isDisposed ? 'block' : 'none'};" 
                                    onclick="openDisposeModal('${item.name}', ${item.available}, ${total})">
                                🛠️ 數量調整 / 汰換
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += html;
                renderedCount++;
            });

            if(renderedCount === 0) {
                grid.innerHTML = '<div style="padding: 40px; font-size: 16px; color: var(--text-muted); width: 100%; grid-column: 1 / -1;">🦫 這裡空空的... 找不到符合的設備喔！</div>';
            }
        }

        // --- 搜尋與過濾 ---
        function filterCategory(category) {
            currentCategory = category;
            document.getElementById('view-equipments').style.display = 'block';
            document.getElementById('view-records').style.display = 'none';
            document.getElementById('page-title').innerText = category === '全部' ? '全部器材' : category + '清單';
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            searchItems();
        }

        function searchItems() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const onlyAvail = document.getElementById('availFilter').checked;

            const filtered = allEquipmentData.filter(item => {
                const matchCat = currentCategory === '全部' || item.category === currentCategory;
                const matchKey = (item.name && item.name.toLowerCase().includes(keyword)) || 
                                 (item.asset_tags && item.asset_tags.toLowerCase().includes(keyword));
                const matchAvail = onlyAvail ? item.available > 0 : true;
                return matchCat && matchKey && matchAvail;
            });
            renderItems(filtered);
        }

        // --- 紀錄檢視 ---
        function showRecords() {
            document.getElementById('view-equipments').style.display = 'none';
            document.getElementById('view-records').style.display = 'block';
            document.getElementById('page-title').innerText = '異動與借用紀錄';
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById('nav-records').classList.add('active');

            const tbody = document.getElementById('recordsGrid');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px;">讀取中 🧱...</td></tr>';

            fetch(API_URL + "?action=records")
                .then(res => res.json())
                .then(data => {
                    tbody.innerHTML = '';
                    if(data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 60px; font-size: 16px; color: var(--text-muted);">🦫 目前沒有任何紀錄喔！</td></tr>';
                        return;
                    }

                    data.reverse().forEach(row => {
                        let sc = '#787774';
                        if(row['狀態'] === '申請中') sc = 'var(--accent-color)';
                        if(row['狀態'] === '耗材汰換' || row['狀態'] === '設備報廢') sc = 'var(--admin-color)';

                        const formatDt = (d) => d ? d.split('T')[0] : '';
                        tbody.innerHTML += `
                            <tr>
                                <td><span style="color: ${sc}; font-weight: 500;">${row['狀態'] || '未標示'}</span></td>
                                <td>${row['借用人'] || ''}</td>
                                <td>${row['處室班級'] || ''}</td>
                                <td>${row['借用器材'] || ''}</td>
                                <td>${formatDt(row['借用日期'])}</td>
                                <td>${formatDt(row['預計歸還'])}</td>
                                <td style="color: var(--text-muted);">${row['借用事由'] || ''}</td>
                            </tr>
                        `;
                    });
                });
        }

        // --- Modal 控制 ---
        function openBorrowModal(itemName) {
            document.getElementById('formItemName').value = itemName;
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('formStartDate').value = today;
            document.getElementById('formEndDate').value = today;
            document.getElementById('borrowModal').style.display = 'flex';
        }

        function openDisposeModal(itemName, maxAvail, maxTotal) {
            document.getElementById('disposeItemName').value = itemName;
            // 限制防呆：不能報廢大於現有庫存的數量
            document.getElementById('disposeQty').max = maxAvail; 
            document.getElementById('disposeModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // --- 送出表單 API ---
        function submitBorrow() {
            const payload = {
                action_type: 'borrow',
                item: document.getElementById('formItemName').value,
                name: document.getElementById('formName').value.trim(),
                unit: document.getElementById('formUnit').value.trim(),
                email: document.getElementById('formEmail').value.trim(),
                start: document.getElementById('formStartDate').value,
                end: document.getElementById('formEndDate').value,
                reason: document.getElementById('formReason').value.trim()
            };
            
            if(!payload.name || !payload.unit || !payload.email || !payload.reason) {
                alert('🐶 汪！請確認帶有 * 號的欄位都填寫完畢喔！');
                return;
            }
            if(new Date(payload.end) < new Date(payload.start)) {
                alert('預計歸還日期不能早於借用日期喔！'); return;
            }

            sendDataToGAS(payload, 'borrowModal');
        }

        function submitDispose() {
            const payload = {
                action_type: 'dispose',
                item: document.getElementById('disposeItemName').value,
                admin_name: document.getElementById('disposeAdminName').value.trim(),
                qty: document.getElementById('disposeQty').value,
                reason: document.getElementById('disposeReason').value.trim()
            };

            if(!payload.admin_name || !payload.qty || !payload.reason) {
                alert('請完整填寫處理人、數量與汰換原因！'); return;
            }
            if(parseInt(payload.qty) <= 0) {
                alert('數量必須大於 0'); return;
            }

            if(confirm(`⚠️ 確定要將 ${payload.qty} 個 [${payload.item}] 進行汰換/報廢扣除嗎？此動作將寫入異動紀錄。`)) {
                sendDataToGAS(payload, 'disposeModal');
            }
        }

        function sendDataToGAS(payload, modalId) {
            document.getElementById('loader').style.display = 'flex';

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                document.getElementById('loader').style.display = 'none';
                if(res.status === 'success') {
                    alert('✅ 處理成功！');
                    closeModal(modalId);
                    // 重新抓取最新資料以更新畫面庫存
                    fetchData(); 
                    
                    // 清空表單
                    document.querySelectorAll('input[type="text"], input[type="email"], input[type="number"]').forEach(el => el.value = '');
                } else {
                    alert('❌ 發生錯誤：' + res.message);
                }
            })
            .catch(err => {
                document.getElementById('loader').style.display = 'none';
                alert('連線異常，請稍後再試。');
            });
        }

        // --- 管理員登入切換 ---
        function adminLogin() {
            if (isAdmin) {
                alert('您目前已經是管理員模式囉！🦫');
                return;
            }
            
            const pwd = prompt("🔒 請輸入資訊組管理員密碼：");
            if (!pwd) return;

            document.getElementById('loader').style.display = 'flex';

            fetch(API_URL + "?action=verify_admin&pwd=" + pwd)
                .then(res => res.json())
                .then(res => {
                    document.getElementById('loader').style.display = 'none';
                    if(res.status === 'success') {
                        isAdmin = true;
                        alert('✅ 登入成功！已為您開啟「數量調整/汰換」功能。');
                        
                        // 改變左下角按鈕樣式
                        const btn = document.getElementById('adminBtn');
                        btn.innerText = '🔓 已登入管理員';
                        btn.classList.add('logged-in');
                        
                        // 重新渲染畫面顯示隱藏按鈕與已報廢設備
                        searchItems();
                    } else {
                        alert('❌ 密碼錯誤，請重新輸入。');
                    }
                })
                .catch(err => {
                    document.getElementById('loader').style.display = 'none';
                    alert('連線異常，請稍後再試。');
                });
        }
    </script>
</body>
</html>
