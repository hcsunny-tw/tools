<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>資訊設備查詢與借用系統</title>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-sidebar: #f7f7f5;
            --text-main: #37352f;
            --text-muted: #787774;
            --border-color: #ededeb;
            --accent-color: #ff6b6b; /* 明亮溫暖的強調色 */
            --accent-hover: #ff5252;
            --blue-action: #2383e2; 
            --touch-size: 44px; /* 平板觸好友善的最小高度 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

        body { display: flex; height: 100vh; background-color: var(--bg-main); color: var(--text-main); overflow: hidden; }

        /* 左側邊欄 */
        .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); padding: 24px 16px; display: flex; flex-direction: column; }
        .logo { font-size: 18px; font-weight: 600; margin-bottom: 32px; padding-left: 8px; display: flex; align-items: center; gap: 8px; }
        
        .nav-item { min-height: var(--touch-size); display: flex; align-items: center; padding: 0 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; color: var(--text-main); font-size: 16px; transition: background 0.2s; }
        .nav-item:hover { background-color: rgba(0, 0, 0, 0.04); }
        .nav-item.active { background-color: rgba(0, 0, 0, 0.06); font-weight: 500; }
        .admin-btn { margin-top: auto; color: var(--text-muted); font-size: 14px; min-height: var(--touch-size); display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 8px; }

        /* 右側主要內容區 */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .header h1 { font-size: 32px; font-weight: 700; margin-bottom: 24px; }

        /* 搜尋列 */
        .search-bar { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 250px; min-height: var(--touch-size); padding: 0 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; outline: none; }
        .search-input:focus { border-color: var(--blue-action); }
        .filter-checkbox { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--text-muted); cursor: pointer; min-height: var(--touch-size); }
        .filter-checkbox input { width: 20px; height: 20px; }

        /* 器材卡片網格 */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .card { border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; background: white; display: flex; flex-direction: column; transition: box-shadow 0.2s; }
        .card:hover { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-size: 18px; font-weight: 600; line-height: 1.4; }
        .status-badge { font-size: 13px; padding: 6px 10px; border-radius: 6px; font-weight: 500; }
        .status-avail { background: #e3fcef; color: #18794e; }
        .status-none { background: #ffebe9; color: #bf2419; }
        .card-info { font-size: 15px; color: var(--text-muted); margin-bottom: 8px; }
        
        .borrow-btn { margin-top: 16px; min-height: var(--touch-size); width: 100%; background-color: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-main); }
        .borrow-btn:hover:not(:disabled) { background-color: var(--blue-action); color: white; border-color: var(--blue-action); }
        .borrow-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 表格樣式 */
        .records-table-container { width: 100%; overflow-x: auto; border: 1px solid var(--border-color); border-radius: 12px; background: white; }
        .records-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 15px; }
        .records-table th, .records-table td { padding: 16px; border-bottom: 1px solid var(--border-color); }
        .records-table th { background-color: var(--bg-sidebar); color: var(--text-muted); font-weight: 500; white-space: nowrap; }
        .records-table tr:hover { background-color: rgba(0,0,0,0.02); }

        /* 借用表單 Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 15, 15, 0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 560px; border-radius: 16px; padding: 32px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 22px; font-weight: 600; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 15px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; min-height: var(--touch-size); padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--blue-action); }
        .form-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 200px; }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; }
        .btn-cancel, .btn-submit { min-height: var(--touch-size); padding: 0 24px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 500; }
        .btn-cancel { border: 1px solid var(--border-color); background: white; }
        .btn-submit { background: var(--accent-color); color: white; border: none; }
        .btn-submit:hover { background: var(--accent-hover); }

        /* Loading Overlay */
        .loader-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; font-size: 18px; font-weight: 500; flex-direction: column; gap: 12px;}
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">🧱 資訊設備管理</div>
        <div class="nav-item active" onclick="filterCategory('全部')">全部器材</div>
        <div class="nav-item" onclick="filterCategory('顯示設備')">顯示設備</div>
        <div class="nav-item" onclick="filterCategory('線材')">線材</div>
        <div class="nav-item" onclick="filterCategory('電腦周邊')">電腦周邊</div>
        
        <div style="height: 1px; background: var(--border-color); margin: 16px 0;"></div>
        <div class="nav-item" id="nav-records" onclick="showRecords()">📋 借用紀錄</div>
        <div class="admin-btn" onclick="adminLogin()">🔒 管理員入口</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 id="page-title">全部器材</h1>
        </div>

        <!-- 設備清單視圖 -->
        <div id="view-equipments">
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="搜尋器材名稱、規格... (例如: HDMI)" onkeyup="searchItems()">
                <label class="filter-checkbox">
                    <input type="checkbox" id="availFilter" onchange="searchItems()"> 只顯示可借用
                </label>
            </div>
            <div class="grid-container" id="itemGrid"></div>
        </div>

        <!-- 借用紀錄視圖 -->
        <div id="view-records" style="display: none;">
            <div class="records-table-container">
                <table class="records-table">
                    <thead>
                        <tr>
                            <th>狀態</th><th>借用人</th><th>處室/班級</th><th>器材名稱</th><th>借用日</th><th>預計歸還</th><th>事由</th>
                        </tr>
                    </thead>
                    <tbody id="recordsGrid"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 借用表單 Modal -->
    <div class="modal-overlay" id="borrowModal">
        <div class="modal-content">
            <div class="modal-title">填寫借用登記</div>
            <div class="form-group">
                <label>借用器材</label>
                <input type="text" id="formItemName" readonly style="background: #f7f7f5; color: var(--text-muted);">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>姓名 <span style="color:var(--accent-color)">*</span></label>
                    <input type="text" id="formName" placeholder="如: 王小明">
                </div>
                <div class="form-group">
                    <label>處室 / 班級 <span style="color:var(--accent-color)">*</span></label>
                    <input type="text" id="formUnit" placeholder="如: 教務處 ext.123">
                </div>
            </div>
            <div class="form-group">
                <label>電子信箱 Email <span style="color:var(--accent-color)">*</span></label>
                <input type="email" id="formEmail" placeholder="接收借用成功通知">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>借用日期 <span style="color:var(--accent-color)">*</span></label>
                    <input type="date" id="formStartDate">
                </div>
                <div class="form-group">
                    <label>預計歸還日期 <span style="color:var(--accent-color)">*</span></label>
                    <input type="date" id="formEndDate">
                </div>
            </div>
            <div class="form-group">
                <label>借用事由 <span style="color:var(--accent-color)">*</span></label>
                <input type="text" id="formReason" placeholder="如: 校內研習使用、課堂廣播">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-submit" onclick="submitForm()">確認登記</button>
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loader">
        <div style="font-size: 32px; margin-bottom: 8px;">⏳</div>
        <div>資料處理中...</div>
    </div>

    <script>
        // ⚠️ 請替換為您剛剛重新部署取得的新網址
        const API_URL = "https://script.google.com/macros/s/AKfycbwuVHBUJg1Zmfg1BWO7MzHGsf4eTD2PzaRD6H8GWHTCexNMBuF_ZSS8eXnjUpEDCknd/exec";

        let allEquipmentData = [];
        let currentCategory = '全部';

        window.onload = function() {
            document.getElementById('itemGrid').innerHTML = '<div style="padding: 24px; font-size: 16px;">資料載入中 🧱...</div>';
            
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    allEquipmentData = data;
                    renderItems(allEquipmentData);
                })
                .catch(err => {
                    document.getElementById('itemGrid').innerHTML = '<div style="color: var(--accent-color); padding: 24px;">讀取資料失敗，請確認 API 網址是否正確。</div>';
                });
        };

        function renderItems(items) {
            const grid = document.getElementById('itemGrid');
            grid.innerHTML = ''; 

            items.forEach(item => {
                const isAvail = item.available > 0;
                const statusClass = isAvail ? 'status-avail' : 'status-none';
                
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">${item.name || '未命名設備'}</div>
                            <div class="status-badge ${statusClass}">${isAvail ? '可借用' : '已借出'}</div>
                        </div>
                        <div class="card-info">分類：${item.category || ''}</div>
                        <div class="card-info" style="margin-bottom: 16px; flex: 1;">規格：${item.spec || '無'}</div>
                        <div class="card-info">庫存：${item.available || 0} / ${item.total || 0}</div>
                        <button class="borrow-btn" ${!isAvail ? 'disabled' : ''} onclick="openModal('${item.name}')">
                            ${isAvail ? '申請借用' : '暫無庫存'}
                        </button>
                    </div>
                `;
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            document.getElementById('view-equipments').style.display = 'block';
            document.getElementById('view-records').style.display = 'none';
            document.getElementById('page-title').innerText = category === '全部' ? '全部器材' : category + '清單';
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            searchItems();
        }

        function searchItems() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const onlyAvail = document.getElementById('availFilter').checked;

            const filtered = allEquipmentData.filter(item => {
                const matchCat = currentCategory === '全部' || item.category === currentCategory;
                const matchKey = (item.name && item.name.toLowerCase().includes(keyword)) || 
                                 (item.spec && item.spec.toLowerCase().includes(keyword));
                const matchAvail = onlyAvail ? item.available > 0 : true;
                return matchCat && matchKey && matchAvail;
            });
            renderItems(filtered);
        }

        function showRecords() {
            document.getElementById('view-equipments').style.display = 'none';
            document.getElementById('view-records').style.display = 'block';
            document.getElementById('page-title').innerText = '借用紀錄';
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById('nav-records').classList.add('active');

            const tbody = document.getElementById('recordsGrid');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px;">資料載入中 🧱...</td></tr>';

            fetch(API_URL + "?action=records")
                .then(res => res.json())
                .then(data => {
                    tbody.innerHTML = '';
                    if(data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 60px; font-size: 16px; color: var(--text-muted);">🦫 這裡空空的... 目前沒有任何借用紀錄喔！</td></tr>';
                        return;
                    }

                    data.reverse().forEach(row => {
                        let sc = '#787774';
                        if(row['狀態'] === '申請中') sc = '#e6a23c';
                        if(row['狀態'] === '借用中') sc = '--blue-action';
                        if(row['狀態'] === '已歸還') sc = '#18794e';

                        const formatDt = (d) => d ? d.split('T')[0] : '';
                        tbody.innerHTML += `
                            <tr>
                                <td><span style="color: ${sc}; font-weight: 500;">${row['狀態'] || '未標示'}</span></td>
                                <td>${row['借用人'] || ''}</td>
                                <td>${row['處室班級'] || ''}</td>
                                <td>${row['借用器材'] || ''}</td>
                                <td>${formatDt(row['借用日期'])}</td>
                                <td>${formatDt(row['預計歸還'])}</td>
                                <td style="color: var(--text-muted);">${row['借用事由'] || ''}</td>
                            </tr>
                        `;
                    });
                });
        }

        function openModal(itemName) {
            document.getElementById('formItemName').value = itemName;
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('formStartDate').value = today;
            document.getElementById('formEndDate').value = today;
            document.getElementById('borrowModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('borrowModal').style.display = 'none';
        }

        // 優化的前端驗證與送出機制
        function submitForm() {
            const name = document.getElementById('formName').value.trim();
            const unit = document.getElementById('formUnit').value.trim();
            const email = document.getElementById('formEmail').value.trim();
            const reason = document.getElementById('formReason').value.trim();
            const start = document.getElementById('formStartDate').value;
            const end = document.getElementById('formEndDate').value;
            
            // 1. 必填欄位驗證
            if(!name || !unit || !email || !reason || !start || !end) {
                alert('請確認所有帶有 * 號的欄位都已填寫完畢！');
                return;
            }

            // 2. 日期邏輯驗證
            if(new Date(end) < new Date(start)) {
                alert('預計歸還日期不能早於借用日期喔！');
                return;
            }

            const payload = {
                item: document.getElementById('formItemName').value,
                name: name,
                unit: unit,
                email: email,
                start: start,
                end: end,
                reason: reason
            };

            document.getElementById('loader').style.display = 'flex';

            // 3. 透過 POST 傳送資料到 GAS
            fetch(API_URL, {
                method: 'POST',
                // 使用 text/plain 避免 CORS 預檢請求錯誤
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                document.getElementById('loader').style.display = 'none';
                if(res.status === 'success') {
                    alert('借用申請已成功送出！系統將寄發通知信至您的信箱。');
                    closeModal();
                    // 清空表單
                    document.getElementById('formName').value = '';
                    document.getElementById('formUnit').value = '';
                    document.getElementById('formEmail').value = '';
                    document.getElementById('formReason').value = '';
                } else {
                    alert('發生錯誤：' + res.message);
                }
            })
            .catch(err => {
                document.getElementById('loader').style.display = 'none';
                alert('網路連線異常，請稍後再試。');
            });
        }

        function adminLogin() {
            const pwd = prompt("請輸入管理員密碼：");
            if (!pwd) return; // 如果按取消或沒輸入就跳出

            document.getElementById('loader').style.display = 'flex'; // 顯示載入中動畫

            // 向 GAS 發送密碼驗證請求
            fetch(API_URL + "?action=verify_admin&pwd=" + pwd)
                .then(res => res.json())
                .then(res => {
                    document.getElementById('loader').style.display = 'none';
                    if(res.status === 'success') {
                        alert('✅ 密碼正確！\n\n(未來我們可以接著在這裡實作：隱藏借用按鈕，顯示「核准」或「歸還」按鈕)');
                        // 之後您管理員專屬的畫面切換邏輯會寫在這裡
                    } else {
                        alert('❌ 密碼錯誤，請重新輸入。');
                    }
                })
                .catch(err => {
                    document.getElementById('loader').style.display = 'none';
                    alert('連線異常，請稍後再試。');
                });
        }
    </script>
</body>
</html>
